# osv-scanner policy for the `Dependency scan` CI job (T-0005).
#
# The job fails on ANY known vulnerability in pnpm-lock.yaml, whatever its
# severity: OSV severities are frequently missing or late, and "unscored" must
# not read as "fine". The only way past a finding is an entry below, which is a
# reviewed diff with a reason and an expiry.
#
# BASELINE, NOT ACCEPTANCE. Every entry below was already in the lockfile when
# the scan was introduced (2026-10-02): 36 findings in 14 packages, 1 critical
# and 13 high. Most are in dev and test tooling (vitest, vite, nx, esbuild,
# testcontainers' undici and uuid). One was in the API's runtime path —
# drizzle-orm, via @kasuwa/db — and was upgraded to 0.45.3 by T-0037, so its
# entry (GHSA-gpj5-g38j-94v9) is gone. Fixing the rest needs major upgrades
# (vitest 3/4, nx 22, vite 6), which is its own task.
#
# They expire together on 2026-10-31. After that date the scan goes red until
# each is fixed or re-accepted with a real, per-finding reason. That is
# deliberate: a baseline with no expiry is a permanent exemption.

