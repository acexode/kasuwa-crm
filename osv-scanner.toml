# osv-scanner policy for the `Dependency scan` CI job (T-0005, re-triaged by T-0153).
#
# The job fails on ANY known vulnerability in pnpm-lock.yaml, whatever its
# severity: OSV severities are frequently missing or late, and "unscored" must
# not read as "fine". The only way past a finding is an entry below, which is a
# reviewed diff with a reason and an expiry.
#
# T-0153 (2026-10-26). The T-0005 baseline expired on 2026-10-31 and was
# boilerplate ("pre-existing"). Each finding was read again against the lockfile
# and this repo's use of the package:
#
#   FIXED by an upgrade (entry deleted). Same-major patch fixes, taken in
#   package.json "pnpm.overrides" where a parent pins the old version exactly,
#   and in the apps' own devDependencies:
#     minimatch 9.0.3 -> 9.0.9, picomatch 4.0.2 -> 4.0.7  (nx's exact pins)
#     esbuild 0.24.2 -> ^0.25.12                          (apps/api, realtime, worker)
#     next 15.5.26 -> 15.5.28, sharp 0.35.4 -> 0.35.5     (apps/web; runtime)
#     multer 2.4.0 -> 2.5.0, body-parser 2.3.0 -> 2.4.0   (apps/api; runtime)
#     fast-uri 3.1.8 -> 3.1.9, follow-redirects 1.16.0 -> 1.16.1,
#     postcss-selector-parser 6.1.4 -> 6.1.5, source-map-js 1.2.1 -> 1.2.2
#   WITHDRAWN upstream (entry deleted): GHSA-vfj7-8cjw-p6xm (braces).
#
#   RE-ACCEPTED below, one entry per advisory, for one quarter. Every one is in
#   dev, test or build tooling that never reaches a runtime closure, and each
#   says why it is not reachable here and what ends it. The ones that need a
#   major upgrade (vitest 3/4, vite 6, nx 22, testcontainers) are not this task.
#
#   ACCEPTED, RUNTIME-BOUNDED (D-L206): none left. GHSA-8cw4-87c7-c6xx (csv-parse
#   5.6.0) was fixed by T-0197 (csv-parse 7) and GHSA-mrhx-c7xc-m3w5 (zod 3.25.76)
#   by T-0198 (zod 4.6.7); both entries are gone.
#   See team/reports/T-0153.md for the analysis.
#
# The new expiry is 2027-01-31. After it the scan goes red until each entry is
# fixed or re-accepted with a real, per-finding reason. That is deliberate: a
# baseline with no expiry is a permanent exemption.

