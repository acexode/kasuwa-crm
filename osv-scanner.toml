reason = "postcss 8.4.31 (pinned exactly by next 15.5.28 in apps/web): arbitrary file read through an attacker-controlled sourceMappingURL in CSS comments (CVSS 7.5, fixed in 8.5.12). build-only: it runs while Next compiles this repo's own Tailwind CSS, and `next start` serves the compiled output. not reachable: it never processes CSS from a user or from outside this repo, and no sourceMappingURL or stringified CSS from a request reaches it. fix: it clears when Next moves its postcss pin. An override to 8.5.x was not taken: it would change the CSS pipeline that the PRD 2.13 page byte budgets (zero headroom on the pipeline board) are measured against, so it needs its own measured task."

