# Local development stack for Kasuwa.
# Brought up by `pnpm dev` (tools/dev.mjs). Nothing here is production-shaped;
# infrastructure-as-code for real environments is Agent 13's (DevOps) scope.
#
# PORTS: the dev stack deliberately avoids the default ports. A developer with a
# locally installed Postgres, Redis or OpenSearch would otherwise either fail to
# start the stack or - far worse - silently connect to the wrong server, because
# on Windows `localhost` resolves to ::1 and can reach a native service before
# Docker's proxy. That failure looks like "password authentication failed" and
# costs an hour. Container-internal ports are unchanged.
#
# LOOPBACK ONLY (D-L155): every published port binds 127.0.0.1, so the dev
# database, cache, search and object store (with their committed development
# credentials) are never reachable from the local network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kasuwa-postgres
    environment:
      POSTGRES_DB: kasuwa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['127.0.0.1:55432:5432']
    volumes:
      # The entrypoint runs these in name order, only when the volume is new;
      # `pnpm dev` re-applies both (they are idempotent) so an older volume gains
      # a role added since (packages/db/CLAUDE.md). The Testcontainers harness
      # applies the same two files in the same order.
      #
      # 10: bootstrap.sql - kasuwa_app / kasuwa_migrator / kasuwa_sweeper /
      #     kasuwa_auth and their grants, and kasuwa_test_admin as an inert
      #     NOLOGIN placeholder. This is the file real provisioning applies.
      # 20: bootstrap-test.sql - DEVELOPMENT AND TEST ONLY: makes
      #     kasuwa_test_admin the BYPASSRLS login the harness uses (T-0117,
      #     D-L94). Never mount or apply it anywhere real; the migration runner
      #     and the API and worker refuse it outside development and test.
      - ./packages/db/sql/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
      - ./packages/db/sql/bootstrap-test.sql:/docker-entrypoint-initdb.d/20-bootstrap-test.sql:ro
      - kasuwa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kasuwa']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kasuwa-redis
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: kasuwa-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports: ['127.0.0.1:59200:9200']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # S3-compatible object storage for local parity.
  #
  # NOT MinIO, which the founding pack and the brief both name. MinIO's public
  # Docker Hub images stopped being pullable without a subscription, and Bitnami
  # moved its catalogue behind a paywall in the same period, so neither survives
  # the "works on a clean machine" test. SeaweedFS speaks the S3 API, pulls
  # freely and is a real storage system rather than a mock (D-L21).
  #
  # CREDENTIALLED (T-0092, ADR-0017; ends D-L21's anonymous mode). The S3
  # gateway reads its identities from tools/seaweedfs/s3-identities.json, a
  # development-only credential that .env.example repeats, so every request is
  # signed and an unsigned one is refused. See tools/seaweedfs/README.md.
  #
  # -s3.allowedOrigins: the web app's origins, no wildcard. SeaweedFS 3.80 has
  # no per-bucket CORS, and without this flag it answers every origin's
  # preflight with `*` (R11).
  #
  # The bucket (S3_BUCKET, default kasuwa-local) is created by `pnpm dev`
  # (tools/dev.mjs) through `weed shell` inside this container.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: kasuwa-s3
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=http://localhost:3000,http://127.0.0.1:3000
      -master.port=9333 -volume.port=8080 -filer
    ports: ['127.0.0.1:59000:8333', '127.0.0.1:59333:9333']
    volumes:
      - ./tools/seaweedfs/s3-identities.json:/etc/seaweedfs/s3.json:ro
      - kasuwa-s3:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9333/cluster/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kasuwa-pgdata:
  kasuwa-s3:
