name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '9.7.0'

jobs:
  # --------------------------------------------------------------------------
  # Guard: acceptance tests and migrations are lead-owned.
  #
  # Addendum A1 section 3.3, principle 3: builders must not be able to make an
  # acceptance test pass by editing it. Migrations get the same treatment
  # because they are the least reversible thing in the repo.
  #
  # HONEST LIMITATION: labels can be applied by anyone with write access, so
  # this is a speed bump and an audit trail, not an access control. The real
  # control is branch protection plus review on those paths (CODEOWNERS).
  # --------------------------------------------------------------------------
  guard-protected-paths:
    name: Guard protected paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes to protected paths
        id: detect
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- tests/acceptance packages/db/migrations || true)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Protected files changed:"
            echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the lead-approved label
        if: steps.detect.outputs.changed == 'true'
        run: |
          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          echo "Labels: $labels"
          if echo "$labels" | grep -q '"lead-approved"'; then
            echo "lead-approved present; protected-path changes allowed."
          else
            echo "::error::This pull request changes tests/acceptance/ or packages/db/migrations/ but is not labelled 'lead-approved'."
            echo "::error::Acceptance tests are written by the lead from the PRD and must not be edited to make a build pass."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # A configured-but-inert boundary rule is worse than none: everyone stops
      # thinking about boundaries. This proves the rule actually fires.
      - name: Verify module boundaries are enforced
        run: pnpm lint:boundaries:verify

      # tokens.css is generated from tokens.ts. If they can drift, the design
      # system has two sources of truth.
      - name: Check generated design tokens are current
        run: |
          pnpm ui:tokens
          git diff --exit-code -- packages/ui/src/tokens.css

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Testcontainers uses the Docker daemon that ubuntu-latest already runs.
      - run: pnpm test:integration

  # --------------------------------------------------------------------------
  # The isolation suite is the blocking gate (founding pack 3.3, Addendum 3.5).
  # It runs as its own job so that a failure is unambiguous in the checks list
  # and can be made a required status check on its own.
  # --------------------------------------------------------------------------
  isolation:
    name: Tenant isolation suite
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:isolation

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - run: pnpm i18n:pseudo
      - run: pnpm build
