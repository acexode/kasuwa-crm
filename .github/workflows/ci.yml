name: CI

on:
  pull_request:
  push:
    branches: [main]
  # D-L207: the full gate (UI acceptance and e2e) runs nightly on main and on
  # demand: `gh workflow run CI --ref <branch>`. It does not run on every PR.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Least privilege, stated rather than inherited. `actions: read` is what
# nrwl/nx-set-shas needs to find the last green run on main; without it every
# push to main failed lint, typecheck and unit before running anything.
permissions:
  contents: read
  actions: read

concurrency:
  # The event is part of the group (D-L207), so a push to main never cancels a
  # nightly or on-demand full-gate run that is still going.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'
  PNPM_VERSION: '9.7.0'

jobs:
  # The protected-path guard lives in .github/workflows/guard.yml, because it
  # must also run on `labeled`/`unlabeled` and re-running every suite on each
  # label change would be wasteful.

  # --------------------------------------------------------------------------
  # Lint, typecheck and unit tests are INCREMENTAL (T-0005): `nx affected`
  # against the base nrwl/nx-set-shas computes (the PR base, or on main the last
  # green commit), plus the local Nx cache, so a one-file PR does not re-lint
  # nineteen projects. A change to a shared input (tsconfig.base.json,
  # eslint.config.mjs, the lockfile) marks everything affected — see
  # `namedInputs.sharedGlobals` in nx.json.
  #
  # The tenancy gate is NOT incremental, and must never be. See `isolation`.
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-lint-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-lint-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm exec nx affected -t lint

      # A configured-but-inert boundary rule is worse than none: everyone stops
      # thinking about boundaries. This proves the rule actually fires.
      - name: Verify module boundaries are enforced
        run: pnpm lint:boundaries:verify

      # No task may be assigned while its acceptance tests are still stubs
      # (team/DECISION-LOG.md D-L23). Mechanical, because the rule fails at
      # exactly the moment everyone is busiest.
      - name: Verify task readiness
        run: pnpm verify:tasks

      # The design tokens are imported from the committed Claude Design export
      # and the CSS and Tailwind preset are generated from those. If any of the
      # three can drift, the design system has more than one source of truth —
      # and the one people edit is never the one that ships.
      - name: Check imported design tokens are current
        run: |
          pnpm ui:import-design
          git diff --exit-code -- packages/ui/src/tokens.colours.generated.ts

      - name: Check generated tokens CSS and Tailwind preset are current
        run: |
          pnpm ui:tokens
          git diff --exit-code -- packages/ui/src/tokens.generated.css packages/ui/tailwind-preset.cjs

      # The icon font holds only the names in packages/ui/icon-subset.txt; any
      # other name renders as a blank box, silently and only in production.
      # The IconName union catches most at compile time; this catches the rest
      # (raw k-icon spans, ternary arms, any app). Unused glyphs only warn.
      - name: Verify every icon used is in the font subset
        run: pnpm verify:icons

  # --------------------------------------------------------------------------
  # The git hooks, mirrored (D-L34). There is no branch protection on this
  # repository, so `git commit --no-verify` skips .husky/commit-msg and
  # .husky/pre-commit with nothing to stop it. Every check those hooks run is
  # therefore also run here, blocking:
  #   pre-commit  `nx affected -t lint typecheck`  -> the `lint` and `typecheck` jobs
  #   commit-msg  `commitlint --edit`              -> this job, over EVERY commit
  #               in the pull request, not just its title (a squash-merge title
  #               is checked by nobody, and the commits are what `git log` keeps).
  # --------------------------------------------------------------------------
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The whole history: commitlint walks base..head, and a depth-1 checkout
      # has a single commit, so it would lint nothing it was meant to.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # --------------------------------------------------------------------------
  # The feature register (D-L36, T-0034). team/FEATURES.md is generated from
  # the PRD, the OpenAPI specs, the flag registry, the e2e screen manifests,
  # the task files and team/DECISIONS.md. A change to any of them that is not
  # reflected in the register fails here, so a flag, a deferral or a mock-only
  # screen cannot arrive without a row. Fix: `pnpm features`, commit the result.
  # --------------------------------------------------------------------------
  features:
    name: Feature register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check team/FEATURES.md is current
        run: pnpm features:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - uses: nrwl/nx-set-shas@v4
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-typecheck-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-typecheck-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm exec nx affected -t typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      # On a pull request, only the unit tests whose module graph reaches a
      # changed file (vitest re-runs everything if a package.json or vitest
      # config changed). On main, all of them: whatever `--changed` missed is
      # caught one merge later at the latest, not never.
      - name: Unit tests (related to the change on a PR, all on main)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec vitest run --project unit --changed "$NX_BASE" --reporter=default --reporter=junit --outputFile.junit=reports/unit/junit.xml
          else
            pnpm test:unit --reporter=default --reporter=junit --outputFile.junit=reports/unit/junit.xml
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: reports/unit
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Testcontainers uses the Docker daemon that ubuntu-latest already runs.
      - run: pnpm test:integration --reporter=default --reporter=junit --outputFile.junit=reports/integration/junit.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-report
          path: reports/integration
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # The isolation suite is the blocking gate (founding pack 3.3, Addendum 3.5).
  # It runs as its own job so that a failure is unambiguous in the checks list
  # and can be made a required status check on its own.
  # --------------------------------------------------------------------------
  isolation:
    name: Tenant isolation suite
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The harness-driven suites moved to `ui-acceptance` (D-L207), but a few
      # suites left here still render pages or read built output, so the
      # tokens, the pseudo-locale and the browser stay.
      - run: pnpm ui:tokens
      - run: pnpm i18n:pseudo
      - run: pnpm --filter @kasuwa/e2e exec playwright install --with-deps chromium
      # The WHOLE suite, every time. Never `nx affected`, never `--changed`: a
      # change to a migration, a guard or an RLS policy breaks isolation in
      # files the diff never touched. Red here means do not merge —
      # docs/runbooks/red-isolation-check.md.
      - run: pnpm test:isolation --reporter=default --reporter=junit --outputFile.junit=reports/isolation/junit.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolation-test-report
          path: |
            reports/isolation
            tests/e2e/.artifacts
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # UI acceptance (D-L207): the acceptance suites that drive the browser
  # harness. They are UI acceptance, not tenancy, and they were ~95% of the
  # isolation job's time, so they run in the full gate only: nightly on main,
  # on demand, and before a slice or the phase is closed.
  # --------------------------------------------------------------------------
  ui-acceptance:
    name: UI acceptance (full gate)
    runs-on: ubuntu-latest
    needs: [unit]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - run: pnpm i18n:pseudo
      - run: pnpm --filter @kasuwa/e2e exec playwright install --with-deps chromium
      - run: pnpm test:ui-acceptance --reporter=default --reporter=junit --outputFile.junit=reports/ui-acceptance/junit.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-acceptance-test-report
          path: |
            reports/ui-acceptance
            tests/e2e/.artifacts
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Scanning (T-0005). Both blocking, both on every PR and every push to main.
  # --------------------------------------------------------------------------

  # GitGuardian also runs as a GitHub App check, but an App check can be
  # declined and does not run on a fork. This fails the build. The WHOLE history
  # is scanned (about two seconds today), so a secret cannot be committed and
  # then deleted in a later commit of the same PR. Known, deliberate example
  # values are listed by fingerprint in .gitleaksignore; `--redact` keeps any
  # real finding out of the job log.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the repository history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  # Known vulnerabilities in the resolved dependency tree (pnpm-lock.yaml),
  # against the OSV database. See osv-scanner.toml for the severity policy and
  # for how an assessed finding is accepted.
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: '2.6.0'
      OSV_SCANNER_SHA256: 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108'
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner (pinned, checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfile for known vulnerabilities
        run: '"$RUNNER_TEMP/osv-scanner" scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - run: pnpm i18n:pseudo
      # The completeness gate. It fails on a menu language with a structural
      # defect; a language that is merely unreviewed is held back rather than
      # failed, which is the designed steady state under D-P1.
      - run: pnpm i18n:validate
      - run: pnpm build

  # --------------------------------------------------------------------------
  # End-to-end (T-0008). Runs after `build`, because a suite that drives the app
  # has nothing useful to say about a workspace that does not compile — and the
  # failure it would report is the build failure, one layer less legibly.
  #
  # `pnpm test:e2e` starts its own Postgres (Testcontainers), the API and the
  # web app on free ports, so there are no service containers to declare here.
  # --------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [build]
    # D-L207: full gate only (nightly, on demand, end of slice and phase).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:tokens
      - run: pnpm i18n:pseudo
      # Chromium only. Another engine doubles the CI minutes and buys nothing
      # until something actually differs between them.
      - run: pnpm --filter @kasuwa/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # A red e2e job that cannot be diagnosed without re-running it locally is
      # ignored within a fortnight. Traces and screenshots are retained on
      # failure by playwright.config.ts; this is what makes them reachable.
      # Artefacts from a green run are noise, hence `if: failure()`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-and-screenshots
          path: tests/e2e/.artifacts
          retention-days: 7
          if-no-files-found: warn
