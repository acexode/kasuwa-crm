  responses:
    ValidationFailed:
      description: |
        The request did not parse: a non-uuid id, an unsupported locale, a
        bad query value or cursor, an unknown or server-owned body property,
        a graph of the wrong shape, a node that is not on the run's path, a
        choice that is not the node's, or an answer that breaks its field's
        rules. `details` names paths and reason codes, never the submitted
        value (an answer is `sensitive`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            badCursor:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: cursor
                    code: invalid_cursor
            notOnPath:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: nodeId
                    code: not_on_path
            nulCharacter:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: note
                    code: nul_character
            badAnswer:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: values.amount
                    code: too_small

    NotAuthenticated:
      description: |
        No usable session. It does not say whether the token was missing,
        expired, revoked or from another tenant.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 401
            error: Unauthorized
            code: not_authenticated
            message: Not authenticated

    NotFound:
      description: |
        **One body for all of:** no such record, a record in another tenant,
        a record in a programme the caller does not reach, and a record the
        caller may not read (a script without `script.write`; another agent's
        run, whoever asks). A `403` here would confirm the id names something
        real.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    NotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the record (or reaches the target programme) and may not do this:
        no `script.write` or `script.run` there, or no `activity.write` to
        log the call. Another agent's run is never `403`: it is `404`, and
        so is a run whose own agent lost `script.run`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 403
            error: Forbidden
            code: not_permitted
            message: You do not have permission to do that.

    StaleWrite:
      description: |
        `revision` is not current: somebody saved since your last read.
        Nothing was applied. Re-read and re-apply; do not retry blind.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 409
            error: Conflict
            code: stale_write
            message: Someone else saved changes while you were editing. Reload and try again.

    PublishConflict:
      description: Nothing was published.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            staleWrite:
              value:
                statusCode: 409
                error: Conflict
                code: stale_write
                message: Someone else saved changes while you were editing. Reload and try again.
            scriptInvalid:
              value:
                statusCode: 409
                error: Conflict
                code: script_invalid
                message: The script cannot be published yet.
                details:
                  - path: nodes.payq.choices.cb.next
                    code: unknown_target
                  - path: nodes.ptp
                    code: unreachable_end

    StartConflict:
      description: No run was started.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            scriptNotPublished:
              value:
                statusCode: 409
                error: Conflict
                code: script_not_published
                message: This script has no published version yet.

    AdvanceConflict:
      description: The run did not move.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            runCompleted:
              value: { statusCode: 409, error: Conflict, code: run_completed, message: This run is already completed. }
            runStopped:
              value: { statusCode: 409, error: Conflict, code: run_stopped, message: This run has stopped. Complete it with a disposition. }
            staleWrite:
              value: { statusCode: 409, error: Conflict, code: stale_write, message: Someone else saved changes while you were editing. Reload and try again. }
            runAtEnd:
              value: { statusCode: 409, error: Conflict, code: run_at_end, message: This is the end of the script. Choose a disposition. }
            complianceUnacknowledged:
              value:
                statusCode: 409
                error: Conflict
                code: compliance_unacknowledged
                message: Confirm you read the statement in full first.
                details:
                  - { path: nodes.rec, code: not_acknowledged }
            answersIncomplete:
              value:
                statusCode: 409
                error: Conflict
                code: answers_incomplete
                message: Fill in the required fields first.
                details:
                  - { path: values.date, code: required }
                  - { path: values.reason, code: required }

    RunWriteConflict:
      description: Nothing was written.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            runCompleted:
              value: { statusCode: 409, error: Conflict, code: run_completed, message: This run is already completed. }
            runStopped:
              value: { statusCode: 409, error: Conflict, code: run_stopped, message: This run has stopped. Complete it with a disposition. }
            staleWrite:
              value: { statusCode: 409, error: Conflict, code: stale_write, message: Someone else saved changes while you were editing. Reload and try again. }

    CompleteConflict:
      description: The run was not completed, and no activity or task was written.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            runCompleted:
              value: { statusCode: 409, error: Conflict, code: run_completed, message: This run is already completed. }
            staleWrite:
              value: { statusCode: 409, error: Conflict, code: stale_write, message: Someone else saved changes while you were editing. Reload and try again. }
            complianceUnacknowledged:
              value:
                statusCode: 409
                error: Conflict
                code: compliance_unacknowledged
                message: Some compliance statements have not been confirmed as read.
                details:
                  - { path: nodes.readback, code: not_acknowledged }
            completedAwayFromEnd:
              summary: outcome completed before an end node (D-L91 review); use interrupted
              value:
                statusCode: 409
                error: Conflict
                code: compliance_unacknowledged
                message: The script did not reach an end. Complete it as interrupted.
                details:
                  - { path: outcome, code: not_at_end }
            dispositionNotLive:
              value: { statusCode: 409, error: Conflict, code: disposition_not_live, message: That disposition is no longer available. Choose another. }
            dispositionRequirementsUnmet:
              value:
                statusCode: 409
                error: Conflict
                code: disposition_requirements_unmet
                message: This disposition needs more before it can be saved.
                details:
                  - { path: followUp, code: required }

