      operationId: listDispositions
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/B5']
      description: |
        `usageCount90d` is the number the delete dialog leans on — "Agents
        picked this 3,214 times in the last 90 days". It is an aggregate over
        interactions (M10/M16) and is therefore `null`, not `0`, when the count
        is unavailable; the dialog then omits the sentence rather than telling
        an admin that a heavily used code is unused before they delete it.

        Order is `position`, ascending, and it is the order agents see.
      responses:
        '200':
          description: The dispositions.
          content:
