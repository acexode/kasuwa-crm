openapi: 3.1.0

# ---------------------------------------------------------------------------
# Kasuwa admin console API — T-0021 (M1/M2, Agent 1).
#
# This file is the PUBLISHED CONTRACT for P02, the 22 admin-console screens
# (docs/design/P02/MANIFEST.md). It is committed before any implementation so
# that Agent 11 can GENERATE a mock from it and build against that mock. A
# hand-written mock drifts silently and the wiring step then finds 22 screens
# built against a fiction.
#
# Five things here are load-bearing and must not be "tidied":
#
# 1. SCOPE IS RESOLVED, NEVER SUPPLIED. No operation accepts `programmeIds`,
#    `tenantId` or any other scope argument, in a body, a query string or a
#    header. A request says *who* it is; the database says *what it can reach*,
#    by reading `user_programme` inside the tenant transaction, on every
#    request. A `{programmeId}` in a path is a RECORD IDENTIFIER, not scope —
#    see point 2.
#
# 2. A RECORD OUTSIDE YOUR SCOPE IS 404, NOT 403. `404 not_found` covers all
#    of: no such programme, a programme in another tenant, and a programme in
#    this tenant that this caller cannot reach. One status, one body, one
#    `code`. `403 not_permitted` exists but is narrow: it means "you can
#    already read this record and you may not perform this action on it". It
#    is never used to say that something exists.
#
# 3. NOTHING HERE CARRIES A NIN, A BVN, A PAN, A DATE OF BIRTH OR A HOME
#    ADDRESS, and it carries an email address or a phone number only where the
#    screen cannot work without one — in which case it is masked. The audit
#    log is the sharp edge: an entry that names its subject is the classic
#    place personal data escapes a system that is careful everywhere else. See
#    `AuditEntry` and read the whole description before adding a field to it.
#
# 4. EVERY FAILURE IS A CONCRETE BODY, not prose. Switch on `error.code` (a
#    stable machine string), never on `message` (English, and it will change).
#    Localise as `admin.error.<code>`.
#
# 5. THE ADMIN CONSOLE IS THE MOST AUDITED SURFACE IN THE PRODUCT.
#    `x-kasuwa-audited: true` marks an operation that MUST write an audit row
#    when it is implemented. Guardrail 6.7 is not satisfied by a comment.
#
# Status of each operation is given by `x-kasuwa-implemented`:
#   true     — live today.
#   partial  — some fields are backed by real data, the rest are contract only.
#              See the description for which.
#   false    — contract only. Nothing behind it. The shape is published so the
#              screen can be built; keep that screen on the mock.
#
# AT THE TIME OF WRITING (T-0021) EXACTLY ONE OPERATION WAS `partial` AND NONE
# WAS `true`. T-0024 has since built the four programme reads and the rename.
# There is no admin controller, no role table, no permission-set table, no
# field-security table and no audit table. That is the honest state and the
# point of publishing this now.
# ---------------------------------------------------------------------------

info:
  title: Kasuwa Admin API
  version: 1.0.0-T-0021
  description: |
    Programmes, roles, field-level security and the audit log — the read and
    write surface behind the P02 admin console.

    **What this is not.** It is not a permissions model. `packages/permissions`
    is a placeholder and the engine has not been designed. This contract names
    permission *sets* because the field-security screen has a column per set,
    and it says nothing whatever about how a permission is evaluated, where a
    grant is stored, or whether a grant is tenant-wide or per-programme. The
    one operation whose semantics would depend on that answer — writing the
    field-security matrix — specified; D-P9 settled its semantics on 2026-10-02.

    **Localisation.** The API returns an English `message` as a fallback only.
    The web app localises from `error.code` using `admin.error.<code>`. The
    catalogue keys are Agent 11's (P02 build); T-0021 adds none, because adding
    a key to `en` alone leaves the other catalogues incomplete.

    **Times.** Every timestamp in every payload is UTC, ISO 8601, with a `Z`.
    The audit screen labels its column "Time (WAT)" — that conversion is the
    browser's, using the tenant's display zone. The server never sends a local
    time and never sends a naive one. A BPO roster spans WAT/EAT/SAST; "the
    date" is never unambiguous.

    **Money** is minor units plus an ISO currency code, never a float. The
    usage meters on the admin home are the only place money appears here.

    **Transport.** `Authorization: Bearer ksw_s1_…` and nothing else. A token
    in a query string is ignored and the request is unauthenticated.

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://{host}
    description: Deployed cell
    variables:
      host:
        default: api.kasuwa.example

tags:
  - name: admin-home
    description: The landing screen — setup health, alerts, usage, settings menu.
  - name: programmes
    description: The BPO isolation boundary and everything configured inside one.
  - name: roles
    description: The role hierarchy. Who can see whose records.
  - name: field-security
    description: Which permission sets may read or edit which field.
  - name: audit
    description: The immutable record of admin, security and data actions.

paths:
  # =========================================================================
  # Admin home — P02/A, P02/A1
  # =========================================================================
  /api/v1/admin/home/summary:
    get:
      tags: [admin-home]
      summary: Workspace header and setup-health score
      operationId: getAdminHomeSummary
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/A']
      description: |
        The page header ("Sabi Contact Centres Ltd · Enterprise plan · 6
        countries · 214 users"), the data-residency pill in the top bar, and
        the setup-health card.

        **The score is derived, not stored.** Each check is a named rule with a
        point value; the score is the sum of the passing rules over the total.
        The client must not compute it — a second implementation of the rules
        in the browser is a second implementation to keep in step. `checkId` is
        stable and is what the "Fix" button routes on; `settingId` names the
        settings-menu destination so the client does not hard-code a route map.

        **Nobody owns the health rules.** There is no PRD module that defines
        which checks exist or what each is worth. Raised in the T-0021 report.
      responses:
        '200':
          description: The workspace summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHomeSummary' }
              example:
                tenant:
                  id: 11111111-0000-4000-8000-000000000001
                  name: Sabi Contact Centres Ltd
                  planName: Enterprise
                  countryCount: 6
                  userCount: 214
                dataRegion:
                  code: af-south-1
                  displayName: South Africa
                health:
                  score: 78
                  outOf: 100
                  pointsAvailable: 22
                  checkedAt: '2026-09-30T09:55:00.000Z'
                  checks:
                    - checkId: sso_configured
                      label: SSO with Microsoft Entra ID
                      status: pass
                      points: 0
                      settingId: u-sso
                    - checkId: whatsapp_template_rejected
                      label: 1 WhatsApp template rejected
                      status: fail
                      points: 8
                      settingId: ch-wa
                    - checkId: users_without_mfa
                      label: 2 users without MFA
                      status: warn
                      points: 6
                      settingId: u-mfa
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/home/alerts:
    get:
      tags: [admin-home]
      summary: Open workspace alerts
      operationId: listAdminAlerts
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/A']
      description: |
        The alerts card, including its empty state and "Show dismissed alerts".

        Every alert body in the design names something — a template, a user, a
        request reference. **An alert body must not name a customer**, only
        Kasuwa users and Kasuwa configuration. The MFA alert naming two staff
        members is in scope; a DSR alert naming the data subject is not, which
        is why `DSR-0142` is a reference and not a person.

        The alerts themselves come from six different modules (Meta template
        state from M8, MFA policy from M2, DSR from M21, seats from M23,
        sender-ID state from M8). **No module owns the aggregation.** Raised in
        the T-0021 report.
      parameters:
        - name: includeDismissed
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            The design's "Show dismissed alerts" link. Dismissal is per user,
            not per workspace — one admin clearing an alert must not hide it
            from another.
      responses:
        '200':
          description: The alert list. May be empty; the screen has a state for that.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAlertList' }
              example:
                items:
                  - id: 8f2c7a10-0000-4000-8000-00000000a001
                    severity: danger
                    category: channels
                    title: WhatsApp template rejected
                    body: '“payment_reminder_v3” for Eko Bank Collections was rejected by Meta: promotional wording in a utility template.'
                    sourceLabel: Meta
                    raisedAt: '2026-09-30T07:30:00.000Z'
                    actionLabel: Edit template
                    settingId: ch-wa
                    dismissed: false
                  - id: 8f2c7a10-0000-4000-8000-00000000a002
                    severity: warning
                    category: security
                    title: 2 users without MFA
                    body: 2 people still sign in with a password only. MFA becomes required on 1 Oct 2026.
                    sourceLabel: Security
                    raisedAt: '2026-09-21T08:00:00.000Z'
                    actionLabel: Remind them
                    settingId: u-mfa
                    dismissed: false
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/home/alerts/{alertId}/dismissal:
    put:
      tags: [admin-home]
      summary: Dismiss an alert for the current user
      operationId: dismissAdminAlert
      x-kasuwa-implemented: false
      x-kasuwa-audited: false
      x-kasuwa-screens: ['P02/A']
      description: |
        Idempotent: dismissing an already-dismissed alert is still `204`.
        Not audited — dismissing a notice changes nothing anyone else can see.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '204': { description: Dismissed. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [admin-home]
      summary: Restore a dismissed alert
      operationId: restoreAdminAlert
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/A']
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '204': { description: Restored. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/home/usage:
    get:
      tags: [admin-home]
      summary: Usage meters for the current billing period
      operationId: getAdminUsage
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/A']
      description: |
        Seats, WhatsApp conversations, storage and AI credits.

        **This is M23 (billing and subscription), which has no owner and no
        task.** The shape is published because the screen has four meters on
        it; nothing behind it exists. Raised in the T-0021 report.

        `used` and `limit` are integers in the meter's own unit (`unit` names
        it) so the client never parses "312 GB". `spend` is minor units plus a
        currency code — never a float, never a bare `amount`, and the client
        formats it through `@kasuwa/i18n` rather than prefixing a symbol.
      responses:
        '200':
          description: The meters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
              example:
                periodStart: '2026-09-01T00:00:00.000Z'
                periodEnd: '2026-10-01T00:00:00.000Z'
                meters:
                  - meterId: seats
                    label: Seats
                    unit: seat
                    used: 142
                    limit: 160
                    warnAtPercent: null
                    note: 18 seats left.
                    spend: null
                  - meterId: whatsapp_conversations
                    label: WhatsApp conversations
                    unit: conversation
                    used: 38420
                    limit: null
                    warnAtPercent: 90
                    note: Final cost follows Meta's rates.
                    spend:
                      amountMinor: '128430000'
                      currency: NGN
                      estimatedTotalMinor: '165000000'
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/settings-menu/badges:
    get:
      tags: [admin-home]
      summary: Counts for the settings-menu badges
      operationId: getSettingsMenuBadges
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/A1']
      description: |
        **The menu structure is the client's, not the server's.** Ten groups
        and their items are presentation and they live in `apps/web`; a
        server-rendered navigation tree would make every label a deployment.
        Only the numbers are data, so only the numbers are here, keyed by the
        stable `settingId` the client already knows.

        A `settingId` the client does not recognise is ignored, not rendered.
        That is what lets a new badge ship before the screen it points at.
      responses:
        '200':
          description: Badge counts. Absent means no badge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsMenuBadges' }
              example:
                badges:
                  - settingId: u-users
                    count: 2
                    severity: warning
                  - settingId: ch-wa
                    count: 1
                    severity: danger
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # =========================================================================
  # Programmes — P02/B .. P02/B9
  # =========================================================================
  /api/v1/admin/programmes:
    get:
      tags: [programmes]
      summary: List programmes the caller can reach
      operationId: listProgrammes
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P02/B', 'P02/B1']
      description: |
        The programmes table and its empty state.

        **The list is the caller's reachable set, full stop.** It is not
        filtered by a `programmeIds` argument, because there is no such
        argument. `user_programme` decides, inside the tenant transaction. A
        caller with no programmes gets an empty list and the `P02/B1` empty
        state — which is also what a caller sees when programmes exist but
        none of them are theirs. Those two are deliberately
        indistinguishable.

        **`partial`:** `id`, `name`, `clientName` and `isDefault` exist in
        `packages/db` today. `channels`, `agentCount`, `slaAttainment7d`,
        `retentionSummary` and `status` do not — they are null or absent until
        the modules that own them exist (M8/M9 channels, M11 agents, M12 SLA,
        M21 retention). `status` in particular has no column: `programme` has
        no lifecycle field, so Active/Paused/Draft/Archived is a schema change
        and therefore a successor task, not this one.

        `slaAttainment7d` is `null`, not `0`, when there is no data. The design
        renders "No data" for the draft programme and a percentage otherwise;
        a zero would render as a red bar and say something false.

        **Built (T-0024):** `status` is the constant `active` until a lifecycle
        column exists, so `statusCounts` counts every match as `active`. The
        unbacked fields are `null`; `channels` is absent.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: Matches programme name and client name. Not a field selector.
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ProgrammeStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The page of programmes, plus the counts behind the filter chips.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammeList' }
              example:
                items:
                  - id: 11111111-0000-4000-8000-0000000c0001
                    name: Eko Bank Collections
                    clientName: Eko Commercial Bank
                    reference: PRG-0031
                    countryCode: NG
                    status: active
                    channels: [whatsapp, voice, sms]
                    agentCount: 64
                    slaAttainment7d: 96.2
                    retentionSummary: 7 years
                  - id: 11111111-0000-4000-8000-0000000c0008
                    name: Teranga Air Helpdesk
                    clientName: Teranga Air
                    reference: PRG-0035
                    countryCode: SN
                    status: draft
                    channels: [email]
                    agentCount: 0
                    slaAttainment7d: null
                    retentionSummary: null
                statusCounts:
                  active: 6
                  paused: 1
                  draft: 1
                  archived: 0
                page:
                  nextCursor: null
                  hasMore: false
                  totalCount: 8
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
    post:
      tags: [programmes]
      summary: Create a programme
      operationId: createProgramme
      x-kasuwa-implemented: false
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B', 'P02/B1']
      description: |
        The "New programme" button on both the list and the empty state.

        `templateId` is the design's "Or start from a template: Collections /
        Customer support / Outbound sales". **Nothing defines what a template
        contains** — presumably dispositions, an SLA policy and a script set,
        which belong to M10 and M12. Passing one today is a `400`. Raised in
        the T-0021 report.

        A duplicate `name` within the tenant is `409 duplicate_name`. Note what
        that does *not* say: uniqueness is scoped to the tenant, so the
        response cannot tell you that another tenant has a programme by that
        name. A constraint message that leaked the conflicting row would be a
        cross-tenant existence oracle, which is why the error carries the field
        path and nothing else.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProgrammeRequest' }
            example:
              name: Pesa Merchant Onboarding
              clientName: PesaPoint
              countryCode: KE
              businessUnitId: 11111111-0000-4000-8000-0000000b0001
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Programme' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/programmes/{programmeId}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeId'
    get:
      tags: [programmes]
      summary: One programme — header and overview cards
      operationId: getProgramme
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P02/B2']
      description: |
        The breadcrumb, title, status pill and the three overview cards
        (Contract, Channels & hours, People).

        **`{programmeId}` is an identifier, not scope.** A programme in another
        tenant, and a programme in this tenant that the caller cannot reach,
        both return the same `404 not_found`. There is no `403` here and there
        must never be one: a `403` would confirm the id names something real.

        **`partial`:** `name` and `clientName` are real; the cards are not. The
        contract card (reference, start, renewal, billing basis) has no owner —
        M23 is the nearest and it is unassigned. Channels are M8/M9. Hours and
        holidays are M1's "Holidays & business hours" settings page, which is
        not designed. `people` counts need the role model that does not exist.

        **Built (T-0024):** `contract`, `operating` and `people` are `null`.
        `version` is derived from `updated_at` (epoch milliseconds) until a
        `version` column exists; treat it as opaque either way.
      responses:
        '200':
          description: The programme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammeDetail' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [programmes]
      summary: Rename a programme or change its lifecycle status
      operationId: updateProgramme
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B2']
      description: |
        Covers the "Pause" button. Archiving is not here — it has consequences
        the caller must see first, so it has its own preview and its own
        operation.

        Send only the fields you are changing. `version` is required and is the
        value from the last `GET`; a stale one is `409 stale_write` and the
        screen re-reads. Two admins on the same programme is not hypothetical
        in a BPO.

        **Built (T-0024), with two gaps.** `name` and `clientName` only: any
        `status` is `400 validation_failed` at `status` until a lifecycle
        column exists. Not yet enforced: `403 not_permitted` (no permissions
        engine — any member of the programme may rename it) and the audit row
        (no audit table).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProgrammeRequest' }
            example:
              version: 7
              status: paused
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammeDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/programmes/{programmeId}/kpis:
    get:
      tags: [programmes]
      summary: The four overview KPI tiles
      operationId: getProgrammeKpis
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/B2']
      description: |
        SLA met, contacts handled, average handle time, QA score.

        Separate from `GET /programmes/{id}` on purpose: these are analytics
        (M16) and QA (M11) reads over a time window, they will be slow, and the
        screen renders the header and the cards before they arrive. Folding
        them into the detail response would make the whole page wait for the
        slowest number on it.

        `value` is a number plus a `format` the client renders through i18n —
        never a pre-formatted string. `6m 12s` is a duration in seconds and
        `96.2%` is a ratio; the server does not decide how Hausa renders them.
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
        - name: window
          in: query
          required: false
          schema: { type: string, enum: [last_7_days, last_30_days], default: last_7_days }
      responses:
        '200':
          description: The KPI tiles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammeKpis' }
              example:
                window: last_7_days
                kpis:
                  - kpiId: sla_met
                    label: SLA met
                    format: percent
                    value: 96.2
                    targetValue: 95
                    status: good
                  - kpiId: average_handle_time
                    label: Average handle time
                    format: duration_seconds
                    value: 372
                    targetValue: 420
                    status: good
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/programmes/{programmeId}/agents:
    get:
      tags: [programmes]
      summary: Agents assigned to the programme, with skills and languages
      operationId: listProgrammeAgents
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P02/B3']
      description: |
        The agents table: name, team, skills, languages, and a live presence
        column headed "Now".

        **Presence is not ours.** Agent state lives in the telephony platform
        (ADR-0003) and reaches Kasuwa through `packages/telephony-adapter`. It
        is in this response because the column is in the design, and it is
        nullable because the adapter may be unavailable — a screen that cannot
        tell "offline" from "we do not know" will tell a supervisor something
        false. `null` renders as "—", not as "Offline".

        **Built (T-0024):** every member in `user_programme`. `presence` and
        `teamName` are `null`; `languages` is absent (no column).

        **No email address, no phone number.** The table shows initials and a
        name; those are all that is here. An admin who needs to contact an
        agent goes to the user record, which is a different screen with a
        different audit trail.
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: Matches agent name and skill name.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The page of agents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgrammeAgentList' }
              example:
                items:
                  - userId: 11111111-0000-4000-8000-0000000d0011
                    displayName: Ngozi Adeyemi
                    initials: NA
                    teamName: Team A
                    skills: [Collections L3, Restructuring]
                    languages: [en, yo, pcm]
                    presence: on_call
                page:
                  nextCursor: null
                  hasMore: false
                  totalCount: 64
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/programmes/{programmeId}/skill-cover:
    get:
      tags: [programmes]
