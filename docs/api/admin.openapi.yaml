      operationId: getProgrammeSkillCover
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P02/B3']
      description: |
        The "Skill cover, day shift" card: "9 of 12 needed".

        **`needed` comes from WFM and WFM is not ours to build** (ADR-0003). It
        arrives through `packages/wfm-adapter`, which is a placeholder. If the
        adapter cannot answer, `needed` is `null` and the screen shows the
        rostered count without a judgement — a cover bar that turns amber
        because the forecast was missing is worse than no bar.

        `shiftDate` is a calendar date and `timeZone` is the programme's IANA
        zone, sent explicitly. "Monday" is not the same day everywhere on this
        roster and the client must not infer it from the browser.
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
        - name: shiftDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: shift
          in: query
          required: false
          schema: { type: string, enum: [day, night], default: day }
      responses:
        '200':
          description: Cover per skill.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillCover' }
              example:
                shiftDate: '2026-09-29'
                shift: day
                timeZone: Africa/Lagos
                items:
                  - skillId: collections_l3
                    label: Collections L3
                    rostered: 12
                    needed: 10
                  - skillId: hausa
                    label: Hausa speakers
                    rostered: 9
                    needed: 12
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/admin/programmes/{programmeId}/sla:
    parameters:
      - $ref: '#/components/parameters/ProgrammeId'
    get:
      tags: [programmes]
      summary: SLA targets, clock rules and escalation
      operationId: getProgrammeSla
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P02/B4']
      description: |
        The whole SLA tab in one read, because the whole tab saves at once.

        **Targets are integer seconds, never "2 min".** The design's inputs are
        free text and the client parses and formats them; the wire is
        unambiguous and localisable. `null` means the target does not apply —
        Voice resolution is "Same call", which is the absence of a target, not
        a very small one.

        **A programme with no saved policy returns the platform default at
        `version: 0`** (D-L50) — voice and WhatsApp targets defined in code —
        never a 404. Saving with `version: 0` creates the programme's policy.
      responses:
        '200':
          description: The SLA policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicy' }
              example:
                version: 4
                targets:
                  - channel: whatsapp
                    firstResponseSeconds: 120
                    resolutionSeconds: 86400
                    clock: business_hours
                  - channel: voice
                    firstResponseSeconds: 20
                    resolutionSeconds: null
                    clock: business_hours
                pauseOutsideOperatingHours: true
                pauseAwaitingCustomer: true
                warnAtPercentOfTarget: 80
                warnNotifyRole: team_lead
                breachNotifyRole: programme_manager_and_client
                operatingHoursSummary: Mon–Sat, 08:00–20:00 WAT
                timeZone: Africa/Lagos
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [programmes]
      summary: Save the SLA policy
      operationId: updateProgrammeSla
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B4', 'P02/D2']
      description: |
        A whole-document write, matching the screen: the unsaved-changes bar
        counts edits across the tab and saves them together. A partial write
        would let two of four channel targets land and leave the client unsure
        which. Two targets for the same channel in one write are
        `400 validation_failed` at `targets.<n>.channel` (D-L50).

        `version` is mandatory. A stale one is `409 stale_write` and the screen
        must re-read rather than retrying — the SLA is a contractual number and
        silently overwriting a colleague's edit is the failure mode that ends
        in a service-credit dispute.

        **Who owns SLA policy is undecided.** SLAs are per-programme
        configuration (PRD 2.10) but no PRD module claims the model; M12 owns
        ticketing SLAs, M8 owns inbox response targets, and the client-facing
        breach report is M18. Raised in the T-0021 report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaPolicyWrite' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaPolicy' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

