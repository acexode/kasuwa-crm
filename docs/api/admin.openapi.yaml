  /api/v1/admin/programmes/{programmeId}/retention:
    parameters:
      - $ref: '#/components/parameters/ProgrammeId'
    get:
      tags: [programmes]
      summary: Retention periods, disposal method and legal hold
      operationId: getProgrammeRetention
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P02/B7']
      description: |
        Periods are integer days on the wire; the design's dropdown of "30
        days … 10 years" is a client-side list over the same field. `null` is
        not allowed — "not set" is a programme-level state the list screen
        shows, and it is represented by the absence of a policy (`404`), not by
        a policy full of nulls.

        `redactSensitiveNumbersInTranscripts` is the design's "Redact card
        numbers, BVN and NIN". It is a policy flag and nothing more: **no
        endpoint in this file ever returns a NIN, a BVN or a PAN, redacted or
        otherwise.**
      responses:
        '200':
          description: The retention policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
              example:
                version: 2
                callRecordingsDays: 2555
                messageTranscriptsDays: 2555
                screenRecordingsDays: 90
                qaEvaluationsDays: 1095
                onExpiry: delete
                redactSensitiveNumbersInTranscripts: true
                legalHold: false
                workspaceDefaultDays: 730
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [programmes]
      summary: Save the retention policy
      operationId: updateProgrammeRetention
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B7', 'P02/D2']
      description: |
        Shortening a period destroys data, and which periods are lawful to
        shorten depends on the client contract and the sector regulator. The
        API does not judge that — the screen shows the warning — but it does
        refuse to act while a legal hold is on: turning a hold off and
        shortening a period in the same request is `409 legal_hold_active`.
        Two deliberate steps, two audit rows.

        **Retention model ownership is M21 (data management), which is
        unassigned**, and D-T4 (does the telephony platform already do
        recording retention?) is BLOCKED — which means the call-recording
        period here may not be the one that is actually enforced. Raised in the
        T-0021 report.

        **`callRecordingsDays` is stored and returned but not enforced by
        Kasuwa** (D-L50): recording retention belongs to the telephony
        platform (D-T4, deferred). No Kasuwa job deletes a recording on it.

        **The first write sends `version: 0`** (D-L50): a programme with no
        policy has no version a read could have returned, and 0 is never one.
        Once a policy exists, `version: 0` is stale like any other old version.
        When a write is both stale and refused by the legal hold, the answer is
        `stale_write` — the version is checked first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPolicyWrite' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }

