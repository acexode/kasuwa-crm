  /api/v1/admin/programmes/{programmeId}/dispositions/{dispositionId}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeId'
      - $ref: '#/components/parameters/DispositionId'
    patch:
      tags: [programmes]
      summary: Edit a disposition, or deactivate it
      operationId: updateDisposition
      x-kasuwa-implemented: false
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B5']
      description: |
        `active: false` is the dialog's "Deactivate instead": agents stop
        seeing it, reporting stays clean, and it can be turned back on. It is
        the recommended path and the destructive one is the alternative, which
        is why it is a `PATCH` and not a second delete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispositionPatch' }
            example:
              active: false
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disposition' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [programmes]
      summary: Delete a disposition
      operationId: deleteDisposition
      x-kasuwa-implemented: false
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P02/B5']
      description: |
        Past interactions keep the label; agents can no longer choose it and
        reports group it under "Deleted". So this is a soft delete at the data
        layer even though it is a `DELETE` at the API — an interaction whose
        disposition row vanished would break every historical report that
        joins to it.

        Idempotent: deleting an already-deleted disposition is `204`.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

