                  - id: 11111111-0000-4000-8000-0000000e0001
                    code: PTP
                    label: Promise to pay
                    category: promise_to_pay
                    noteRequired: true
                    followUpRequired: true
                    active: true
                    position: 1
                    usageCount90d: 3214
                usageWindowDays: 90
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
