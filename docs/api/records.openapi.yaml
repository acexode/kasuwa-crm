openapi: 3.1.0

# ---------------------------------------------------------------------------
# Kasuwa records API — T-0039 (M3, Agent 3). Contacts first (D-L60).
#
# This file is the PUBLISHED CONTRACT (ADR-0004) for the P04 list screens and
# for T-0041, which implements it. It is committed before the write, search and
# filter implementation so that T-0042 (the P04 Contacts list, Agent 11) can
# generate a mock from it and build against that mock.
#
# It is modelled on admin.openapi.yaml and shares that file's Error schema by
# reference rather than copying it: one envelope, one `code` enum, one place to
# add a code. The rules below are the same rules, restated because they are
# what breaks first.
#
# 1. SCOPE IS RESOLVED, NEVER SUPPLIED. No operation takes `programmeIds`,
#    `tenantId` or any scope argument in a query, header, cookie or body. The
#    session says who the caller is; `user_programme`, read inside the tenant
#    transaction, says which programmes they reach. The one `programmeId` a
#    caller may send is createContact's TARGET, which must be one they already
#    reach (an unreachable target is 404, exactly like a missing record).
#
# 2. A RECORD OUTSIDE YOUR SCOPE IS 404, NOT 403. No such contact, a contact in
#    another tenant, and a contact in another programme of this tenant all get
#    one body. Reads never answer 403. `403 not_permitted` exists on writes
#    only and means "you can already read this record, and you may not do this
#    to it" (the T-0032 permission engine).
#
# 3. FIELD SECURITY OMITS, IT NEVER NULLS. A field the caller's permission sets
#    may not read is LEFT OUT of the object, and its name is listed in
#    `withheldFields`. `null` always means "no value", never "hidden". A screen
#    draws a lock for a withheld field and an empty cell for a null one (P04/02).
#
# 4. KEYSET PAGING ONLY. `{ data, nextCursor }`. No total, no offset, no page
#    number (D-P13 is open; it can be relaxed additively later).
#
# 5. NOTHING HERE CARRIES A NIN, BVN, PAN OR DATE OF BIRTH. NIN/BVN tokens come
#    in a later slice (D-L13, D-L60).
#
# Status of each operation is `x-kasuwa-implemented`, strictly true or false:
#   true   — a route answers today. See the description for where the live wire
#            still differs from this contract.
#   false  — contract only. Keep the screen on the mock.
# ---------------------------------------------------------------------------

info:
  title: Kasuwa Records API
  version: 0.3.0-T-0059
  description: |
    Contacts: list (search, filters, sort, keyset paging), get, create and
    update. Accounts (T-0052, contract only until T-0055): list, get, create,
    update, and an account's contacts. The contact record view (P05, T-0059,
    contract only until T-0061): the contact's timeline and its account
    summary. Leads (D-P17) and custom-field values follow in later slices
    (D-L60) and will be added to this file.

    **Display names (T-0043, D-L64).** A records screen never prints a UUID.
    Programme names come from `listMyProgrammes`; an owner's name is embedded
    on the contact as `owner`. There is deliberately no operation that turns
    caller-supplied user ids into names: that would be a user directory.

    **Errors.** Every failure uses the shared `Error` envelope from
    `admin.openapi.yaml`. Switch on `code`, never on `message`. The web app
    localises as `records.error.<code>`.

    **Times** are UTC, ISO 8601, with a `Z`. Display conversion to the tenant's
    zone (WAT/EAT/SAST) is the browser's.

    **Phones** are E.164 (`+2348031234567`) on the wire, in and out.

    **Money.** No contact field carries money. When an Account grows one it is
    minor units as a string plus an ISO 4217 code, never a float (admin's
    `Money`).

    **Transport.** `Authorization: Bearer ksw_s1_…` and nothing else.

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://{host}
    description: Deployed cell
    variables:
      host:
        default: api.kasuwa.example

tags:
  - name: accounts
    description: Organisations a programme sells to, serves or collects from.
  - name: contacts
    description: People a programme sells to, serves or collects from.
  - name: me
    description: The caller's own scope, as the session resolves it.

paths:
  /api/v1/contacts:
    get:
      tags: [contacts]
      summary: List contacts — search, filter, sort, keyset page
      operationId: listContacts
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/02', 'P04/05', 'P04/06']
      description: |
        The P04 Contacts list. Rows come only from the programmes the session
        reaches. A BPO agent on one programme sees that programme's contacts
        and nothing else, with no parameter that could change that.

        **Live (T-0041):** `q`, every filter, `sort` and keyset paging under
        each sort. A malformed cursor, or one issued for a different `sort`,
        is `validation_failed` with `details[].code: invalid_cursor`. Unknown
        query parameters are ignored, never honoured. A filter on a field
        withheld from the caller in ANY programme they reach is
        `field_withheld`.

        **Field security and the query.** `q` matches only fields the caller
        may read. A filter on a field withheld from the caller is
        `400 validation_failed` with `details[].code: field_withheld`. Field
        names are part of the schema, not data, so this discloses nothing.
        Ignoring the filter instead would return rows that look filtered and
        are not. Sorting is limited to the `sort` enum, whose keys are fields
        field security never withholds.

        **No totals** (D-P13). P04's "1–25 of 1,234" and the live chip counts are
        not served. The screen draws "Load more" or next/previous.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Search by name or number. The name part matches the display, given
            and family names, case- and diacritic-insensitively (`Adebayo`
            finds `Adébáyọ̀`). The number part is normalised to E.164 with the
            tenant's default country before matching, so `0803 123 4567`,
            `2348031234567` and `+234 803 123 4567` all find `+2348031234567`.
            It matches only phones the caller may read.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Name or number. A phone is matched in E.164.
        - name: owner
          in: query
          required: false
          description: |
            Owner filter, any of. Each value is a user id, `me` (the caller),
            or `unassigned` (no owner). Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              pattern: '^(me|unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: status
          in: query
          required: false
          description: Any of. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { $ref: '#/components/schemas/ContactStatus' }
        - name: source
          in: query
          required: false
          description: Any of. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { $ref: '#/components/schemas/ContactSource' }
        - name: tag
          in: query
          required: false
          description: Contacts carrying any of these tags. Exact match, case-insensitive.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: state
          in: query
          required: false
          description: |
            State (first-level subdivision), any of. Matched against the stored
            value exactly, case-insensitively. Whether it is a name or an ISO
            3166-2 code is T-0040's column decision.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: lga
          in: query
          required: false
          description: Local government area, any of. Same matching as `state`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: dnd
          in: query
          required: false
          description: |
            `true`: only numbers on the NCC Do-Not-Disturb register. `false`:
            only numbers not on it. Absent: both.
          schema: { type: boolean }
        - name: whatsappOptIn
          in: query
          required: false
          description: '`true`: opted in to WhatsApp. `false`: not. Absent: both.'
          schema: { type: boolean }
        - name: sort
          in: query
          required: false
          description: |
            One of a fixed set; a leading `-` is descending. **Deliberately not
            a free column name.** Ordering by a withheld field would leak its
            values one comparison at a time. Ties break on `id`, so the keyset
            is total.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'displayName', '-displayName']
            default: '-createdAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
              example:
                data:
                  - id: 3f0c9a52-6d1e-4b8a-9f2e-1a2b3c4d5e01
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    version: 3
                    displayName: Adaeze Okonkwo
                    givenNames: Adaeze
                    familyName: Okonkwo
                    phones: [{ type: mobile, e164: '+2348030000001' }]
                    ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                    owner:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    status: contacted
                    source: whatsapp
                    tags: [Callback set]
                    preferredLanguage: en
                    preferredChannel: whatsapp
                    state: Lagos
                    lga: Ikeja
                    dnd: false
                    whatsappOptIn: true
                    consentState: opted_in
                    phoneNetwork: MTN
                    createdAt: '2026-10-01T09:12:00.000Z'
                    updatedAt: '2026-10-03T14:40:00.000Z'
                    withheldFields: [emails, accountId]
                nextCursor: eyJjIjoiMjAyNi0xMC0wMVQwOToxMjowMC4wMDAwMDBaIiwiaSI6IjNmMGM5YTUyIn0
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

    post:
      tags: [contacts]
      summary: Create a contact
      operationId: createContact
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/02', 'P04/05']
      description: |
        **Target programme.** If the caller reaches exactly one programme,
        `programmeId` may be omitted and the server uses that one. If they
        reach several, it is required (`400 validation_failed` at
        `programmeId` when missing). A `programmeId` they do not reach is
        `404 not_found`, the same body as a programme that does not exist. It
        is never `403`, which would confirm the programme is real.

        **Permission.** Creating needs create on contacts in the target
        programme (T-0032). Without it: `403 not_permitted`. Setting a field the
        caller may not edit is also `403 not_permitted`, naming the field in
        `details[].path`.

        **Response.** The created record, through the same field-security rule
        as a read: a field the caller may write but not read is still omitted
        and listed in `withheldFields`.

        Every create writes an audit event (T-0033 pattern). Duplicate detection
        and merge are not part of this slice (D-P12).

        **Live (T-0041).** The permission is `contact.write`, held by the
        `admin` set in the target programme or by the tenant-admin flag
        (D-L63); every other set may not create contacts (the `agent` set's
        narrow edit is on updateContact only, D-P14). The tenant-admin
        flag never lifts field security. A caller holding `contact.write` in
        none of its programmes is `403` before the body is read, so the
        `programmeId` rules above never tell it how many programmes it
        reaches. An `ownerUserId` that is not a member of the target programme
        (D-L67), or an `accountId` that is not an account in it, is
        `400 validation_failed` with `details[].code: unknown_reference`, the
        same body whether it names another programme's or another tenant's
        row, or nothing at all. The audit event is `objectType: contact`,
        labelled with the record id; every change is a redacted one (the field
        name, never a value).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
            example:
              displayName: Tunde Bakare
              phones: [{ type: mobile, e164: '+2348060000002' }]
              source: manual
              status: new
              preferredChannel: whatsapp
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [contacts]
      summary: Get one contact
      operationId: getContact
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/02', 'P05/01', 'P05/02', 'P05/05', 'P05/06']
      description: |
        **Live (T-0041)** with every Contact property, `version` and
        `withheldFields`, and the `NotFound` body below. **Not yet served:**
        the embedded `account` summary (T-0059 contract, T-0061 implements
        it); until then the live record leaves it out and does not list it in
        `withheldFields`.

        Out of scope is `404`, never `403`. This is also the P05 record
        view's read: P05/06's "access denied" frame, which shows the record
        id, the owning programme and "Request access", is not drawn. An
        out-of-scope record is the generic not-found page (D-L69, CLAUDE.md
        6.4).

        The rest of P05 is not part of this operation and has no operation
        in this file yet: the WhatsApp composer and 24-hour window (M08), the
        AI summary and next-best action (M17), recording playback (ADR-0003),
        NIN last-4 (D-L13), addresses (no module owns them yet) and follow
        (P26). The screen hides each until its module publishes a contract.
      responses:
        '200':
          description: The contact, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [contacts]
      summary: Update a contact (inline edit of owner, status and the rest)
      operationId: updateContact
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/01', 'P04/02', 'P04/04']
      description: |
        Partial update: absent properties are unchanged; `null` clears a
        nullable field. `version` is required and must equal the record's
        current `version`, otherwise `409 stale_write`. Re-read; do not retry
        blind. P04's inline Owner/Status edit and the Kanban drag can both be
        in flight on two desks.

        **No `programmeId`.** Moving a record across the BPO isolation boundary
        is not a field edit; sending it is `400` (the body is closed).

        **Permission.** The record must be readable (else `404`). Editing it
        needs edit on contacts (else `403 not_permitted`), and each field sent
        needs edit under field security (else `403 not_permitted` naming it in
        `details[].path`). A caller cannot clear a field they cannot read.

        Every update writes an audit event recording which fields changed,
        never their values.

        **Live (T-0041).** Same permission, reference and audit rules as
        createContact, judged in the record's programme. Order: `404`, `403`
        (including `field_not_editable`), `400`, then `409 stale_write`.

        **Agents (D-P14, T-0051).** The `agent` set held in the record's
        programme may send `status`, and `ownerUserId` set to the caller's
        own user id, and nothing else (besides `version`). Another owner,
        `null` (clearing the owner) or any other property is
        `403 not_permitted` for the whole body, even alongside a field it may
        write, and nothing is written. This is decided on the body as sent,
        before validation. Field security still applies on top, and a
        successful agent update is audited like any other. `team_lead`,
        `qa_analyst`, `programme_manager` and `client_portal` remain
        read-only for contacts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
            example:
              version: 3
              status: qualified
              ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
      responses:
        '200':
          description: The updated contact, field security applied. `version` has advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleWrite' }

  # -------------------------------------------------------------------------
  # The contact record view (P05, T-0059; D-L69, D-L72). CONTRACT ONLY: no
  # route answers yet; T-0061 implements it and flips `x-kasuwa-implemented`.
  # The five rules at the top of this file apply unchanged.
  #
  # Deliberately absent, each until its module publishes a contract (D-L69):
  # the WhatsApp composer, the 24-hour window and "last WhatsApp contact"
  # (M08); the AI summary and next-best action (M17); recording playback
  # (ADR-0003); NIN last-4 (D-L13); addresses (no module named); follow
  # (P26). The task allowed a 501 stub or absence; absence was chosen so this
  # file does not invent paths those modules own. Timeline items for calls,
  # messages, notes, tickets, payments and invoices are absent for the same
  # reason: the union is closed (D-L72).
  # -------------------------------------------------------------------------

  /api/v1/contacts/{contactId}/timeline:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    get:
      tags: [contacts]
      summary: The contact's timeline — field and consent changes, newest first
      operationId: listContactTimeline
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P05/01', 'P05/02', 'P05/05']
      description: |
        The centre column of the P05 contact record: what changed on this
        contact, and who changed it, read from the contact's audit trail.

        **Scope.** The contact must be readable by the caller, exactly as for
        getContact; anything else (no such contact, another tenant, a
        programme the caller does not reach) is the same `404 not_found`,
        never `403` (D-L69). That check comes first, and nothing about the
        contact's history is read before it passes.

        **Order: newest first.** Items are ordered by `occurredAt`
        descending. Ties are common, not an edge case: one update that
        changes three fields is one audit event and three items with the
        same `occurredAt`. The tie-break is the item `id`, descending, so the
        keyset `(occurredAt, id)` is total and a page edge that falls inside
        one event neither drops nor repeats an item.

        **Field security omits, before paging.** Field security is judged in
        the contact's programme, against the caller's permission sets today
        (not at the time of the change). An item for a field withheld from
        the caller is omitted entirely: its value AND its name. Nothing marks
        the gap, and the page carries no count of omitted items. A
        `consent_changed` item is a change to `consentState` by another name,
        so it follows `consentState`'s field security: when `consentState`
        is withheld, every `consent_changed` item is omitted too. Likewise an
        item naming `ownerUserId` follows `ownerUserId`, and one naming
        `accountId` follows `accountId`.

        Omission happens before paging: withheld items are filtered out
        before the page is cut, so every page holds `limit` items unless it
        is the last. A short page with a non-null `nextCursor` would tell the
        caller that hidden changes exist, and the server never produces one.

        **Values (D-L72).** A `field_changed` item names the field by its
        Contact wire name. It carries `before` and `after` only for the
        non-PII enumerated fields, and only for changes recorded from T-0061
        onward; older changes were audited by name only (D-L63) and carry
        none. Phones, emails and every name part (`displayName`,
        `givenNames`, `familyName`) never carry a value: a change to them is
        shown, by name, as a redacted item. Owner and account changes are
        also by name only: a raw user or account id is never printed (D-L64),
        and past owners' names would turn this into a user directory.

        **Item types are closed (D-L72):** `field_changed` and
        `consent_changed`. `activity` is reserved for the activities slice
        (T-0060) and joins the union when that slice defines its shape. Calls,
        WhatsApp, SMS, email, notes, tickets, payments and invoices belong to
        modules that are not built and are not item types.

        **Paging.** Keyset only: `{ data, nextCursor }`, no total, count or
        offset (D-P13). A malformed cursor, or one issued for another
        contact, is `400 validation_failed` with
        `details[].code: invalid_cursor`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the contact's timeline, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
              example:
                data:
                  - id: ti_k7Rq2mXbQ9
                    type: field_changed
                    occurredAt: '2026-10-03T14:40:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: status
                    before: new
                    after: contacted
                  - id: ti_k7Rq2mXbP4
                    type: field_changed
                    occurredAt: '2026-10-03T14:40:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: phones
                    redacted: true
                  - id: ti_c3Hw8nVdL1
                    type: consent_changed
                    occurredAt: '2026-10-01T09:12:00.000Z'
                    actor: null
                    before: unknown
                    after: opted_in
                nextCursor: dGltZWxpbmUtY3Vyc29yLWV4YW1wbGU
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/programmes:
    get:
      tags: [me]
      summary: The caller's programmes, with their display names
      operationId: listMyProgrammes
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/02']
      description: |
        The programmes the caller belongs to, so a records screen can print
        "Bank X Collections" where the contract otherwise gives a
        `programmeId` (D-L64).

        **Scope is the session's.** Exactly the caller's own `user_programme`
        rows, read inside the tenant transaction on every request. There is no
        parameter, header or body that chooses whose programmes are listed;
        unknown query parameters are ignored, never honoured, and a scope
        header is `400 validation_failed`. The tenant-admin flag does not widen
        it (D-L53): an admin sees the programmes they belong to, not every
        programme in the tenant. A user with no membership gets `{ data: [] }`.

        **Closed items: `{ id, name }` and nothing else.** No `clientName`
        (the BPO's customer is a separate, confidential fact), no status, no
        member count.

        **Never cached by a shared cache.** The URL is the same for every user
        of every tenant, so the response carries `Cache-Control: no-store`.

        Order is by name, then id. Not paged: the list is the caller's own
        memberships.
      responses:
        '200':
          description: The caller's programmes.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, enum: ['no-store'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProgrammeList' }
              example:
                data:
                  - id: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    name: Bank X Collections
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  # Deliberately absent: the P04/04 Map view (M03 P2), saved views, bulk
  # actions, export, merge and per-chip counts. No PRD module in this slice owns
  # them; see the T-0039 report. A map operation, when one is added, starts as
  # `x-kasuwa-implemented: false` with a 501.

  # -------------------------------------------------------------------------
  # Accounts (T-0052, D-L69). CONTRACT ONLY: no route answers yet; T-0055
  # implements it and flips `x-kasuwa-implemented`. The five rules at the top
  # of this file apply unchanged. Account writes are admin-only until D-P18
  # answers (D-L69), exactly as contact writes were in T-0041 (D-L63).
  #
  # Deliberately absent (D-L69): account Health and any score (M17), a rollup
  # of deals or pipeline value (no owning module), counts of related records
  # or children (D-P13), "Show US$" (FX, M05), and DND on account phones (no
  # decision yet says where that flag lives for an account). Leads are not
  # here (D-P17).
  # -------------------------------------------------------------------------

  /api/v1/accounts:
    get:
      tags: [accounts]
      summary: List accounts — search, filter, sort, keyset page
      operationId: listAccounts
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P04/03', 'P04/05', 'P04/06']
      description: |
        The P04 Accounts list (frame 03: table, card list, split view). Rows
        come only from the programmes the session reaches. There is no
        parameter that narrows or widens that set; in particular there is no
        `programme` filter, because a client-supplied programme list is what
        CLAUDE.md 2.2 calls a bug. A screen that wants one programme's
        accounts filters client-side on `programmeId`.

        Unknown query parameters are ignored, never honoured. A scope header
        is `400 validation_failed` (D-L63).

        **Field security and the query.** `q` matches `name` only, which is
        never withheld. A filter on a field withheld from the caller in ANY
        programme they reach is `400 validation_failed` with
        `details[].code: field_withheld`, naming the parameter in
        `details[].path`. Field names are part of the schema, not data, so
        this discloses nothing; ignoring the filter instead would return rows
        that look filtered and are not. Sorting is limited to the `sort` enum,
        whose keys are fields field security never withholds.

        **No totals** (D-P13). P04's "1–25 of 1,234" and live chip counts are
        not served.

        A malformed cursor, or one issued for a different `sort`, is
        `validation_failed` with `details[].code: invalid_cursor`.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Search by account name: a case- and diacritic-insensitive
            substring match on `name` (`Oja` finds `Ọjà Foods Ltd`). Accounts
            are not searched by phone in this slice.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Part of the account name.
        - name: owner
          in: query
          required: false
          description: |
            Owner filter, any of. Each value is a user id, `me` (the caller),
            or `unassigned` (no owner). Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              pattern: '^(me|unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: tier
          in: query
          required: false
          description: Any of. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { $ref: '#/components/schemas/AccountTier' }
        - name: industry
          in: query
          required: false
          description: |
            Any of. Matched against the stored value exactly,
            case-insensitively. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: tag
          in: query
          required: false
          description: Accounts carrying any of these tags. Exact match, case-insensitive.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: state
          in: query
          required: false
          description: |
            State (first-level subdivision), any of. Matched as on
            listContacts: the stored value exactly, case-insensitively.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: lga
          in: query
          required: false
          description: Local government area, any of. Same matching as `state`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: sort
          in: query
          required: false
          description: |
            One of a fixed set; a leading `-` is descending. **Deliberately not
            a free column name**, and every key is a field field security
            never withholds: ordering by `tier`, `industry` or the owner would
            leak a withheld value one comparison at a time. Ties break on `id`,
            so the keyset is total.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'name', '-name']
            default: 'name'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
              example:
                data:
                  - id: 5a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c01
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    version: 2
                    name: Ọjà Foods Ltd
                    ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                    owner:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    industry: FMCG
                    tier: mid_market
                    tags: [Distributor]
                    phones: [{ type: work, e164: '+2348030000101' }]
                    state: Lagos
                    lga: Ikeja
                    parentAccountId: null
                    createdAt: '2026-10-01T09:12:00.000Z'
                    updatedAt: '2026-10-03T14:40:00.000Z'
                    withheldFields: []
                nextCursor: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

    post:
      tags: [accounts]
      summary: Create an account
      operationId: createAccount
      x-kasuwa-implemented: false
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/03', 'P04/05']
      description: |
        **Target programme.** As createContact. If the caller reaches exactly
        one programme, `programmeId` may be omitted and the server uses that
        one. If they reach several, it is required (`400 validation_failed`
        at `programmeId` when missing). A `programmeId` they do not reach is
        `404 not_found`, the same body as a programme that does not exist;
        never `403`, which would confirm the programme is real.

        **Permission.** Creating needs `account.write` in the target programme,
        held by the `admin` set or the tenant-admin flag, as `contact.write`
        is (D-L63, D-L69; D-P18 may widen it). Without it: `403 not_permitted`,
        decided before the body is read, so the `programmeId` rules above never
        tell a caller without the permission how many programmes it reaches.
        Setting a field the caller may not edit is `403 not_permitted` with
        `details[].code: field_not_editable`. The tenant-admin flag never lifts
        field security.

        **References.** `ownerUserId` must be a member of the target programme
        (D-L67, as for contacts). `parentAccountId` must name an account in the
        target programme: an account hierarchy never crosses the BPO boundary,
        so a caller who can read an account can always reach its parent.
        Anything else, whether it names another programme's or another
        tenant's row or nothing at all, is `400 validation_failed` with
        `details[].code: unknown_reference`.

        **Response.** The created record, through the same field-security rule
        as a read. Every create writes an audit event (`objectType: account`,
        labelled with the record id; changes are field names, never values).
        Duplicate detection and merge are not part of this slice (D-P12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
            example:
              name: Kano Grains Co.
              industry: Agriculture
              tier: sme
              phones: [{ type: work, e164: '+2348060000102' }]
              state: Kano
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/AccountNotPermitted' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  # A concrete path, so it is matched before /api/v1/accounts/{accountId}
  # (and `map` is not a uuid, so it could never name an account).
  /api/v1/accounts/map:
    get:
      tags: [accounts]
      summary: Accounts map view (not built)
      operationId: getAccountMap
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P04/04']
      description: |
        **Not built; answers `501 not_implemented`** after authentication
        (an unauthenticated call is still `401`). The P04/04 Map groups
        accounts by State with a pin per State, which is a count per group:
        a total by another name (D-P13), and on a withheld `state` a
        disclosure. The Map view is M03 P2 and no slice owns it (D-L69). The
        screen hides the Map view switch until this operation is built.
      responses:
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      summary: Get one account
      operationId: getAccount
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P04/03']
      description: |
        The split-view preview (P04/03). Out of scope is `404`, never `403`:
        no such account, an account in another tenant and an account in a
        programme of this tenant the caller does not reach get one body.

        Recent activity, calls and messages in the preview are not account
        properties; they come from the activities slice (P07), not here.
      responses:
        '200':
          description: The account, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

    patch:
      tags: [accounts]
      summary: Update an account (inline edit of owner, tier and the rest)
      operationId: updateAccount
      x-kasuwa-implemented: false
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/03']
      description: |
        Partial update: absent properties are unchanged; `null` clears a
        nullable field. `version` is required and must equal the record's
        current `version`, otherwise `409 stale_write`. Re-read; do not retry
        blind.

        **No `programmeId`.** Moving an account across the BPO isolation
        boundary is not a field edit; sending it is `400` (the body is closed).

        **Permission.** The record must be readable (else `404`). Editing it
        needs `account.write` in the record's programme (else
        `403 not_permitted`), and each field sent needs edit under field
        security (else `403 not_permitted` with
        `details[].code: field_not_editable`). A caller cannot clear a field
        they cannot read.

        **References.** As createAccount, judged in the record's programme:
        `ownerUserId` must be a member of it (D-L67) and `parentAccountId` an
        account in it, else `400 unknown_reference`. An account may not be its
        own ancestor: a `parentAccountId` that would close a cycle is
        `400 validation_failed` with `details[].code: parent_cycle` at
        `parentAccountId`.

        Order: `404`, `403` (including `field_not_editable`), `400`, then
        `409 stale_write`. Every update writes an audit event recording which
        fields changed, never their values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
            example:
              version: 2
              tier: enterprise
              ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
      responses:
        '200':
          description: The updated account, field security applied. `version` has advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/AccountNotPermitted' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/StaleWrite' }

  /api/v1/accounts/{accountId}/contacts:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      summary: The account's contacts the caller can reach
      operationId: listAccountContacts
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P04/03', 'P04/05', 'P04/06']
      description: |
        Contacts whose `accountId` is this account, as `Contact` rows under
        Contact field security: exactly what listContacts would return for
        the filter `accountId = {accountId}`. A contact's account is always in
        the contact's programme (the composite foreign key), so every row is
        in the account's programme. Same keyset paging and page shape as
        listContacts, and no total (D-P13).

        **Out of scope is `404`, never `403`.** An account the caller cannot
        reach gets the same body as one that does not exist; that check comes
        first.

        **When `accountId` is withheld.** Listing an account's contacts IS a
        filter on the contact's `accountId`, and it discloses exactly the link
        field security withholds (P04/02 locks a contact's Account column for
        the agent role). So if field security withholds the contact field
        `accountId` from the caller in the account's programme, the answer is
        `400 validation_failed` with `details[].code: field_withheld` at
        `details[].path: accountId`, the same rule as a filter on a withheld
        field on listContacts. Rows are never returned in that case.
      parameters:
        - name: sort
          in: query
          required: false
          description: |
            As listContacts' `sort`: a fixed set of never-withheld keys, a
            leading `-` descending, ties broken on `id`.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'displayName', '-displayName']
            default: 'displayName'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the account's contacts, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        `Authorization: Bearer ksw_s1_…` (auth.openapi.yaml). The token carries
        no claims and no scope; every request re-resolves both from the
        database.

  parameters:
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        A record identifier. An id the caller cannot reach, whether in another
        tenant, another programme or nowhere, is `404 not_found`. A value that
        is not a uuid is `400`.
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        An account identifier. An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`. A
        value that is not a uuid is `400`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged; do not parse it or build
        one. It is valid only with the same `q`, filters and `sort` that
        produced it. A malformed cursor is `400`. A well-formed cursor pointing
        outside the caller's scope yields rows from their scope only, never
        anyone else's (cursor-tampering.acceptance.test.ts).
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Rows per page. P04 offers 25, 50 and 100. Out of range is `400`, never clamped.

  schemas:
    ContactStatus:
      type: string
      enum: [new, contacted, qualified, unqualified, customer]
      description: |
        Snake_case codes, as stored (T-0040); P04's labels ("Qualified") are
        i18n strings, never values. The tenant-wide default set. Programme-specific stages (P04/02 shows a
        collections programme's "Promise to pay", "In arrears") are not modelled
        in this slice.

    ContactSource:
      type: string
      enum: [whatsapp, ussd, web_form, missed_call, import, api, manual, referral, walk_in]

    PreferredChannel:
      type: string
      enum: [whatsapp, sms, voice, email]

    ConsentState:
      type: string
      enum: [unknown, opted_in, pending, withdrawn]
      default: unknown
      description: |
        Marketing consent under NDPA. Never null; a new contact is `unknown`.
        Changes are audited.

    Phone:
      type: object
      additionalProperties: false
      required: [type, e164]
      properties:
        type: { type: string, enum: [mobile, work, home, other] }
        e164:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164 only. A write in any other format is `400`.

    Contact:
      type: object
      required: [id, programmeId, version, displayName, createdAt, updatedAt, withheldFields]
      description: |
        One contact as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional and why `emails`,
        which P04/02 locks for the agent role, is not nullable: an empty list
        means none.

        `id`, `programmeId`, `version`, `displayName`, `createdAt`, `updatedAt`
        and `withheldFields` are never withheld.

        **Specified, not yet served.** The `allOf` part below adds properties
        this contract specifies and the live API does not send yet (each is
        marked `x-kasuwa-implemented: false`): today, the `account` summary
        (T-0059; T-0061 serves it). `properties` here is exactly what the live
        wire carries; the task that serves a pending property moves it into
        `properties` in the same change.
      allOf:
        - $ref: '#/components/schemas/ContactPendingProperties'
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the record belongs to. Read-only; set once at create.
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateContact.
        displayName: { type: string, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        phones:
          type: array
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          items: { type: string, format: email }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: '`null` is unassigned.'
        owner:
          description: |
            The owner, with a display name to print (T-0043, D-L64). `null`
            exactly when `ownerUserId` is `null`; otherwise `owner.id` equals
            `ownerUserId`. Read in the same scoped query as the contact, so a
            name is only ever sent for the owner of a record the caller can
            already see: this is not a user directory.

            Withheld with `ownerUserId`: when field security withholds
            `ownerUserId`, `owner` is omitted too and both are listed in
            `withheldFields`. Read-only; a write sets `ownerUserId`.
          oneOf:
            - { $ref: '#/components/schemas/ContactOwner' }
            - { type: 'null' }
        status:
          description: '`null` when never set (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactStatus' }
            - { type: 'null' }
        source:
          description: '`null` when not recorded (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactSource' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none; a stored NULL is sent as `[]`.
          items: { type: string, maxLength: 64 }
        preferredLanguage:
          type: [string, 'null']
          maxLength: 35
          description: BCP 47 tag, e.g. `en`, `yo`, `ha`, `ig`, `pcm`. Format-checked, no enum.
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        dnd:
          type: boolean
          default: false
          description: |
            On the NCC Do-Not-Disturb register. Read-only here: set by register
            lookup or import, never by an inline edit. Clearing it by hand would
            license promotional traffic to that number.
        whatsappOptIn: { type: boolean, default: false }
        consentState: { $ref: '#/components/schemas/ConsentState' }
        phoneNetwork:
          type: [string, 'null']
          maxLength: 32
          description: Read-only, server-derived (network detection is PRD Q5; null until then).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    ContactOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale or status.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    ContactPendingProperties:
      type: object
      description: |
        Contact properties this contract specifies and the live API does not
        serve yet. Composed into `Contact` (so every Contact-shaped response,
        list rows included, carries them once served) and kept out of
        `Contact.properties` until then, because `Contact.properties` is the
        live wire's key set: the T-0041 suite checks every one of them is
        present or listed in `withheldFields`. Optional, like every
        withholdable property; a client must cope with their absence.
      properties:
        account:
          x-kasuwa-implemented: false
          description: |
            The contact's account, with a name to print (P05/01's related
            records; T-0059, D-L72). `null` exactly when `accountId` is
            `null`; otherwise `account.id` equals `accountId`. Read in the
            same scoped query as the contact. Accounts are programme-scoped
            and a contact's account is always in the contact's programme, so
            this never names an account the caller's programme cannot see.

            **Withheld with `accountId`.** When field security withholds
            `accountId`, `account` is omitted too and both are listed in
            `withheldFields`. Read-only: neither write body takes `account`;
            a write sets `accountId`.

            **Not yet served (T-0061).** Until then the live record leaves it
            out and does not list it in `withheldFields`.
          oneOf:
            - { $ref: '#/components/schemas/ContactAccountSummary' }
            - { type: 'null' }

    ContactAccountSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        Closed: an account id and its name, nothing else. No owner, tier,
        industry or phones; the account record has those, under its own
        field security (getAccount).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        Keyset page of timeline items, newest first. No total, count or
        offset (D-P13), and nothing that says items were left out for field
        security. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
        nextCursor: { type: [string, 'null'] }

    TimelineItem:
      description: |
        One thing that happened to the contact. A closed union on `type`
        (D-L72): `field_changed` and `consent_changed`. `activity` is
        reserved for T-0060 and is added here when that slice defines its
        shape; no other type is added without a lead decision.

        An item for a field withheld from the caller is omitted from the
        timeline, value and name; see listContactTimeline.
      oneOf:
        - $ref: '#/components/schemas/FieldChangedItem'
        - $ref: '#/components/schemas/ConsentChangedItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/FieldChangedItem'
          consent_changed: '#/components/schemas/ConsentChangedItem'

    TimelineActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Who made a change: an id and a name to print, nothing else (the
        T-0043 owner shape). No email, phone, role or programme. Read in the
        same scoped query as the item, so a name is only ever sent for the
        author of a change to a record the caller can already see.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    FieldChangedItem:
      description: |
        A change to one Contact field, named by its contract wire name. One
        audit event that changed several fields is several items (one per
        field) sharing an `occurredAt`.

        Two shapes, by field (D-L72):
        - `FieldChangeWithValues`: the non-PII enumerated fields. `before`
          and `after` are present for changes recorded from T-0061 onward and
          absent on older ones, which were audited by name only (D-L63).
        - `FieldChangeRedacted`: phones, emails, the name parts, the owner
          and the account. Never a value, only the field name and
          `redacted: true`.

        `consentState` is not a `field_changed` field: its changes are
        `consent_changed` items.
      oneOf:
        - $ref: '#/components/schemas/FieldChangeWithValues'
        - $ref: '#/components/schemas/FieldChangeRedacted'

    FieldChangeWithValues:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field]
      properties:
        id:
          type: string
          description: |
            Opaque and unique per item; never the audit event id (one event
            yields several items). The tie-break for items sharing an
            `occurredAt`.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [status, source, preferredChannel, preferredLanguage, whatsappOptIn, state, lga, tags]
          description: The Contact property that changed.
        before:
          description: |
            The value before the change, in the Contact property's own wire
            type (a code, a string, a boolean or a list of tags); `null` when
            it had none. Absent on changes recorded before T-0061.
          type: [string, boolean, array, 'null']
          items: { type: string }
        after:
          description: The value after the change. Same rules as `before`.
          type: [string, boolean, array, 'null']
          items: { type: string }

    FieldChangeRedacted:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change shown by field name only. Phones and emails (D-L54) and a
        person's name (D-L63) are PII and never leave the audit trail as
        values. Owner and account changes carry no ids either (D-L64, D-L72).
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [displayName, givenNames, familyName, phones, emails, ownerUserId, accountId]
          description: The Contact property that changed.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    ConsentChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor]
      description: |
        A change to the contact's marketing consent (`consentState`, NDPA).
        It follows `consentState`'s field security: omitted whenever
        `consentState` is withheld from the caller.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: consent_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        before:
          description: |
            The consent state before the change (never null: a contact's
            consent starts at `unknown`). Absent on changes recorded before
            T-0061, which were audited by name only (D-L63).
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }
        after:
          description: The consent state after the change. Absent on changes recorded before T-0061.
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }

    MyProgramme:
      type: object
      additionalProperties: false
      required: [id, name]
      description: One programme the caller belongs to. Closed.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    MyProgrammeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MyProgramme' }

    ContactPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        nextCursor: { type: [string, 'null'] }

    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `dnd`, `phoneNetwork`, timestamps, `withheldFields`), is `400`.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        source: { $ref: '#/components/schemas/ContactSource' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    UpdateContactRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        and no `source` (how a contact arrived does not change). Server-owned
        properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    AccountTier:
      type: string
      enum: [enterprise, mid_market, sme]
      description: |
        Snake_case codes (D-L61); P04's labels ("Enterprise", "Mid-market",
        "SME") are i18n strings, never values. The column is T-0054's; this
        set is the contract it must store.

    AccountOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale, status or programme. The same shape as the contact's owner
        (T-0043); the two may become one shared schema.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    Account:
      type: object
      required: [id, programmeId, name, version, createdAt, updatedAt, withheldFields]
      description: |
        One account (an organisation) as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional, and why `tags`
        and `phones` are never nullable: an empty list means none.

        `id`, `programmeId`, `name`, `version`, `createdAt`, `updatedAt` and
        `withheldFields` are never withheld; `sort` uses only these.

        **Not here, deliberately (D-L69):** Health or any score (M17), deal or
        pipeline rollups, counts of contacts or other related records (D-P13),
        and a list of child accounts. The hierarchy is the one
        `parentAccountId` link.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the account belongs to. Read-only; set once at create.
        name: { type: string, minLength: 1, maxLength: 200 }
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateAccount.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            `null` is unassigned. Withheld together with `owner`: when field
            security withholds the owner, both are omitted and listed.
        owner:
          description: |
            The owner with a display name to print, embedded as T-0043 does
            for contacts. `null` exactly when `ownerUserId` is `null`;
            otherwise `owner.id` equals `ownerUserId`. Read in the same scoped
            query as the account, so a name is only ever sent for the owner of
            a record the caller can already see: this is not a user directory.
            Read-only; a write sets `ownerUserId`.
          oneOf:
            - { $ref: '#/components/schemas/AccountOwner' }
            - { type: 'null' }
        industry:
          type: [string, 'null']
          maxLength: 64
          description: Free text as the tenant records it (`FMCG`, `Agriculture`). No enum in this slice.
        tier:
          description: '`null` when not set.'
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none.
          items: { type: string, maxLength: 64 }
        phones:
          type: array
          description: |
            E.164. No DND flag here yet: no decision says where it lives for an
            account's numbers, so a screen must not infer one.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId:
          type: [string, 'null']
          format: uuid
          description: |
            The parent organisation, always in the same programme. `null` for a
            top-level account.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    AccountPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        nextCursor: { type: [string, 'null'] }

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `owner`, timestamps, `withheldFields`), is `400`. The owner is set by
        `ownerUserId`; its display name is the server's.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        (an account does not move between programmes) and no `owner` (set
        `ownerUserId`). Server-owned properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

  responses:
    ValidationFailed:
      description: |
        The request did not parse: a bad query value, a malformed cursor, a
        non-uuid id, an unknown or server-owned body property, a filter on a
        withheld field, or a scope header (the auth guard rejects those
        outright). `details` names paths and reason codes, never the submitted
        value.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            badField:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phones.0.e164
                    code: invalid_string
            badCursor:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: cursor
                    code: invalid_cursor
            withheldFilter:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: lga
                    code: field_withheld

    NotAuthenticated:
      description: |
        No usable session. It does not say whether the token was missing,
        expired, revoked or from another tenant.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 401
            error: Unauthorized
            code: not_authenticated
            message: Not authenticated

    NotFound:
      description: |
        **One body for all of:** no such contact, a contact in another tenant,
        a contact in a programme of this tenant the caller does not reach, and
        (on create) a target programme they do not reach. A `403` here would
        confirm the id names something real: an enumeration oracle against a
        BPO running two competitors' programmes on one workspace.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    NotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the record (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on contacts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: emails
                    code: field_not_editable

    StaleWrite:
      description: |
        `version` is not current: somebody saved since your last read. Nothing
        was applied. Re-read and re-apply; do not retry blind.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 409
            error: Conflict
            code: stale_write
            message: Someone else saved changes while you were editing. Reload and try again.

    AccountNotFound:
      description: |
        **One body for all of:** no such account, an account in another
        tenant, an account in a programme of this tenant the caller does not
        reach, and (on create) a target programme they do not reach. A `403`
        here would confirm the id names something real.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    AccountNotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the account (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on accounts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: tier
                    code: field_not_editable

    NotImplemented:
      description: |
        Specified, not built. One fixed body; the screen hides the feature
        rather than drawing an error.
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 501
            error: Not Implemented
            code: not_implemented
            message: Not implemented

security:
  - sessionToken: []
