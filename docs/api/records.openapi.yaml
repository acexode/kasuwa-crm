  /api/v1/pipelines/{pipelineId}/board:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [pipelines]
      summary: The Kanban board — exact counts and per-currency totals per stage
      operationId: getPipelineBoard
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P06/01', 'P06/03', 'P06/04']
      x-kasuwa-error-order: ['404 not_found', '400 validation_failed']
      x-kasuwa-rights:
        admin: read
        programme_manager: read
        team_lead: read
        agent: read
        qa_analyst: read
        client_portal: none
      description: |
        The P06/01 board and the P06/04 swipe list. One entry in `stages` per
        board column, in position order: every open stage, then the won
        stage. **Lost is not a column**: it is reached from the move sheet
        (D-L88), and lost deals are listed by listDeals.

        **Scope.** The pipeline must be readable by the caller, exactly as
        for getPipeline; anything else is the one `404 not_found` body. That
        check comes first: a bad parameter on a pipeline the caller cannot
        reach is `404`. A read, so no `403`; a `client_portal` caller gets
        the same `404` (D-L115).

        **Counts and totals (D-P19).** Each column carries an exact `count`
        of the deals in that stage, computed within the caller's scope,
        after the filters, over the whole stage and not the page: never
        capped and never approximate. D-P13 stands for record lists; this
        is the one count the contract serves. `totals` holds one entry per
        currency among the counted deals that have an amount, sorted by
        currency code, never converted and never summed across currencies.
        A deal with no amount is counted and adds to no total. An empty
        column has `count: 0` and `totals: []`. `weightedAmountMinor` is the
        sum of each deal's weighted amount: `amountMinor` times the stage's
        `probabilityBp` divided by 10000, rounded half-even PER DEAL, then
        summed (D-L88), never rounded once at the end. Sums are computed in
        Postgres `numeric`, never `bigint` or a JS number (see StageTotal).

        **When `amount` is withheld.** Field security is judged in the
        pipeline's programme, so it is the same for every card on a board.
        When it withholds `amount` from the caller, every column's `totals`
        is omitted, not empty, and `withheldFields` lists `amount`; cards
        omit `amount` and `weightedAmount` as Deal does. Counts stay.

        **Filters.** `q` matches the deal `name`, which is never withheld.
        A filter on a field withheld from the caller is `400
        validation_failed` with `details[].code: field_withheld` at the
        parameter: `owner` on `ownerUserId`, `closeFrom` and `closeTo` on
        `expectedCloseDate`, `currency` on `amount`. Field names are schema,
        not data, so this discloses nothing; ignoring the filter would serve
        counts that look filtered and are not. There is no amount-band,
        account, contact or territory filter. Unknown query parameters are
        ignored, never honoured.

        **Won** covers the deals that entered the won stage at or after
        `closedSince`, default 90 days before the request (D-L88): its
        count, totals and cards alike. Open columns ignore `closedSince`.
        It reaches back at most 366 days (`400 window_too_long`, never
        clamped) and never into the future (`400 invalid_window`).

        **Cards** are Deal rows under Deal field security. Open columns are
        ordered by `stageEnteredAt` ascending, ties broken by `id`
        ascending (the longest-waiting first); the won column by `closedAt`
        descending, ties broken by `id` descending. Each column holds at most
        `limit` cards and its own `nextCursor`. **Paging a column:** send
        that column's `stageId` and its `nextCursor` as `cursor`, with the
        same filters; the answer has the same shape with only that column in
        `stages`, its `count` and `totals` still for the whole stage. A
        `stageId` that is not an open or won stage of this pipeline is
        `400 validation_failed` with `details[].code: unknown_reference`.

        `Cache-Control: no-store` on every answer, `200`, `400` and `404`
        alike.
      parameters:
        - $ref: '#/components/parameters/DealSearch'
        - $ref: '#/components/parameters/DealOwnerFilter'
        - $ref: '#/components/parameters/CloseFrom'
        - $ref: '#/components/parameters/CloseTo'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/ClosedSince'
        - $ref: '#/components/parameters/BoardStageId'
        - $ref: '#/components/parameters/BoardCursor'
        - $ref: '#/components/parameters/BoardLimit'
      responses:
        '200':
          description: The board, or one column of it, field security applied.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
