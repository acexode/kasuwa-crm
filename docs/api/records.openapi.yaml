  # -------------------------------------------------------------------------
  # The deal timeline (P06, T-0111; D-L88, D-L72, D-L77, D-L80, D-L81, D-L85,
  # D-L127). Contract only until T-0111 serves it. The block rules above
  # (one 404 body, error order, rights, no-store) apply unchanged.
  # -------------------------------------------------------------------------

  /api/v1/deals/{dealId}/timeline:
    parameters:
      - $ref: '#/components/parameters/DealId'
    get:
      tags: [deals]
      summary: The deal's timeline — field changes and linked activities, newest first
      operationId: listDealTimeline
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P06/05', 'P06/06']
      x-kasuwa-error-order: ['404 not_found', '400 validation_failed']
      x-kasuwa-rights:
        admin: read
        programme_manager: read
        team_lead: read
        agent: read
        qa_analyst: read
        client_portal: none
      description: |
        The activity column of the P06/05 deal detail (T-0111): what changed
        on this deal, who changed it, and the notes, tasks, calls and
        meetings linked to it through `dealId` (createActivity,
        updateActivity). The same page shape, paging, ordering and item rules
        as listAccountTimeline, which this operation shares rather than
        forks; where this description is silent, that one applies.

        **Scope.** The deal must be readable by the caller, exactly as for
        getDeal: the `admin`, `programme_manager`, `team_lead`, `agent` and
        `qa_analyst` sets and the tenant-admin flag, in the deal's
        programme (D-L127). Anything else (no such deal, another tenant's,
        one in a programme the caller does not reach, a `client_portal`
        caller, a set that reads no deals, and an id that is not a uuid) is
        getDeal's one `404 not_found` body, the same bytes in every case.
        That check comes first, and nothing about the deal's history is read
        before it passes. **Order: `404`, then `400`.** A read, so there is
        no `403`. A scope header is refused `400` before any of this, by
        authentication, whatever the id.

        **Field changes: by name only.** One `field_changed` item per field
        named by an audit event of this deal (`objectType: deal`, this deal's
        id, in this deal's programme), created and updated alike; a creation
        renders like an update (D-L81), one item per field the create named.
        The field is named by its Deal wire name, from a closed list:
        `name`, `amount`, `expectedCloseDate`, `ownerUserId`,
        `primaryContactId`, `accountId`, `nextStep`, `stageId` and `checks`.
        **Every item is `redacted: true` and never carries `before` or
        `after`**, whatever the audit row holds: a reassignment's owner ids
        (D-L64) and a move's stage ids are not printed either, and a move
        appears as a `stageId` item (plus an item per field it filled and a
        `checks` item when it ticked one). Any other audited name, such as
        `stageEnteredAt` or `closedAt`, yields no item.

        **Activities.** One `activity` item per activity whose `dealId` is
        this deal, with whatever contact or account it targets, in its
        current state: `occurredAt` when it was logged (D-L77), so linking
        an older activity later puts it at its logged time, and its
        `version` for updateActivity (D-L85). The very ActivityItem of the
        contact and account timelines. **Not on it:** activities of the
        deal's contact or account that carry no `dealId`, and those of other
        deals.

        **Field security omits, before paging.** Judged in the deal's
        programme, against the set the caller holds there today; the
        tenant-admin flag does not lift it (D-L63). The DEAL's matrix judges
        field-change items, exactly as getDeal judges the Deal: an item is
        omitted, value and name, precisely when getDeal would list its field
        in `withheldFields` for this caller (`name`, `stageId` and `checks`
        are never withheld). The ACTIVITY's matrix judges each activity item,
        exactly as on the other timelines: a withheld `subject`, `body`,
        `dueAt`, `completedAt`, `startsAt` or `endsAt` is omitted from the
        item, and when the activity's deal link (`deal_id`) is withheld no
        activity item is shown at all (the counterpart of `account_id` on
        the account timeline). A withheld contact or account link does not
        remove an item from this timeline: the item names neither. `version`
        is never withheld. Omission happens before the page is cut: a page
        with a non-null `nextCursor` holds `limit` items, and a cursor never
        leads to an empty page.

        **Order and paging.** `occurredAt` descending across both sources,
        ties broken by item `id` descending in code-unit order. Keyset only:
        `{ data, nextCursor }`, no total, count or offset (D-P13). The cursor
        carries a position only: never a name (D-L80), and never an id of
        anything the pages did not show. A malformed cursor, or one issued
        for another deal, another timeline (a contact's or an account's) or
        another list, is `400 validation_failed` with
        `details[].code: invalid_cursor`, and a cursor issued for a deal the
        caller cannot reach answers exactly as one issued for a deal they
        can. `limit` out of 1..100 is `400`, never clamped.
        `Cache-Control: no-store` on every answer, `200`, `404` and `400`
        alike.

        **Actors and item ids** follow listContactTimeline (D-L81): the person
        who acted, named as they are named now; `null` is the system. Ids are
        opaque, never an audit event or activity id, and depend only on the
        item's own change or activity.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the deal's timeline, field security applied.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DealTimelinePage' }
              example:
                data:
                  - id: ti_7e1d0c2b3a4f45e6a7b8c9d0e1f2a3b4
                    type: field_changed
                    occurredAt: '2026-10-03T09:30:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: stageId
                    redacted: true
                  - id: ti_2c3d4e5f6a7b48c9d0e1f2a3b4c5d6e7
                    type: field_changed
                    occurredAt: '2026-10-03T09:30:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: expectedCloseDate
                    redacted: true
                  - id: ti_9f8e7d6c5b4a43210fedcba987654321
                    type: activity
                    occurredAt: '2026-10-01T11:40:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    activityId: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c03
                    activityType: call
                    subject: Pricing call
                    body: Wants the Q4 prices held until Friday.
                    dueAt: null
                    completedAt: null
                    startsAt: null
                    endsAt: null
                    version: 1
                nextCursor: dGltZWxpbmUtY3Vyc29yLWV4YW1wbGU
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/PipelineRecordNotFound' }

  # -------------------------------------------------------------------------
  # Global search (P27, T-0085; ADR-0014, ADR-0015, D-L128, D-P13, D-L87,
  # D-L80, D-L68, D-L115, D-L127). CONTRACT ONLY: `x-kasuwa-implemented:
  # false` on both operations (searchRecords and lookupRecords) until T-0086
  # serves them. The URL never carries a phone number or an email address:
  # exact lookups are a body-carrying POST. The five rules at the top of this file
  # apply unchanged, and so do the block rules of the pipelines section:
  # `x-kasuwa-error-order`, `x-kasuwa-rights` (here per record type) and
  # `Cache-Control: no-store` on every answer.
  #
  # Deliberately absent: tickets, conversations and KB (P27 draws them; no
  # module serves them yet, D-L87 keeps `types` additive), recent searches
  # (nothing is stored), filters by owner or date and facet counts (D-P13),
  # the count of hidden results (D-L87, CLAUDE.md 6.4), the programme scope
  # menu (D-L87 allows narrowing later, additively), commands and Ask AI.
  # -------------------------------------------------------------------------

  /api/v1/search:
    get:
      tags: [search]
      summary: Global search — at most three hits per record type, no counts
      operationId: searchRecords
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P27/A1', 'P27/A4', 'P27/A5', 'P27/D1']
      x-kasuwa-error-order:
        - 429 too_many_requests
        - 400 validation_failed query_required
        - 400 validation_failed identifier_in_url
        - 400 validation_failed invalid_string
        - 400 validation_failed unknown_type
        - 400 validation_failed query_too_short
      x-kasuwa-rights:
        admin: { contact: read, lead: read, account: read, deal: read }
        programme_manager: { contact: read, lead: read, account: read, deal: read }
        team_lead: { contact: read, lead: read, account: read, deal: read }
        agent: { contact: read, lead: read, account: read, deal: read }
        qa_analyst: { contact: read, lead: read, account: read, deal: read }
        client_portal: { contact: read, lead: read, account: read, deal: none }
      x-kasuwa-search-fields:
        contact: [displayName, givenNames, familyName, companyName]
        lead: [displayName, givenNames, familyName, companyName]
        account: [name]
        deal: [name]
      description: |
        The P27 search box and the record rows of the command palette: one
        read that answers a few hits of each record type, so the screen can
        group them. **"See all" is the type's own list read with `q`**
        (listContacts, listLeads, listAccounts); deals have no cross-pipeline
        list, so a deal hit opens the deal and there is no "see all" for
        deals. A list's `q` is a substring match and also matches numbers, so
        "see all" may show rows this read did not.

        **`q` is required.** A request without `q` is `400
        validation_failed` with `details[].code: query_required` at `q`.
        `types` narrows which groups are answered; absent, all four are.

        **The URL never carries a phone number or an email address.** Whole
        identifiers in a query string reach proxy and access logs (CLAUDE.md
        6.1, D-L80), so exact lookups are lookupRecords, a POST with a JSON
        body. A `phone` or `email` query parameter here is not ignored: it is
        `400 validation_failed` with `details[].code: identifier_in_url` at
        that parameter, so a client that puts one in the URL fails loudly
        instead of appearing to work. **`q` itself is refused when it looks
        like an identifier:** after Unicode NFKC normalisation, a `q` that
        contains `@`, or that contains a run of 6 or more decimal digits of
        any script (`\p{Nd}`) once every character that is neither a letter
        (`\p{L}`) nor a decimal digit is removed, is `400 validation_failed`
        with `details[].code: identifier_in_url` at `q` (D-L135). The `not`
        pattern on `q`'s schema is the same rule as an ECMA-262 Unicode
        regular expression; the server applies it after NFKC, so digits that
        NFKC maps to ASCII (superscript, circled) are refused too. So
        `08031234567`, `+234 803 123 4567`, `(0803) 123-4567`,
        `0803/123/4567`, `0803_123_4567`, `0803,123,4567`, `0803–123–4567`
        (en dash), `٠٨٠٣١٢٣٤٥٦٧` (Arabic-Indic digits) and
        `sample@example.test` are all refused, and `Sample 2026`,
        `Unit 12 Block 3456` or `Fixture-12.34` are not. A name that itself holds such a run
        cannot be prefix-searched by it. **Clients send phone- or
        email-shaped input to lookupRecords,** never to this operation.

        **Prefix matching on folded text (ADR-0015's fallback, D-L128).**
        `q` matches a field when the field's folded value STARTS WITH the
        folded query. Folding is the same on both sides: Unicode NFD, every
        combining mark removed, lower-cased by the locale-independent
        Unicode default mapping, leading and trailing whitespace trimmed, and
        each run of inner whitespace made one space. So `sam` and `SAM` find
        `Sámple Fixture`, and `sample f` finds it too. Letters with no
        decomposition (`ø`, `đ`, `ł`) are not folded. Comparison is by code
        point. **The prefix is of the whole field value, not of each word:**
        `fix` does not find `Sámple Fixture` by its display name (it finds
        it by `familyName` when that is `Fixture`). `%`, `_` and `\` match
        themselves literally (D-L115); there are no wildcards. `q` never
        matches a phone or an email: digits in `q` are matched against names
        as text. The fields each type matches on are listed in
        `x-kasuwa-search-fields`, and only those. **The folded query must be
        at least 2 characters**, else `400 validation_failed` with
        `details[].code: query_too_short` at `q`. Trigram similarity and
        word matching are a later, additive change (ADR-0015, once the
        LEAKPROOF marks are applied): they may add hits, and every prefix
        hit stays a hit.

        **Field security: a hit never matches on, or returns, a withheld
        field.** Each field is judged in the hit's OWN programme, against
        the permission set the caller holds there, row by row, exactly as a
        list's `q` is (D-L64); the tenant-admin flag never lifts it (D-L63).
        A field withheld there is never compared with the query, never
        decides which hits are chosen or their order, and is omitted from
        the hit and named in its `withheldFields`. Field security never
        makes this read answer `400 field_withheld`: a withheld field simply
        does not match.

        **`displayName` follows its name parts (the D-L68 ruling).** In a
        hit, a contact's or lead's `displayName` is readable exactly when
        both `givenNames` and `familyName` are readable in that record's
        programme. When either is withheld, `displayName` is withheld too:
        it is not matched, it is omitted, and `displayName` is listed in
        `withheldFields` alongside the withheld part. It is never composed
        from the readable part, and never replaced by one; the hit carries
        whichever name part is readable, and a screen prints that or a
        neutral label, never the id. The rule holds even when the withheld
        part is `null` on that record, so withholding is never a statement
        about a value. getContact, listContacts and listLeads are not
        changed by this operation (their alignment is the D-L68 follow-up).

        **Who reads what (`x-kasuwa-rights`).** Each group is read by exactly
        the callers who read that type through its own read, in each
        programme the session resolves: contacts, leads and accounts by
        every set, the `client_portal` set included; deals by the `admin`,
        `programme_manager`, `team_lead`, `agent` and `qa_analyst` sets and
        the tenant-admin flag (D-L127), never by `client_portal` (D-L115)
        and never by a custom permission set until an explicit per-set
        "read deals" grant exists (D-L127). A caller who does not read a
        type in a programme gets no hit of that type from it; the group is
        then answered as if nothing matched, never with an error. The lead
        group follows listLeads: a hit says the contact's `status` is a
        lead status, so when field security withholds `status` from the
        caller in any programme they reach, the lead group is answered
        empty, whatever matched. A contact who is a lead may appear in both
        the contact group and the lead group; both carry the contact id.

        **Scope is the session's (rule 1).** Hits come only from the
        programmes the session resolves, read inside the tenant
        transaction. There is no programme, tenant or scope parameter;
        unknown query parameters are ignored, never honoured, and a scope
        header is `400 validation_failed`. **Nothing outside that scope is
        counted, shown or hinted** (D-L87, CLAUDE.md 6.4): P27/B's "3 in
        programmes you are not on" is not served, and a record in another
        programme or tenant changes nothing in any answer.

        **The answer.** `groups` holds one group per requested type, always
        in the order contact, lead, account, deal, each with at most three
        hits, `[]` when none. **No counts** (D-P13): no total, no per-type
        or per-programme count, no "more" flag and no estimate. A screen
        always offers "see all" where a list exists. A record appears at
        most once in a group. Which three hits, and their order, are not
        part of the contract, except that the same data and query give the
        same answer and that neither ever depends on a withheld field. A
        hit is closed: its `type`, its `id`, its `programmeId` and only the
        fields its schema names. Contact and lead hits never carry a phone
        or an email.

        **Errors.** Every `400` is decided from the request alone, before
        any record is read, so no `400` depends on what exists. **Order**
        (`x-kasuwa-error-order`, the first that applies is returned):
        authentication (`401`) and the scope-header `400` first; then the
        per-user throttle (`429 too_many_requests`); then `q`
        present (`query_required`); then no identifier in the URL, in a
        `phone` or `email` parameter or in `q` itself (`identifier_in_url`);
        then each parameter's own shape (`q` over 100 characters or holding
        a NUL or other control character as `invalid_string`, then `types`
        values as `unknown_type`); then the length, as sent or once folded
        (`query_too_short`). A read, so there is never a `403`, and it names
        no record, so there is never a `404`.

        **Throttle (T-0086, D-L134).** Each user has a budget of
        searchRecords calls per window, separate from their lookupRecords
        budget; beyond it the answer is `429 too_many_requests`
        (`SearchTooManyRequests`), decided after authentication and before
        any validation, and the body never echoes the query.

        **Transport.** Every answer, errors included, carries
        `Cache-Control: no-store`: the URL is the same for every user of
        every tenant. **The query string is personal data** (a name):
        request telemetry keeps the route template only, and ingress must
        strip query strings from access logs before the first deployed cell
        (D-L80).
      parameters:
        - name: q
          in: query
          required: true
          description: |
            A name prefix, case- and accent-folded (see above). Required. At
            least 2 characters once folded and trimmed; at most 100 as sent.
            A NUL or other control character is `400 validation_failed` with
            `details[].code: invalid_string`. Never a phone number or an
            email address: an `@`, or a run of 6 or more decimal digits of
            any script once everything that is neither a letter nor a digit is
            removed (after NFKC), is `400 identifier_in_url`; send those to
            lookupRecords.
          schema:
            type: string
            minLength: 2
            maxLength: 100
            not:
              description: The identifier rule (R21, D-L135) as an ECMA-262 Unicode (`u`) regular expression; the server applies it after NFKC.
              pattern: '[@＠﹫]|\p{Nd}(?:[^\p{L}\p{Nd}]*\p{Nd}){5}'
        - name: types
          in: query
          required: false
          description: |
            Which groups to answer, any of; absent means all four. Repeat
            the parameter for several. An unknown or repeated value is `400
            validation_failed` (`unknown_type` for an unknown one). The set
            is additive (D-L87): a later version may add a type, and a client
            ignores a group whose `type` it does not know.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items: { $ref: '#/components/schemas/SearchType' }
      responses:
        '200':
          description: One group per requested type, at most three hits each, field security applied.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
              examples:
                prefix:
                  summary: q=sam, all four types, nothing withheld
                  value:
                    groups:
                      - type: contact
                        hits:
                          - type: contact
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000001
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            displayName: Sámple Fixture
                            givenNames: Sámple
                            familyName: Fixture
                            companyName: null
                            withheldFields: []
                          - type: contact
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000002
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            displayName: Samplewise Testcase
                            givenNames: Samplewise
                            familyName: Testcase
                            companyName: Example Trading Co.
                            withheldFields: []
                      - type: lead
                        hits:
                          - type: lead
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000003
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            displayName: Fixture Example
                            givenNames: Fixture
                            familyName: Example
                            companyName: Sample Wholesale Ltd
                            status: contacted
                            withheldFields: []
                      - type: account
                        hits:
                          - type: account
                            id: a1b2c3d4-0002-4a5b-8c6d-000000000001
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            name: Sample Holdings Ltd
                      - type: deal
                        hits:
                          - type: deal
                            id: a1b2c3d4-0003-4a5b-8c6d-000000000001
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            pipelineId: 3a4b5c6d-7e8f-4a0b-8c1d-2e3f4a5b6c01
                            name: Sample Holdings 40 terminals
                withheldNamePart:
                  summary: q=sam, contacts only, familyName withheld in that programme (D-L68)
                  value:
                    groups:
                      - type: contact
                        hits:
                          - type: contact
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000004
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a02
                            givenNames: Sampleton
                            companyName: null
                            withheldFields: [displayName, familyName]
                portal:
                  summary: q=sam by a client_portal caller, types=account&types=deal; no deal is read (D-L115)
                  value:
                    groups:
                      - type: account
                        hits:
                          - type: account
                            id: a1b2c3d4-0002-4a5b-8c6d-000000000001
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            name: Sample Holdings Ltd
                      - type: deal
                        hits: []
        '400': { $ref: '#/components/responses/SearchValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '429': { $ref: '#/components/responses/SearchTooManyRequests' }

  /api/v1/search/lookup:
    post:
      tags: [search]
      summary: Exact lookup by phone or email — a read sent as a POST so the identifier stays out of the URL
      operationId: lookupRecords
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P27/A2', 'P27/D1']
      x-kasuwa-error-order:
        - 429 too_many_requests
        - 400 validation_failed unknown_property
        - 400 validation_failed one_term_required
        - 400 validation_failed invalid_phone
        - 400 validation_failed invalid_email
        - 400 validation_failed unknown_type
      x-kasuwa-rights:
        admin: { contact: read, lead: read, account: read, deal: read }
        programme_manager: { contact: read, lead: read, account: read, deal: read }
        team_lead: { contact: read, lead: read, account: read, deal: read }
        agent: { contact: read, lead: read, account: read, deal: read }
        qa_analyst: { contact: read, lead: read, account: read, deal: read }
        client_portal: { contact: read, lead: read, account: read, deal: none }
      x-kasuwa-exact-fields:
        phone: { contact: phones, lead: phones }
        email: { contact: emails, lead: emails }
      description: |
        The exact half of P27 search: find contacts and leads by one whole
        phone number or one whole email address. **A POST used for privacy,
        not a mutation: it writes nothing.** It creates, changes and audits
        nothing, it is safe to retry, and it answers `200`, never `201`. It is
        a POST only so that the identifier travels in the body and **the URL
        never carries a phone number or an email address**: whole
        identifiers in a query string reach proxy and access logs (CLAUDE.md
        6.1, D-L80). searchRecords refuses them in its query string, `q`
        included, so a client sends any phone- or email-shaped input here.

        **Exactly one identifier.** The closed JSON body carries exactly one
        of `phone` or `email`, plus optional `types`. None, or both, is `400
        validation_failed` with `details[].code: one_term_required` at
        `phone`. Any other property is `400 validation_failed` with
        `details[].code: unknown_property` at the fixed path `body`: the
        client's key is never echoed, since a key can be an identifier too
        (`{"08031234567": 1}`).

        **Exact whole-value matching.** `phone` is a whole number in any
        common format (`0803 123 4567`, `+234 803 123 4567`,
        `2348031234567`), normalised to E.164 with the tenant's default
        country, then compared for equality with each stored E.164 number. A
        value that does not normalise to a whole, valid number, a partial
        number included, is `400 validation_failed` with
        `details[].code: invalid_phone` at `phone`: **never a prefix or
        substring of a number.** `email` is a whole address, trimmed and
        compared for equality case-insensitively; a value that is not an
        address is `400 validation_failed` with
        `details[].code: invalid_email` at `email`. Never a prefix or a
        substring. The fields compared are listed in `x-kasuwa-exact-fields`,
        and only those.

        **The answer is searchRecords' `SearchResults`.** Contacts and leads
        only: the account and deal groups, when requested, are answered
        empty. `types` narrows the groups exactly as on searchRecords (absent
        means all four; an unknown value is `unknown_type`). At most three
        hits per group, no counts (D-P13), the same closed hits; a hit never
        carries the phone or address that found it.

        **Shared with searchRecords, unchanged:** who reads what
        (`x-kasuwa-rights`, D-L127, D-L115), scope from the session only,
        nothing out of scope counted, shown or hinted, and field security
        per hit's own programme with the D-L68 `displayName` rule. **A
        number or address withheld in a record's programme is never
        compared:** the lookup does not find that record, and the answer is
        the same as for a number nobody has. Field security never answers
        `400 field_withheld`.

        **Errors.** Every `400` is decided from the request and the caller's
        own tenant settings (the default country `invalid_phone`
        normalises with), never from any record, so no `400` depends on what
        exists. **Order** (`x-kasuwa-error-order`, the first that applies is
        returned): authentication (`401`) and the scope-header `400` first;
        then the per-user throttle (`429 too_many_requests`);
        then the body as a closed JSON object (`unknown_property`); then the
        one-identifier rule (`one_term_required`); then each property's own
        shape (`phone` format and normalisation as `invalid_phone`, `email`
        format as `invalid_email`, then `types` values as `unknown_type`). A
        read, so there is never a `403`, and it names no record, so there is
        never a `404`.

        **Throttle (T-0086, D-L134).** Each user has a budget of
        lookupRecords calls per window, tighter than and separate from their
        searchRecords budget, since a lookup tests one whole identifier at a
        time; beyond it the answer is `429 too_many_requests`
        (`SearchTooManyRequests`), decided after authentication and before
        any validation, and the body never echoes the phone or address.

        **Transport.** Every answer, errors included, carries
        `Cache-Control: no-store`. The body is personal data: it is never
        logged or traced, and neither is the normalised number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LookupRequest' }
            examples:
              phone:
                summary: A number as a person types it (a placeholder; Nigeria has no fictional number range)
                value:
                  phone: 0803 000 0001
              email:
                value:
                  email: sample.fixture@example.test
              phoneNarrowed:
                summary: Leads only
                value:
                  phone: '+2348030000001'
                  types: [lead]
      responses:
        '200':
          description: One group per requested type; account and deal groups always empty.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
              examples:
                phoneLookup:
                  summary: phone 0803 000 0001 (a placeholder; Nigeria has no fictional number range), all four types; the account and deal groups empty
                  value:
                    groups:
                      - type: contact
                        hits:
                          - type: contact
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000002
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            displayName: Samplewise Testcase
                            givenNames: Samplewise
                            familyName: Testcase
                            companyName: Example Trading Co.
                            withheldFields: []
                      - type: lead
                        hits: []
                      - type: account
                        hits: []
                      - type: deal
                        hits: []
                leadsOnly:
                  summary: phone +2348030000001, types lead
                  value:
                    groups:
                      - type: lead
                        hits:
                          - type: lead
                            id: a1b2c3d4-0001-4a5b-8c6d-000000000003
                            programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                            displayName: Fixture Example
                            givenNames: Fixture
                            familyName: Example
                            companyName: Sample Wholesale Ltd
                            status: contacted
                            withheldFields: []
        '400': { $ref: '#/components/responses/LookupValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '429': { $ref: '#/components/responses/SearchTooManyRequests' }

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        `Authorization: Bearer ksw_s1_…` (auth.openapi.yaml). The token carries
        no claims and no scope; every request re-resolves both from the
        database.

  parameters:
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        A record identifier. An id the caller cannot reach, whether in another
        tenant, another programme or nowhere, is `404 not_found`. A value that
        is not a uuid is `400`.
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        An account identifier. An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`. A
        value that is not a uuid is `400`.
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        An activity identifier. An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`. A
        value that is not a uuid is `400`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged; do not parse it or build
        one. It is meant for the same `q`, filters and `sort` that produced
        it; a cursor issued under another `sort` is `400 invalid_cursor`. A
        malformed cursor is `400`. It carries the id of the last row and
        nothing else (T-0084, D-L80): never a name, a company or a time. The
        server resolves the position from that row's current sort key,
        inside the caller's scope. A well-formed cursor naming a row outside
        the caller's scope answers exactly as one naming no row: an empty
        page, never anyone else's rows (cursor-tampering and list-indexes
        acceptance suites).
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Rows per page. P04 offers 25, 50 and 100. Out of range is `400`, never clamped.
    TimeZone:
      name: timeZone
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z_][A-Za-z0-9_]*(/[A-Za-z0-9_+-]+){0,2}$'
      description: |
        The caller's IANA time zone (listMyActivities, T-0081), for example
        `Africa/Lagos`, `Africa/Nairobi` or `Africa/Johannesburg`. Required,
        with no default: the server never substitutes UTC, the tenant's zone
        or any other. It must match the pattern AND name a zone in the
        server's IANA time-zone database; anything else is `400
        validation_failed` with `details[].code: invalid_time_zone` at
        `timeZone`. An abbreviation (`WAT`), an offset (`+01:00`, `UTC+1`), a
        path (`../`), a value with spaces or a NUL, and a parameter sent twice
        are all `400`. The value is looked up as a name, never used as a file
        path. It decides where "today" ends and nothing else; every time on the
        wire stays UTC.
    ActivityBucket:
      name: bucket
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ActivityBucket' }
      description: Which group of P07/01 to list. Required; anything else is `400`.
    ActivityCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged, with the same other
        parameters; do not parse it or build one. It carries the id of the
        last row and nothing else (D-L80): never a subject, a name or a time.
        The server resolves the position from that activity's CURRENT sort
        key, inside the caller's scope. The id must name an activity the
        caller owns, in a programme the session resolves, of a kind the list
        shows (a task on listMyActivities; a task or a meeting on
        listCalendar), whose sort field (`dueAt`, or a meeting's `startsAt`)
        is not withheld from the caller. Anything else is `400
        validation_failed` with `details[].code: invalid_cursor`, one body
        whatever the reason, exactly as for a malformed cursor: no such
        activity, another tenant's or programme's, someone else's, a note or a
        call, or a withheld sort field. So a cursor cannot test whether an id
        exists. A task completed, snoozed or rescheduled since the page was
        cut still resolves, at its current position: the next page starts
        after it, and a moved row can make a later page skip or repeat a row.
        Re-read from the top after a write.
    WindowFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: |
        The window's start, inclusive (listCalendar). A UTC date-time with a
        `Z`; an offset, a date alone, year 0 or an impossible date is `400`.
    WindowTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: |
        The window's end, exclusive (listCalendar). A UTC date-time with a
        `Z`, after `from` (`400 invalid_window`) and at most 42 days after it
        (`400 window_too_long`, never clamped).

    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        A pipeline identifier (T-0105). An id the caller cannot reach, whether
        in another tenant, another programme or nowhere, is `404 not_found`,
        and **a value that is not a uuid is the same `404`, byte for byte**,
        never a `400`.
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        A deal identifier (T-0105). An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`, and
        **a value that is not a uuid is the same `404`, byte for byte**, never
        a `400`.
    PipelineCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged; do not parse it or build
        one. It carries the id of the last row and nothing else (D-L80): never
        a name. The server resolves the position from that pipeline's CURRENT
        sort key, inside the caller's scope. An id that does not name a
        pipeline the caller reaches is `400 validation_failed` with
        `details[].code: invalid_cursor`, one body whatever the reason,
        exactly as for a malformed cursor, so a cursor cannot test whether an
        id exists.
    DealCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged, with the same filters
        and `sort`; do not parse it or build one. It carries the id of the
        last row and nothing else (D-L80): never a deal name, an amount or a
        date. The server resolves the position from that deal's CURRENT sort
        key, inside the caller's scope. The id must name a deal of this
        pipeline that the caller reaches and that the same filters still
        select. Anything else is `400 validation_failed` with
        `details[].code: invalid_cursor`, one body whatever the reason,
        exactly as for a malformed cursor: no such deal, another tenant's or
        programme's, another pipeline's, or one the filters no longer
        select. So a cursor cannot test whether an id exists. Re-read from
        the top after a write.
    BoardCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: |
        **Opaque.** A column's `nextCursor`, echoed back unchanged with that
        column's `stageId` and the same filters; do not parse it or build
        one. It carries the id of the last row and nothing else (D-L80):
        never a deal name, an amount or a date. The server resolves the
        position from that deal's CURRENT sort key, inside the caller's
        scope. The id must name a deal the caller reaches, in that stage of
        this pipeline, that the same filters still select. Anything else,
        and a `cursor` sent without `stageId`, is `400 validation_failed`
        with `details[].code: invalid_cursor`, one body whatever the reason,
        exactly as for a malformed cursor: no such deal, another tenant's or
        programme's, another stage's, or one moved since the page was cut.
        So a cursor cannot test whether an id exists. Re-read the column from
        the top after a move.
    BoardStageId:
      name: stageId
      in: query
      required: false
      schema: { type: string, format: uuid }
      description: |
        One column only: an open or won stage of this pipeline, sent with that
        column's `cursor` to read its next page. Anything else, a lost stage
        included, is `400 validation_failed` with
        `details[].code: unknown_reference`.
    BoardLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      description: Cards per column. Out of range is `400`, never clamped.
    DealSearch:
      name: q
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 100 }
      description: |
        Part of the deal `name`, case- and diacritic-insensitive. `name` is
        never withheld, so the search discloses nothing. **`%` and `_` match
        themselves literally** (D-L115), never as wildcards: `q=50%` finds
        names containing `50%`, and `q=_` does not match every deal. A NUL
        character is `400 validation_failed`.
    DealOwnerFilter:
      name: owner
      in: query
      required: false
      description: |
        Owner filter, any of: a user id, `me` (the caller) or `unassigned`.
        Repeat the parameter for several. When field security withholds
        `ownerUserId` from the caller it is `400` with
        `details[].code: field_withheld` at `owner`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: '^(me|unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    CloseFrom:
      name: closeFrom
      in: query
      required: false
      schema: { type: string, format: date }
      description: |
        Deals whose `expectedCloseDate` is on or after this calendar date
        (`YYYY-MM-DD`, no zone; a deal with none is left out). Withheld
        `expectedCloseDate` is `400 field_withheld` at `closeFrom`.
    CloseTo:
      name: closeTo
      in: query
      required: false
      schema: { type: string, format: date }
      description: |
        Deals whose `expectedCloseDate` is on or before this calendar date.
        Before `closeFrom` is `400 validation_failed` with
        `details[].code: invalid_window`. Withheld `expectedCloseDate` is
        `400 field_withheld` at `closeTo`.
    CurrencyFilter:
      name: currency
      in: query
      required: false
      description: |
        Deals whose amount is in any of these ISO 4217 codes: NGN, GHS, KES
        or ZAR (see DealMoney). Repeat the parameter for several. Any other
        code, USD included, is `400 validation_failed` with
        `details[].code: unknown_currency` at `currency`, exactly as in a
        body. Withheld `amount` is `400 field_withheld` at `currency`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, pattern: '^[A-Z]{3}$' }
    ClosedSince:
      name: closedSince
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: |
        Won (and, on listDeals, lost) deals closed at or after this UTC
        date-time with a `Z`. Absent, it is 90 days before the request
        (D-L88), and the board echoes the value it used. Open deals ignore
        it. **Bounded (D-L115):** at most 366 days before the request; an
        earlier value is `400 validation_failed` with
        `details[].code: window_too_long` at `closedSince`, never clamped. A
        value after the request is `400 validation_failed` with
        `details[].code: invalid_window` at `closedSince`.

  headers:
    NoStore:
      description: |
        Always `no-store`. Every answer of every records route carries it,
        errors included (T-0080's middleware runs before the guards, so a
        `401` or a `400` from the guard has it too).
      schema: { type: string, enum: ['no-store'] }

  schemas:
    ContactStatus:
      type: string
      enum: [new, contacted, qualified, unqualified, customer]
      description: |
        Snake_case codes, as stored (T-0040); P04's labels ("Qualified") are
        i18n strings, never values. The tenant-wide default set. Programme-specific stages (P04/02 shows a
        collections programme's "Promise to pay", "In arrears") are not modelled
        in this slice.

    ContactSource:
      type: string
      enum: [whatsapp, ussd, web_form, missed_call, import, api, manual, referral, walk_in]

    PreferredChannel:
      type: string
      enum: [whatsapp, sms, voice, email]

    ConsentState:
      type: string
      enum: [unknown, opted_in, pending, withdrawn]
      default: unknown
      description: |
        Marketing consent under NDPA. Never null; a new contact is `unknown`.
        Changes are audited.

    Phone:
      type: object
      additionalProperties: false
      required: [type, e164]
      properties:
        type: { type: string, enum: [mobile, work, home, other] }
        e164:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164 only. A write in any other format is `400`.

    Contact:
      type: object
      required: [id, programmeId, version, displayName, createdAt, updatedAt, withheldFields]
      description: |
        One contact as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional and why `emails`,
        which P04/02 locks for the agent role, is not nullable: an empty list
        means none.

        `id`, `programmeId`, `version`, `displayName`, `createdAt`, `updatedAt`
        and `withheldFields` are never withheld.

        **Specified, not yet served.** The `allOf` part below adds properties
        this contract specifies and the live API does not send yet (each is
        marked `x-kasuwa-implemented: false`): none today. `properties` here
        is exactly what the live wire carries; the task that serves a pending
        property moves it into `properties` in the same change, as T-0061 did
        for `account` and T-0076 for `companyName`. The part stays, empty, so
        the next pending property has a place to go.
      allOf:
        - $ref: '#/components/schemas/ContactPendingProperties'
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the record belongs to. Read-only; set once at create.
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateContact.
        displayName: { type: string, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          maxLength: 200
          description: |
            The organisation the person says they are with, as free text
            (D-P17: `contact` gains a `company_name`, T-0076). The P04/01 Leads
            table's Company column. It is not a link: an `accountId` is the
            link, and a lead often has a company long before anyone creates
            an account for it. `null` means no company was recorded.

            **Field-secured like every other contact field** (field
            `company_name`). Withheld is omitted and listed in
            `withheldFields`, never sent as `null`. Writable on createContact
            and updateContact under the same field security, by `contact.write`
            only: the narrow edit the `agent`, `team_lead` and
            `programme_manager` sets hold (D-P14, D-P18) does not include it.
            convertContact neither copies it into the new account nor clears
            it; a screen may prefill the new account's name from it.

            Classified `pii` (D-L82): a sole trader's company is a person's
            name. The audit trail and the timeline name a change to it, never
            its value.
        phones:
          type: array
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          items: { type: string, format: email }
        accountId: { type: [string, 'null'], format: uuid }
        account:
          description: |
            The contact's account, with a name to print (P05/01's related
            records; T-0059, D-L72; served since T-0061). `null` exactly when
            `accountId` is `null`; otherwise `account.id` equals `accountId`.
            Read in the same scoped query as the contact. Accounts are
            programme-scoped and a contact's account is always in the
            contact's programme, so this never names an account the caller's
            programme cannot see.

            **Withheld with `accountId`.** When field security withholds
            `accountId`, `account` is omitted too and both are listed in
            `withheldFields`. Read-only: neither write body takes `account`;
            a write sets `accountId`.
          oneOf:
            - { $ref: '#/components/schemas/ContactAccountSummary' }
            - { type: 'null' }
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: '`null` is unassigned.'
        owner:
          description: |
            The owner, with a display name to print (T-0043, D-L64). `null`
            exactly when `ownerUserId` is `null`; otherwise `owner.id` equals
            `ownerUserId`. Read in the same scoped query as the contact, so a
            name is only ever sent for the owner of a record the caller can
            already see: this is not a user directory.

            Withheld with `ownerUserId`: when field security withholds
            `ownerUserId`, `owner` is omitted too and both are listed in
            `withheldFields`. Read-only; a write sets `ownerUserId`.

            **A former owner (T-0103, D-P23).** When the owner is no longer a
            member of THIS contact's programme (removed from it, or never in
            it), `owner` is `{ id, displayName: null }`: the id, so the
            client can tell an owner from none, and no name. Membership of any
            other programme, the reader's included, does not restore the
            name. A member whose account is disabled is still a member and
            keeps their name. The screens print a translated neutral label
            ("Former owner"), never the id. Removing a user from a programme
            also unassigns their contacts there (`ownerUserId` becomes
            `null`), so this form is for owners that removal has not reached.
            Never `500`, and never the name, current or past.
          oneOf:
            - { $ref: '#/components/schemas/ContactOwner' }
            - { type: 'null' }
        status:
          description: '`null` when never set (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactStatus' }
            - { type: 'null' }
        source:
          description: '`null` when not recorded (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactSource' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none; a stored NULL is sent as `[]`.
          items: { type: string, maxLength: 64 }
        preferredLanguage:
          type: [string, 'null']
          maxLength: 35
          description: BCP 47 tag, e.g. `en`, `yo`, `ha`, `ig`, `pcm`. Format-checked, no enum.
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        dnd:
          type: boolean
          default: false
          description: |
            On the NCC Do-Not-Disturb register. Read-only here: set by register
            lookup or import, never by an inline edit. Clearing it by hand would
            license promotional traffic to that number.
        whatsappOptIn: { type: boolean, default: false }
        consentState: { $ref: '#/components/schemas/ConsentState' }
        phoneNetwork:
          type: [string, 'null']
          maxLength: 32
          description: Read-only, server-derived (network detection is PRD Q5; null until then).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    ContactOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale or status. `displayName` is `null` exactly when the owner
        is a former owner: no longer a member of the contact's programme
        (T-0103, D-P23). It is always present.
      properties:
        id: { type: string, format: uuid }
        displayName:
          type: [string, 'null']
          description: |
            The owner's current display name. `null` means a former owner;
            print the translated neutral label, never the id.

    ContactPendingProperties:
      type: object
      description: |
        Contact properties this contract specifies and the live API does not
        serve yet. Composed into `Contact` (so every Contact-shaped response,
        list rows included, carries them once served) and kept out of
        `Contact.properties` until then, because `Contact.properties` is the
        live wire's key set: the T-0041 suite checks every one of them is
        present or listed in `withheldFields`. Optional, like every
        withholdable property; a client must cope with their absence.
        Empty today: `account` (T-0061) and `companyName` (T-0076) are served.
      properties: {}

    ContactAccountSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        Closed: an account id and its name, nothing else. No owner, tier,
        industry or phones; the account record has those, under its own
        field security (getAccount).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        Keyset page of timeline items, newest first. No total, count or
        offset (D-P13), and nothing that says items were left out for field
        security. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
        nextCursor: { type: [string, 'null'] }

    TimelineItem:
      description: |
        One thing that happened to the contact. A closed union on `type`
        (D-L72): `field_changed`, `consent_changed` and `activity` (T-0061);
        no other type is added without a lead decision.

        An item for a field withheld from the caller is omitted from the
        timeline, value and name; see listContactTimeline.
      oneOf:
        - $ref: '#/components/schemas/FieldChangedItem'
        - $ref: '#/components/schemas/ConsentChangedItem'
        - $ref: '#/components/schemas/ActivityItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/FieldChangedItem'
          consent_changed: '#/components/schemas/ConsentChangedItem'
          activity: '#/components/schemas/ActivityItem'

    TimelineActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Who made a change: an id and a name to print, nothing else (the
        T-0043 owner shape). No email, phone, role or programme. Read in the
        same scoped query as the item, so a name is only ever sent for the
        author of a change to a record the caller can already see.
        `displayName` is never `null`: unlike `Contact.owner` (D-P23), a
        former member, a tenant admin outside the programme and a disabled
        user are still named, because an actor acted inside the programme
        (D-L81).
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    FieldChangedItem:
      description: |
        A change to one Contact field, named by its contract wire name. One
        audit event that changed several fields is several items (one per
        field) sharing an `occurredAt`.

        Two shapes, by field (D-L72):
        - `FieldChangeWithValues`: the non-PII enumerated fields. `before`
          and `after` are present for changes recorded from T-0061 onward and
          absent on older ones, which were audited by name only (D-L63).
        - `FieldChangeRedacted`: phones, emails, the name parts, the
          company (T-0076, D-L82), the owner and the account. Never a value,
          only the field name and `redacted: true`.

        `consentState` is not a `field_changed` field: its changes are
        `consent_changed` items.
      oneOf:
        - $ref: '#/components/schemas/FieldChangeWithValues'
        - $ref: '#/components/schemas/FieldChangeRedacted'

    FieldChangeWithValues:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field]
      properties:
        id:
          type: string
          description: |
            Opaque and unique per item; never the audit event id (one event
            yields several items). The tie-break for items sharing an
            `occurredAt`.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [status, source, preferredChannel, preferredLanguage, whatsappOptIn, state, lga, tags]
          description: The Contact property that changed.
        before:
          description: |
            The value before the change, in the Contact property's own wire
            type (a code, a string, a boolean or a list of tags); `null` when
            it had none. Absent on changes recorded before T-0061.
          type: [string, boolean, array, 'null']
          items: { type: string }
        after:
          description: The value after the change. Same rules as `before`.
          type: [string, boolean, array, 'null']
          items: { type: string }

    FieldChangeRedacted:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change shown by field name only. Phones and emails (D-L54) and a
        person's name (D-L63) are PII and never leave the audit trail as
        values. Owner and account changes carry no ids either (D-L64, D-L72).
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [displayName, givenNames, familyName, companyName, phones, emails, ownerUserId, accountId]
          description: |
            The Contact property that changed. `companyName` (T-0076) is free
            text that is often a person's name, so it is shown by name only.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    ConsentChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor]
      description: |
        A change to the contact's marketing consent (`consentState`, NDPA).
        It follows `consentState`'s field security: omitted whenever
        `consentState` is withheld from the caller.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: consent_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        before:
          description: |
            The consent state before the change (never null: a contact's
            consent starts at `unknown`). Absent on changes recorded before
            T-0061, which were audited by name only (D-L63).
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }
        after:
          description: The consent state after the change. Absent on changes recorded before T-0061.
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }

    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, activityId, activityType, version]
      description: |
        A note, a task or a logged call on this contact (T-0061) or this
        account (T-0080), in its current state: completing a task changes
        this item and never adds one. `occurredAt` is when the activity was
        logged (D-L77), and `actor` who logged it (`null`: the system, such
        as an import). One schema for both timelines.

        Follows the activity object's field security in the record's
        programme: a `subject`, `body`, `dueAt`, `completedAt`, `startsAt` or
        `endsAt` the caller may not read is omitted from the item (never sent
        as `null`). A present `null` means no value. `version` is never
        withheld.

        `startsAt` and `endsAt` (a meeting's times, T-0081, served since
        T-0082) are on every activity item, `null` on a note, a task or a
        call.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the activity id or an audit event id.
        type: { type: string, const: activity }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        activityId:
          type: string
          format: uuid
          description: The activity, for updateActivity.
        activityType: { $ref: '#/components/schemas/ActivityType' }
        subject: { type: [string, 'null'], maxLength: 200 }
        body: { type: [string, 'null'], maxLength: 10000 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only; `null` on a note or a call.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Set by the server when a task is completed; `null` until then.
        startsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: A meeting's start (T-0081); `null` on any other type.
        endsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: A meeting's end, after `startsAt` and at most 24 hours after it; `null` on any other type.
        version:
          type: integer
          minimum: 1
          description: |
            The activity row's current `version` (D-L85), unchanged by field
            security: send it back on updateActivity to complete or reassign
            the activity. Stale is `409 stale_write`; re-read the timeline.

    AccountTimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        listAccountTimeline's page (T-0080): the same shape as TimelinePage,
        `{ data, nextCursor }`, with no total, count or offset (D-P13) and
        nothing that says items were left out. Its own schema, not
        TimelinePage, because its field changes are named by Account fields
        and never carry values: an account `tags` or `state` change is
        name-only, where the contact's carries values (D-L72, D-L78).
        `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AccountTimelineItem' }
        nextCursor: { type: [string, 'null'] }

    AccountTimelineItem:
      description: |
        One thing that happened to the account. A closed union on `type`:
        `field_changed` (by name only) and `activity` (the very ActivityItem
        of the contact timeline). An account has no consent, so there is no
        `consent_changed`. No other type is added without a lead decision
        (D-L72).
      oneOf:
        - $ref: '#/components/schemas/AccountFieldChangedItem'
        - $ref: '#/components/schemas/ActivityItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/AccountFieldChangedItem'
          activity: '#/components/schemas/ActivityItem'

    AccountFieldChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change to one Account field, shown by name only (D-L78: account
        audit records field names, never values; T-0078: an account has no
        value fields). Never `before` or `after`. One audit event that
        changed several fields is several items sharing an `occurredAt`.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [name, ownerUserId, industry, tier, tags, phones, state, lga, parentAccountId]
          description: The Account property that changed.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    DealTimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        listDealTimeline's page (T-0111): the same shape as TimelinePage and
        AccountTimelinePage, `{ data, nextCursor }`, with no total, count or
        offset (D-P13) and nothing that says items were left out. Its own
        schema because its field changes are named by Deal fields and never
        carry values. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DealTimelineItem' }
        nextCursor: { type: [string, 'null'] }

    DealTimelineItem:
      description: |
        One thing that happened to the deal. A closed union on `type`:
        `field_changed` (by name only) and `activity` (the very ActivityItem
        of the contact and account timelines). No other type is added
        without a lead decision (D-L72).
      oneOf:
        - $ref: '#/components/schemas/DealFieldChangedItem'
        - $ref: '#/components/schemas/ActivityItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/DealFieldChangedItem'
          activity: '#/components/schemas/ActivityItem'

    DealFieldChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change to one Deal field, shown by name only (D-L88: deal audit
        records names, and the ids it keeps for a move or a reassignment are
        never printed, D-L64). Never `before` or `after`. One audit event
        that changed several fields is several items sharing an
        `occurredAt`.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [name, amount, expectedCloseDate, ownerUserId, primaryContactId, accountId, nextStep, stageId, checks]
          description: |
            The Deal property that changed. `stageId` is a move (moveDeal);
            `checks` is a requirement check ticked by a move.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    ActivityType:
      type: string
      enum: [note, task, call, meeting]
      description: |
        Snake_case codes, as stored (0027); labels are i18n strings. Only a
        task has a due time (`dueAt`) and can be completed. Only a meeting
        has a start and an end (`startsAt`, `endsAt`). Closed: P07's demo,
        field visit and internal event are not types.

        **`meeting`** (T-0081, D-L87; served since T-0082). A client that
        renders activities must expect it on every activity-shaped read, the
        timelines included.

    ActivityBucket:
      type: string
      enum: [overdue, today, upcoming]
      description: |
        listMyActivities' groups (P07/01), computed by the server in the
        caller's `timeZone`: `overdue` is due before now; `today` is due from
        now until the next midnight in that zone; `upcoming` is due at or
        after it, then every task with no due time. Disjoint.

    Activity:
      type: object
      additionalProperties: false
      required: [id, programmeId, type, createdByUserId, version, createdAt, updatedAt, withheldFields]
      description: |
        One activity as the caller may see it (T-0061). The Contact rules
        apply: a property the caller's permission set may not read in the
        activity's programme is omitted and named in `withheldFields`, never
        sent as `null`. `id`, `programmeId`, `type`, `createdByUserId`,
        `version`, `createdAt`, `updatedAt` and `withheldFields` are never
        withheld. No tenant id.

        `startsAt` and `endsAt` (T-0081, served since T-0082) are present
        (or withheld) on every activity, `null` on a note, a task or a
        call.
      properties:
        id:
          type: string
          format: uuid
          description: Minted by the server (D-L79).
        programmeId:
          type: string
          format: uuid
          description: The programme of the activity's target. Read-only; set once at create.
        type: { $ref: '#/components/schemas/ActivityType' }
        subject: { type: [string, 'null'], maxLength: 200 }
        body: { type: [string, 'null'], maxLength: 10000 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Set by the server when a task is completed. Never cleared (D-L81).
        startsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: Meetings only (T-0081); `null` on any other type.
        endsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only (T-0081): after `startsAt` and at most 24 hours after
            it. `null` on any other type.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: '`null` is unassigned. Always a member of the activity''s programme.'
        contactId: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
        dealId:
          type: [string, 'null']
          format: uuid
          x-kasuwa-implemented: true
          description: |
            The deal this activity is linked to (T-0111), always in the
            activity's programme; `null` when none. Withheld, and named in
            `withheldFields`, when the activity's `deal_id` field is withheld
            from the caller.
        createdByUserId:
          type: [string, 'null']
          format: uuid
          description: Who logged it, from the session (D-L79). `null` is the system.
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateActivity.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Always present; empty when nothing was withheld.
          items:
            type: string
            enum: [subject, body, dueAt, completedAt, startsAt, endsAt, ownerUserId, contactId, accountId, dealId]

    CreateActivityRequest:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        Closed. At least one of `contactId` and `accountId`. No `id` (D-L79),
        no `programmeId` (the target's), no creator (the session's), no
        `completedAt` (the server's), no `version`: each is `400`. A meeting
        requires `startsAt` and `endsAt`; see createActivity.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        subject:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Free text; never logged. A NUL character is `400`.
        body:
          type: [string, 'null']
          minLength: 1
          maxLength: 10000
          description: Free text; never logged. A NUL character is `400`.
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only (`400 task_only` on a note, a call or a meeting). UTC, with a `Z`.
        startsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only, and required on one (`400 meeting_only` on any other
            type). UTC, with a `Z`. Not nullable.
        endsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only, and required on one. After `startsAt`
            (`400 invalid_range`) and at most 24 hours after it
            (`400 too_long`). UTC, with a `Z`. Not nullable.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            A member of the activity's programme (D-L67). Anyone but the
            caller needs `activity.reassign` (D-L81).
        contactId:
          type: [string, 'null']
          format: uuid
          description: Decides the programme when given.
        accountId:
          type: [string, 'null']
          format: uuid
          description: Decides the programme when it is the only target; else must be in the contact's.
        dealId:
          type: [string, 'null']
          format: uuid
          x-kasuwa-implemented: true
          description: |
            Links the activity to a deal (T-0111). A link, never a target: it
            does not decide the programme and does not replace `contactId`
            or `accountId`. Must be a deal in the activity's programme, else
            `400 unknown_reference` at `dealId`, one body whether it names a
            deal elsewhere or nothing.

    UpdateActivityRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Closed: `version` plus only the fields the person changed (D-L102):
        `completed: true` and/or `ownerUserId` (D-L81), and from T-0081
        `dueAt` (a task), `startsAt` and `endsAt` (a meeting). Retargeting,
        moving programme and every server-owned field are `400`. There is no
        way to reopen a task: `completed` admits only `true` and there is no
        `completedAt` (D-L81, D-L87).
      properties:
        version:
          type: integer
          minimum: 1
          description: The activity's current `version`; a stale one is `409 stale_write`.
        completed:
          type: boolean
          enum: [true]
          description: Complete a task; the server sets `completedAt`. A note, a call or a meeting is `400 task_only`.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            Reassign to a member of the activity's programme, or `null` to
            clear. The `agent` set may set only itself (D-L81).
        dueAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Snooze or move a task (T-0081); `null` clears its due time. A
            note, a call or a meeting is `400 task_only`. UTC, with a `Z`.
            Never changes `completedAt`.
        startsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Move a meeting's start (T-0081). Anything but a meeting is
            `400 meeting_only`. Not nullable. The result must keep `endsAt`
            after `startsAt` and at most 24 hours after it.
        endsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Move a meeting's end (T-0081). Anything but a meeting is
            `400 meeting_only`. Not nullable. Judged on the result, as
            `startsAt`.
        dealId:
          type: [string, 'null']
          format: uuid
          x-kasuwa-implemented: true
          description: |
            Link the activity to a deal, or move the link to another deal
            (T-0111); `null` unlinks it. A deal in the activity's programme,
            else `400 unknown_reference` at `dealId`, one body whether it
            names a deal elsewhere or nothing. The only link an update may
            change: `contactId` and `accountId` stay `400`.

    ActivityContactSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: the activity's contact, an id and a name to print, nothing
        else (no phone, email, owner or status). The contact is always in the
        activity's programme, so this names nobody the caller's programme
        cannot see.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 200 }

    MyActivity:
      type: object
      additionalProperties: false
      required: [id, programmeId, type, version, withheldFields]
      description: |
        One of the caller's own activities on listMyActivities or
        listCalendar (T-0081): a task or a meeting, with what P07 draws on a
        row or an event and nothing more. No `body` (a list carries no free
        text beyond the subject; the timeline has it) and no owner (it is
        always the caller). No tenant id.

        **Field security** in the activity's own programme, as on Activity:
        a property the caller may not read is omitted and named in
        `withheldFields`, never sent as `null`. `contact` is withheld with the
        activity's contact link (`contactId`) and `account` with its account
        link (`accountId`). `id`, `programmeId`, `type`, `version` and
        `withheldFields` are never withheld. A task whose `dueAt`, or a
        meeting whose `startsAt` or `endsAt`, is withheld is not listed at
        all (see the operations).

        `version` is the activity's current one: send it back on
        updateActivity to complete, snooze or reschedule this item.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The activity's programme.
        type:
          type: string
          enum: [task, meeting]
          description: Only tasks and meetings have a time. Notes and calls are never listed.
        subject: { type: [string, 'null'], maxLength: 200 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: A task's due time; `null` on a meeting and on an undated task.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Always `null` on listMyActivities (it lists open tasks); a
            completed task on listCalendar carries its completion time.
        startsAt:
          type: [string, 'null']
          format: date-time
          description: A meeting's start; `null` on a task.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: A meeting's end; `null` on a task.
        contact:
          description: The activity's contact, or `null` when it has none. Withheld with `contactId`.
          oneOf:
            - { $ref: '#/components/schemas/ActivityContactSummary' }
            - { type: 'null' }
        account:
          description: The activity's account, or `null` when it has none. Withheld with `accountId`.
          oneOf:
            - { $ref: '#/components/schemas/ContactAccountSummary' }
            - { type: 'null' }
        version:
          type: integer
          minimum: 1
          description: The activity's current `version`, for updateActivity. Never withheld.
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Always present; empty when nothing was withheld.
          items:
            type: string
            enum: [subject, dueAt, completedAt, startsAt, endsAt, contact, account]

    MyActivityPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        Keyset page of the caller's own activities (listMyActivities,
        listCalendar). No total, count, offset or count per bucket or day
        (D-P13), and nothing that says items were left out for field
        security. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MyActivity' }
        nextCursor: { type: [string, 'null'] }

    MyProgramme:
      type: object
      additionalProperties: false
      required: [id, name]
      description: One programme the caller belongs to. Closed.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    MyProgrammeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MyProgramme' }

    ContactPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        nextCursor: { type: [string, 'null'] }

    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `dnd`, `phoneNetwork`, timestamps, `withheldFields`), is `400`.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Free-text company (Contact.companyName). Declared here, not only
            on Contact, because this body is closed. 1 to 200 characters;
            `""`, a NUL character or more than 200 is `400 validation_failed`
            (D-L82). `null` or absent records none.
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        source: { $ref: '#/components/schemas/ContactSource' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    UpdateContactRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        and no `source` (how a contact arrived does not change). Server-owned
        properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Free-text company (Contact.companyName); `null` clears it. 1 to
            200 characters; `""`, a NUL character or more than 200 is
            `400 validation_failed` (D-L82). Needs `contact.write`: the D-P14
            narrow edit does not cover it, so a body carrying it from the
            `agent`, `team_lead` or `programme_manager` set is `403`.
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    ConvertContactRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Closed. `version` plus EXACTLY ONE of `accountId` (link an existing
        account) or `newAccount` (create one and link it). Both, or neither,
        is `400 validation_failed`. There is no `status` (convert always
        qualifies, and never demotes a customer), no `programmeId` (the
        account is the contact's programme's, full stop) and no contact id
        (the path names the contact).
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            The contact's `version` from your last read. Not current is
            `409 stale_write`, except for an exact repeat whose result is
            already in place (see convertContact).
        accountId:
          type: string
          format: uuid
          description: |
            An existing account in the contact's programme. Never `null`: a
            convert always links an account. An account the caller cannot
            reach, or one in another programme, is `404 not_found`.
        newAccount: { $ref: '#/components/schemas/ConvertNewAccount' }
      oneOf:
        - required: [accountId]
        - required: [newAccount]

    ConvertNewAccount:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        The account convert creates, in the contact's programme. Closed, and
        deliberately small: a name. It has no `programmeId` (the contact's
        programme decides) and no owner (the new account is unassigned; set
        `ownerUserId` afterwards with updateAccount). Every other account
        field is set on the account afterwards.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    ConvertContactResponse:
      type: object
      additionalProperties: false
      required: [contact, account]
      description: |
        Closed: the converted contact and its account, each under its own
        field security, and nothing else. The first call and an exact repeat
        answer with the same shape; nothing here says whether this call
        created the account.
      properties:
        contact: { $ref: '#/components/schemas/Contact' }
        account: { $ref: '#/components/schemas/Account' }

    AccountTier:
      type: string
      enum: [enterprise, mid_market, sme]
      description: |
        Snake_case codes (D-L61); P04's labels ("Enterprise", "Mid-market",
        "SME") are i18n strings, never values. The column is T-0054's; this
        set is the contract it must store.

    AccountOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale, status or programme. The same shape as the contact's owner
        (T-0043); the two may become one shared schema.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    Account:
      type: object
      required: [id, programmeId, name, version, createdAt, updatedAt, withheldFields]
      description: |
        One account (an organisation) as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional, and why `tags`
        and `phones` are never nullable: an empty list means none.

        `id`, `programmeId`, `name`, `version`, `createdAt`, `updatedAt` and
        `withheldFields` are never withheld; `sort` uses only these.

        **Not here, deliberately (D-L69):** Health or any score (M17), deal or
        pipeline rollups, counts of contacts or other related records (D-P13),
        and a list of child accounts. The hierarchy is the one
        `parentAccountId` link.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the account belongs to. Read-only; set once at create.
        name: { type: string, minLength: 1, maxLength: 200 }
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateAccount.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            `null` is unassigned. Withheld together with `owner`: when field
            security withholds the owner, both are omitted and listed.
        owner:
          description: |
            The owner with a display name to print, embedded as T-0043 does
            for contacts. `null` exactly when `ownerUserId` is `null`;
            otherwise `owner.id` equals `ownerUserId`. Read in the same scoped
            query as the account, so a name is only ever sent for the owner of
            a record the caller can already see: this is not a user directory.
            Read-only; a write sets `ownerUserId`.
          oneOf:
            - { $ref: '#/components/schemas/AccountOwner' }
            - { type: 'null' }
        industry:
          type: [string, 'null']
          maxLength: 64
          description: Free text as the tenant records it (`FMCG`, `Agriculture`). No enum in this slice.
        tier:
          description: '`null` when not set.'
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none.
          items: { type: string, maxLength: 64 }
        phones:
          type: array
          description: |
            E.164. No DND flag here yet: no decision says where it lives for an
            account's numbers, so a screen must not infer one.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId:
          type: [string, 'null']
          format: uuid
          description: |
            The parent organisation, always in the same programme. `null` for a
            top-level account.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    AccountPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        nextCursor: { type: [string, 'null'] }

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `owner`, timestamps, `withheldFields`), is `400`. The owner is set by
        `ownerUserId`; its display name is the server's.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        (an account does not move between programmes) and no `owner` (set
        `ownerUserId`). Server-owned properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

    # --- pipelines and deals (P06, T-0105) ---------------------------------

    DealMoney:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      description: |
        Money on a deal (D-L88): minor units as a decimal string (a `bigint`
        does not survive JSON) plus an ISO 4217 code. Never a float, never a
        currency symbol, never converted. Non-negative, at most 18 digits,
        no leading zero. The minor unit is the currency's own (kobo for NGN,
        pesewa for GHS). **The currencies are NGN, GHS, KES and ZAR**
        (D-L88, D-L115); there is no USD. Any other code, well-formed or
        not, is `400 validation_failed` with
        `details[].code: unknown_currency` at the code's path, in a body
        (`amount.currency`, `fields.amount.currency`) and in the `currency`
        filter alike. The pattern is kept to three capitals, and the list is
        not an `enum`, so that a schema-driven pipe cannot answer an unknown
        code with a generic error instead of `unknown_currency`.
      properties:
        amountMinor: { type: string, pattern: '^(0|[1-9][0-9]{0,17})$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    StageTotal:
      type: object
      additionalProperties: false
      required: [currency, amountMinor, weightedAmountMinor]
      description: |
        One currency's total in one board column (D-P19). `weightedAmountMinor`
        is the sum of each deal's weighted amount, rounded half-even per deal
        before summing (D-L88). **Sums are computed in Postgres `numeric`,
        never `bigint` or a JS number** (D-L115): a `bigint` overflows past
        19 digits and a JS number is exact only up to 2^53, so either would
        corrupt a large column silently. Each `amountMinor` is at most 18
        digits (below 10^18) and a weighted amount never exceeds its amount
        (`probabilityBp` is at most 10000), so a total of fewer than 10^6
        deals is below 10^24 and fits the 24 digits allowed here.
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amountMinor: { type: string, pattern: '^(0|[1-9][0-9]{0,23})$' }
        weightedAmountMinor: { type: string, pattern: '^(0|[1-9][0-9]{0,23})$' }

    StageKind:
      type: string
      enum: [open, won, lost]
      description: Exactly one `won` and one `lost` stage per pipeline (D-L88).

    DealRequirementField:
      type: string
      enum: [amount, expectedCloseDate, nextStep, primaryContactId, accountId]
      description: |
        The standard deal fields a `field` requirement may name. Custom deal
        fields wait for the custom-field values slice (D-L60).

    FieldRequirement:
      type: object
      additionalProperties: false
      required: [id, kind, field]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, const: field }
        field: { $ref: '#/components/schemas/DealRequirementField' }

    CheckRequirement:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      description: A checklist item. Its tick records who and when.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, const: check }
        label: { type: string, minLength: 1, maxLength: 200 }

    StageRequirement:
      description: An entry requirement of a stage (D-P20).
      oneOf:
        - { $ref: '#/components/schemas/FieldRequirement' }
        - { $ref: '#/components/schemas/CheckRequirement' }

    PipelineStage:
      type: object
      additionalProperties: false
      required: [id, name, kind, position, probabilityBp, rottingAfterDays, requirements]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/StageKind' }
        position: { type: integer, minimum: 0, maximum: 99 }
        probabilityBp:
          type: integer
          minimum: 0
          maximum: 10000
          description: Basis points. Won is 10000; lost is 0.
        rottingAfterDays:
          type: [integer, 'null']
          minimum: 2
          maximum: 365
          description: Open stages only (default 14); `null` on won and lost. Stale from half, rounded down.
        requirements:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/StageRequirement' }

    StageTransition:
      type: object
      additionalProperties: false
      required: [fromStageId, toStageId]
      properties:
        fromStageId: { type: string, format: uuid }
        toStageId: { type: string, format: uuid }

    PipelineSummary:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PipelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: Keyset page. No total, offset or page number (D-P13).
      properties:
        data:
          type: array
          maxItems: 100
          description: At most `limit` rows (1 to 100).
          items: { $ref: '#/components/schemas/PipelineSummary' }
        nextCursor: { type: [string, 'null'] }

    Pipeline:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, version, stages, transitions, createdAt, updatedAt]
      description: |
        A pipeline's configuration (getPipeline). Read-only in this contract.
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        version: { type: integer, minimum: 1 }
        stages:
          type: array
          minItems: 3
          maxItems: 30
          description: In position order.
          items: { $ref: '#/components/schemas/PipelineStage' }
        transitions:
          type: array
          maxItems: 900
          items: { $ref: '#/components/schemas/StageTransition' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DealOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        An id and a name to print. `displayName` is `null` for a former owner,
        no longer a member of the deal's programme (D-P23); print a neutral
        label, never the id.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }

    DealActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        The person who ticked a check, named as they are named now (D-L81).
        `displayName` is `null` for a former checker, no longer a member of
        the deal's programme (D-L127), exactly as `DealOwner` is for a former
        owner (D-P23): print a neutral label, never the id. Pinned for the
        screen by T-0110's suite; until the API change that serves it lands,
        a former checker is still named, so a client accepts both.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, 'null'] }

    DealContactSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    DealAccountSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    DealCheck:
      type: object
      additionalProperties: false
      required: [requirementId, checkedAt, checkedBy]
      properties:
        requirementId: { type: string, format: uuid }
        checkedAt: { type: string, format: date-time }
        checkedBy: { $ref: '#/components/schemas/DealActor' }

    DealRotting:
      type: string
      enum: [fresh, stale, rotting]
      description: |
        Computed by the server at read time from whole 24-hour periods since
        `stageEnteredAt` (no zone): `stale` from half the stage's
        `rottingAfterDays`, rounded down, and `rotting` from
        `rottingAfterDays`.

    DealWithheldField:
      type: string
      enum: [amount, expectedCloseDate, ownerUserId, primaryContactId, accountId, nextStep]

    Deal:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - pipelineId
        - stageId
        - version
        - name
        - stageEnteredAt
        - closedAt
        - rotting
        - checks
        - createdAt
        - updatedAt
        - withheldFields
      description: |
        One deal as the caller may see it: a board card, a list row and the
        detail alike.

        **Withheld fields are omitted, never nulled.** A withheld field's
        name is in `withheldFields` and the property is absent; withholding
        `amount` also omits `weightedAmount`, `ownerUserId` also `owner`,
        `primaryContactId` also `contact`, and `accountId` also `account`.
        A present `null` means no value.

        `id`, `programmeId`, `pipelineId`, `stageId`, `version`, `name`,
        `stageEnteredAt`, `closedAt`, `rotting`, `checks`, `createdAt`,
        `updatedAt` and `withheldFields` are never withheld.

        **One currency per deal, never converted** (D-L88). The probability
        is the stage's; `weightedAmount` is `amount` times the stage's
        `probabilityBp` divided by 10000, rounded half-even, in the same
        currency.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The pipeline's programme. Read-only; a deal never changes programme.
        pipelineId: { type: string, format: uuid }
        stageId:
          type: string
          format: uuid
          description: Read-only here; it changes only through moveDeal.
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Optimistic-concurrency token for updateDeal and moveDeal.
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-kasuwa-classification: pii
          description: Free text that may name a person or a business (D-L91); never logged.
        amount:
          oneOf:
            - { $ref: '#/components/schemas/DealMoney' }
            - { type: 'null' }
        weightedAmount:
          description: Read-only, derived; withheld with `amount`.
          oneOf:
            - { $ref: '#/components/schemas/DealMoney' }
            - { type: 'null' }
        expectedCloseDate:
          type: [string, 'null']
          format: date
          description: A calendar date (`YYYY-MM-DD`), no zone.
        ownerUserId: { type: [string, 'null'], format: uuid }
        owner:
          description: '`null` exactly when `ownerUserId` is `null`. Read-only.'
          oneOf:
            - { $ref: '#/components/schemas/DealOwner' }
            - { type: 'null' }
        primaryContactId:
          type: [string, 'null']
          format: uuid
          description: One primary contact, in the deal's programme.
        contact:
          description: Read-only; withheld with `primaryContactId`.
          oneOf:
            - { $ref: '#/components/schemas/DealContactSummary' }
            - { type: 'null' }
        accountId:
          type: [string, 'null']
          format: uuid
          description: One account, in the deal's programme.
        account:
          description: Read-only; withheld with `accountId`.
          oneOf:
            - { $ref: '#/components/schemas/DealAccountSummary' }
            - { type: 'null' }
        nextStep:
          type: [string, 'null']
          maxLength: 200
          x-kasuwa-classification: pii
          description: Free text that may name a person (D-L91); never logged.
        stageEnteredAt:
          type: string
          format: date-time
          description: When the deal entered its current stage.
        closedAt:
          type: [string, 'null']
          format: date-time
          description: When it entered won or lost; `null` while open.
        rotting:
          description: '`null` on a won or lost deal.'
          oneOf:
            - { $ref: '#/components/schemas/DealRotting' }
            - { type: 'null' }
        checks:
          type: array
          maxItems: 600
          description: |
            The check requirements ticked on this deal, each once. At most one
            per check requirement of the pipeline: 30 stages of at most 20
            requirements each bound it at 600.
          items: { $ref: '#/components/schemas/DealCheck' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          uniqueItems: true
          description: Always present; empty when nothing was withheld.
          items: { $ref: '#/components/schemas/DealWithheldField' }

    DealPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: Keyset page. No total, offset or page number (D-P13).
      properties:
        data:
          type: array
          maxItems: 100
          description: At most `limit` rows (1 to 100).
          items: { $ref: '#/components/schemas/Deal' }
        nextCursor: { type: [string, 'null'] }

    BoardStage:
      type: object
      additionalProperties: false
      required: [stageId, count, cards, nextCursor]
      description: |
        One board column. `count` and `totals` cover the whole stage within
        the caller's scope and filters, not the page (D-P19). `totals` is
        omitted when `amount` is withheld from the caller.
      properties:
        stageId: { type: string, format: uuid }
        count: { type: integer, minimum: 0 }
        totals:
          type: array
          maxItems: 4
          description: |
            One entry per currency, sorted by code; empty for a column with no
            amounts. At most four: NGN, GHS, KES and ZAR (DealMoney).
          items: { $ref: '#/components/schemas/StageTotal' }
        cards:
          type: array
          maxItems: 50
          description: At most `limit` cards (1 to 50, default 20).
          items: { $ref: '#/components/schemas/Deal' }
        nextCursor: { type: [string, 'null'] }

    PipelineBoard:
      type: object
      additionalProperties: false
      required: [pipelineId, closedSince, withheldFields, stages]
      properties:
        pipelineId: { type: string, format: uuid }
        closedSince:
          type: string
          format: date-time
          description: The `closedSince` the won column used.
        withheldFields:
          type: array
          uniqueItems: true
          description: Deal fields withheld from the caller in the pipeline's programme.
          items: { $ref: '#/components/schemas/DealWithheldField' }
        stages:
          type: array
          maxItems: 29
          description: |
            Open stages then won, in position order; one entry when `stageId`
            was sent. At most 29: a pipeline has at most 30 stages, and lost is
            not a column.
          items: { $ref: '#/components/schemas/BoardStage' }

    CreateDealRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Closed: an unknown or server-owned property (`id`, `programmeId`,
        `pipelineId`, `stageId`, `version`, `weightedAmount`, `owner`,
        `contact`, `account`, `checks`, timestamps, `withheldFields`) is
        `400`.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        amount:
          oneOf:
            - { $ref: '#/components/schemas/DealMoney' }
            - { type: 'null' }
        expectedCloseDate: { type: [string, 'null'], format: date }
        ownerUserId: { type: [string, 'null'], format: uuid }
        primaryContactId: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
        nextStep: { type: [string, 'null'], minLength: 1, maxLength: 200 }

    UpdateDealRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus the changed fields only (D-L102). No `stageId`
        (moveDeal), no `pipelineId` or `programmeId`.
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: The `version` from your last read. Not current is `409 stale_write`.
        name: { type: string, minLength: 1, maxLength: 200 }
        amount:
          oneOf:
            - { $ref: '#/components/schemas/DealMoney' }
            - { type: 'null' }
        expectedCloseDate: { type: [string, 'null'], format: date }
        ownerUserId: { type: [string, 'null'], format: uuid }
        primaryContactId: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
        nextStep: { type: [string, 'null'], minLength: 1, maxLength: 200 }

    MoveDealFields:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Values for the target stage's `field` requirements, written in the
        move's transaction. Only fields the target stage requires; a value,
        never `null`.
      properties:
        amount: { $ref: '#/components/schemas/DealMoney' }
        expectedCloseDate: { type: string, format: date }
        nextStep: { type: string, minLength: 1, maxLength: 200 }
        primaryContactId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }

    MoveDealRequest:
      type: object
      additionalProperties: false
      required: [version, toStageId]
      description: Closed. The target stage, and the requirements filled with it.
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        toStageId: { type: string, format: uuid }
        fields: { $ref: '#/components/schemas/MoveDealFields' }
        checks:
          type: array
          uniqueItems: true
          maxItems: 20
          description: Ids of the target stage's `check` requirements ticked now.
          items: { type: string, format: uuid }

    SearchType:
      type: string
      enum: [contact, lead, account, deal]
      description: |
        A record type searchRecords answers (T-0085). Additive (D-L87):
        tickets, conversations and KB join when their modules publish reads.

    LookupRequest:
      type: object
      additionalProperties: false
      description: |
        lookupRecords' body (T-0085): exactly one of `phone` or `email`, plus
        optional `types`. Closed. Personal data: never logged or traced.
      oneOf:
        - { required: [phone] }
        - { required: [email] }
      properties:
        phone:
          type: string
          minLength: 6
          maxLength: 32
          pattern: '^[0-9+() .-]+$'
          description: |
            One whole phone number, matched exactly after normalising to
            E.164 with the tenant's default country. Never a prefix or a
            substring: a partial number is `400 invalid_phone`.
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: |
            One whole email address, trimmed, matched exactly and
            case-insensitively. Never a prefix or a substring.
        types:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: Which groups to answer, as searchRecords' `types`; absent means all four.
          items: { $ref: '#/components/schemas/SearchType' }

    SearchResults:
      type: object
      additionalProperties: false
      required: [groups]
      description: |
        One group per requested type, in the order contact, lead, account,
        deal, each type at most once. **No counts of any kind** (D-P13): no
        total, no per-type or per-programme count, no "more" flag.
      properties:
        groups:
          type: array
          minItems: 1
          maxItems: 4
          items:
            oneOf:
              - { $ref: '#/components/schemas/ContactSearchGroup' }
              - { $ref: '#/components/schemas/LeadSearchGroup' }
              - { $ref: '#/components/schemas/AccountSearchGroup' }
              - { $ref: '#/components/schemas/DealSearchGroup' }

    ContactSearchGroup:
      type: object
      additionalProperties: false
      required: [type, hits]
      properties:
        type: { type: string, const: contact }
        hits:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ContactSearchHit' }

    LeadSearchGroup:
      type: object
      additionalProperties: false
      required: [type, hits]
      properties:
        type: { type: string, const: lead }
        hits:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/LeadSearchHit' }

    AccountSearchGroup:
      type: object
      additionalProperties: false
      required: [type, hits]
      properties:
        type: { type: string, const: account }
        hits:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/AccountSearchHit' }

    DealSearchGroup:
      type: object
      additionalProperties: false
      required: [type, hits]
      properties:
        type: { type: string, const: deal }
        hits:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/DealSearchHit' }

    SearchNameWithheldField:
      type: string
      enum: [displayName, givenNames, familyName, companyName]
      description: |
        A contact or lead hit field that field security withheld in the
        hit's programme. `displayName` is listed whenever `givenNames` or
        `familyName` is (D-L68).

    ContactSearchHit:
      type: object
      additionalProperties: false
      required: [type, id, programmeId, withheldFields]
      description: |
        A contact as a search hit: an id and the name fields the caller may
        read in the contact's programme, nothing else. **Withheld fields are
        omitted, never nulled,** and named in `withheldFields`.
        **`displayName` follows its name parts (D-L68):** it is present only
        when both `givenNames` and `familyName` are readable, and is
        withheld, never composed, when either is not. `id` is a contact id
        (getContact). No phone, email, owner, status or tag.
      properties:
        type: { type: string, const: contact }
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        displayName: { type: string, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName: { type: [string, 'null'], maxLength: 200 }
        withheldFields:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Always present; empty when nothing was withheld.
          items: { $ref: '#/components/schemas/SearchNameWithheldField' }

    LeadSearchHit:
      type: object
      additionalProperties: false
      required: [type, id, programmeId, status, withheldFields]
      description: |
        A lead (a contact at a lead status, D-P17) as a search hit: the
        contact hit's fields plus its lead `status`, which is always
        readable here (the lead group is empty when it is not). `id` is a
        contact id. `displayName` follows its name parts exactly as on
        ContactSearchHit (D-L68).
      properties:
        type: { type: string, const: lead }
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        displayName: { type: string, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName: { type: [string, 'null'], maxLength: 200 }
        status: { type: string, enum: [new, contacted, qualified, unqualified] }
        withheldFields:
          type: array
          uniqueItems: true
          maxItems: 4
          description: Always present; empty when nothing was withheld.
          items: { $ref: '#/components/schemas/SearchNameWithheldField' }

    AccountSearchHit:
      type: object
      additionalProperties: false
      required: [type, id, programmeId, name]
      description: |
        An account as a search hit. `name` is never withheld (Account), so
        nothing here is. No owner, phone, tier or industry.
      properties:
        type: { type: string, const: account }
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }

    DealSearchHit:
      type: object
      additionalProperties: false
      required: [type, id, programmeId, pipelineId, name]
      description: |
        A deal as a search hit. `name` and `pipelineId` are never withheld
        (Deal), so nothing here is. No amount, stage, owner, contact or
        account: the deal detail reads those through its own field security.
      properties:
        type: { type: string, const: deal }
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        pipelineId: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 200
          x-kasuwa-classification: pii
          description: Free text that may name a person or a business (D-L91); never logged.

  responses:
    ValidationFailed:
      description: |
        The request did not parse: a bad query value, a malformed cursor, a
        non-uuid id, an unknown or server-owned body property, a filter on a
        withheld field, or a scope header (the auth guard rejects those
        outright). `details` names paths and reason codes, never the submitted
        value.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            badField:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phones.0.e164
                    code: invalid_string
            badCursor:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: cursor
                    code: invalid_cursor
            withheldFilter:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: lga
                    code: field_withheld
            badTimeZone:
              summary: listMyActivities, a timeZone that is not an IANA zone
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: timeZone
                    code: invalid_time_zone
            windowTooLong:
              summary: listCalendar, a window longer than 42 days
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: to
                    code: window_too_long
            meetingTooLong:
              summary: createActivity or updateActivity, a meeting longer than 24 hours
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: endsAt
                    code: too_long

    NotAuthenticated:
      description: |
        No usable session. It does not say whether the token was missing,
        expired, revoked or from another tenant.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 401
            error: Unauthorized
            code: not_authenticated
            message: Not authenticated

    NotFound:
      description: |
        **One body for all of:** no such contact, a contact in another tenant,
        a contact in a programme of this tenant the caller does not reach, and
        (on create) a target programme they do not reach. A `403` here would
        confirm the id names something real: an enumeration oracle against a
        BPO running two competitors' programmes on one workspace.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    NotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the record (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on contacts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: emails
                    code: field_not_editable

    StaleWrite:
      description: |
        `version` is not current: somebody saved since your last read. Nothing
        was applied. Re-read and re-apply; do not retry blind.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 409
            error: Conflict
            code: stale_write
            message: Someone else saved changes while you were editing. Reload and try again.

    AccountNotFound:
      description: |
        **One body for all of:** no such account, an account in another
        tenant, an account in a programme of this tenant the caller does not
        reach, and (on create) a target programme they do not reach. A `403`
        here would confirm the id names something real.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    AccountNotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the account (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on accounts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: tier
                    code: field_not_editable

    NotImplemented:
      description: |
        Specified, not built. One fixed body; the screen hides the feature
        rather than drawing an error.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 501
            error: Not Implemented
            code: not_implemented
            message: Not implemented

    PipelineRecordNotFound:
      description: |
        **One body for every pipeline and deal operation, whatever the
        reason:** no such pipeline or deal, one in another tenant, one in a
        programme of this tenant the caller does not reach, and an id that
        is not a uuid. A `403` or a `400` here would confirm the id names
        something real.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    DealValidationFailed:
      description: |
        The request did not parse or names something it may not. `details`
        names paths and reason codes, never the submitted value.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            withheldFilter:
              summary: A currency filter while amount is withheld
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: currency
                    code: field_withheld
            badCursor:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: cursor
                    code: invalid_cursor
            unknownStage:
              summary: moveDeal, a toStageId that is not a stage of the deal's pipeline
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: toStageId
                    code: unknown_reference
            notARequirement:
              summary: moveDeal, a field the target stage does not require
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: fields.nextStep
                    code: not_a_requirement
            unknownCurrency:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: amount.currency
                    code: unknown_currency
            unknownCurrencyFilter:
              summary: A currency filter naming a code that is not NGN, GHS, KES or ZAR
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: currency
                    code: unknown_currency
            closedSinceTooEarly:
              summary: A closedSince more than 366 days before the request, never clamped
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: closedSince
                    code: window_too_long
            closedSinceInFuture:
              summary: A closedSince after the request
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: closedSince
                    code: invalid_window

    DealNotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the deal (or reaches the pipeline) and may not do this to it, may not
        give it to someone else, or may not edit a field it names.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: Not the caller's deal, a closed deal without deal.write_any, or no deal.write
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit, sent or required by the target stage
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: amount
                    code: field_not_editable
            ownerNotSelf:
              summary: Another owner without deal.reassign
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: ownerUserId
                    code: owner_not_self

    DealMoveConflict:
      description: |
        `stale_write`: `version` is not current; nothing was applied. Re-read.
        `transition_not_allowed`: the pipeline's allow-list has no move from
        the deal's stage to `toStageId`; nothing was applied.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            stale:
              value:
                statusCode: 409
                error: Conflict
                code: stale_write
                message: Someone else saved changes while you were editing. Reload and try again.
            transition:
              value:
                statusCode: 409
                error: Conflict
                code: transition_not_allowed
                message: The deal cannot move to that stage from where it is.

    RequirementsUnmet:
      description: |
        The target stage has entry requirements the deal still does not meet
        after this request's `fields` and `checks`. Nothing was applied.
        `details` name requirement ids only (`requirements.<requirementId>`),
        never a value or a label.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 422
            error: Unprocessable Entity
            code: requirements_unmet
            message: Complete the stage requirements to move this deal.
            details:
              - path: requirements.4c5d6e7f-8a9b-4c0d-8e1f-2a3b4c5d6e03
                code: requirement_unmet
              - path: requirements.4c5d6e7f-8a9b-4c0d-8e1f-2a3b4c5d6e04
                code: requirement_unmet

    SearchValidationFailed:
      description: |
        searchRecords could not parse the request. Decided from the request
        alone, before any record is read: no `400` here depends on what
        exists. `details` names paths and reason codes, never the submitted
        value (which is a name). `identifier_in_url` at `q` is the R21 rule
        (D-L135): after NFKC, an `@`, or 6 or more decimal digits of any
        script once everything that is neither a letter nor a digit is
        removed.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            queryRequired:
              summary: No q
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: q
                    code: query_required
            identifierInUrl:
              summary: A phone or email query parameter; exact lookups are lookupRecords
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phone
                    code: identifier_in_url
            identifierInQ:
              summary: A q that looks like a phone number or an email address (an @, or 6+ digits of any script once non-letters go); send it to lookupRecords
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: q
                    code: identifier_in_url
            queryTooShort:
              summary: q under 2 characters once folded and trimmed
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: q
                    code: query_too_short
            controlCharacter:
              summary: A NUL or other control character in q
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: q
                    code: invalid_string
            unknownType:
              summary: A types value that is not contact, lead, account or deal
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: types
                    code: unknown_type

    LookupValidationFailed:
      description: |
        lookupRecords could not parse the body. Decided from the request and
        the caller's own tenant settings, never from any record: no `400`
        here depends on what exists. `details` names fixed paths and reason
        codes, never the submitted value (which is a phone number or an
        email address) and never a key the client chose.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            unknownProperty:
              summary: A property the closed body does not have, at the fixed path body; the key is never echoed
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: body
                    code: unknown_property
            oneTermRequired:
              summary: Neither phone nor email, or both
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phone
                    code: one_term_required
            invalidPhone:
              summary: A phone that is not one whole number, a partial number included
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phone
                    code: invalid_phone
            invalidEmail:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: email
                    code: invalid_email
            unknownType:
              summary: A types value that is not contact, lead, account or deal
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: types
                    code: unknown_type

    SearchTooManyRequests:
      description: |
        searchRecords or lookupRecords was called too often by this user (T-0086,
        D-L134). A resource and harvesting control, not a permission decision:
        it says nothing about any record. The limit is **per user**, never per
        address, so colleagues behind one office address do not share it. Each
        operation has its **own budget**: exhausting one leaves the other open,
        and the lookup's budget is **tighter**, because a lookup tests one whole
        phone number or address at a time. It is decided after authentication
        and the scope-header check and before any validation of the request.
        Same shape as the sign-in throttle (`TooManyAttempts`,
        auth.openapi.yaml): the shared Error envelope with
        `code: too_many_requests` and, optionally, `retryAt`, the earliest time
        a retry can succeed. **The body never echoes the query**: no `q`, no
        phone number, no address. The numbers are the server's and may change.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            tooManyRequests:
              summary: Too many searches or lookups by this user in the current window
              value:
                statusCode: 429
                error: Too Many Requests
                code: too_many_requests
                message: Too many searches. Wait a moment and try again.
                retryAt: '2026-10-14T10:01:00.000Z'

security:
  - sessionToken: []
