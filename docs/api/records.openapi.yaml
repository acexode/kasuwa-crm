  /api/v1/deals/{dealId}/move:
    parameters:
      - $ref: '#/components/parameters/DealId'
    post:
      tags: [deals]
      summary: Move a deal to another stage, filling its requirements in the same write
      operationId: moveDeal
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-permission: deal.write
      x-kasuwa-screens: ['P06/01', 'P06/01b', 'P06/02', 'P06/03', 'P06/04', 'P06/05', 'P06/06']
      x-kasuwa-error-order: ['404 not_found', '403 not_permitted', '400 validation_failed', '403 not_permitted field_not_editable', '409 stale_write', '409 transition_not_allowed', '422 requirements_unmet']
      x-kasuwa-rights:
        admin: any
        programme_manager: any
        team_lead: any
        agent: own
        qa_analyst: none
        client_portal: none
      description: |
        **The only way `stageId` changes** (D-L88): a drag on the board, the
        list view's stage pill, the move sheet, Mark as lost and the deal
        detail's stage path all send this. Lost is reached from any open
        stage through it.

        **Rights (D-L88).** `deal.write` in the deal's programme. **Agents
        move their own deals**; `team_lead`, `programme_manager` and `admin`
        move any deal in it (`deal.write_any`). **Leaving won or lost needs
        `deal.write_any`.** Anything else is `403 not_permitted`, decided
        before the body is read. **When field security withholds
        `ownerUserId` from the caller, `own` acts as `none`** (D-L115): a
        caller without `deal.write_any` gets the same `403 not_permitted`
        for every deal, theirs or not, so the answer never tells who owns
        a deal. Sending in `fields` a field the mover may
        not edit is `403` with `details[].code: field_not_editable`, judged
        on the keys.

        **The transition.** `toStageId` must be a stage of the deal's
        pipeline, otherwise `400 validation_failed` with
        `details[].code: unknown_reference` at `toStageId`, one body
        whatever the reason. A pair not on the pipeline's allow-list,
        including a move to the deal's current stage, is
        `409 transition_not_allowed`.

        **Requirements (D-P20)** are the target stage's. `fields` and
        `checks` may name only the target stage's own `field` and `check`
        requirements; anything else is `400` with
        `details[].code: not_a_requirement`. They are written in the
        move's own transaction: the fields' values, each check (who: the
        caller; when: the server's time) and the stage change commit
        together or not at all, so a refused move writes nothing. A check
        recorded on the deal stays recorded and satisfies its requirement
        on a later move. A `field` requirement is met when, after `fields`
        is applied, the deal field holds a value.

        **A required field the mover may not edit is `403
        field_not_editable`** (D-L88), decided after the body: a required
        field the mover may not READ refuses the move whatever its value,
        so the answer never tells whether a withheld field is empty; one
        the mover reads but may not edit refuses the move only when it is
        unmet. Every other unmet requirement is
        `422 requirements_unmet`, whose `details` name requirement ids only
        (`path: requirements.<requirementId>`, `code: requirement_unmet`):
        never a field value, a label or a field the caller may not read.

        **Order:** `404`, `403` (the action, and `field_not_editable` on the
        keys sent), `400` (the body, including an unknown stage), `403
        field_not_editable` (a required field), `409 stale_write`, `409
        transition_not_allowed`, then `422 requirements_unmet`.

        **Effects.** `stageEnteredAt` becomes the server's time. Entering
        won or lost sets `closedAt` to it; leaving them clears it.
        `version` advances. One audit event (`objectType: deal`) names the
        fields filled and `checks`, never their values, and records the from
        and to stage ids, which are configuration ids (D-L88). The answer is
        the deal through Deal field security.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveDealRequest' }
            examples:
              toNegotiation:
                summary: Proposal to Negotiation, filling the close date and ticking the quote
                value:
                  version: 4
