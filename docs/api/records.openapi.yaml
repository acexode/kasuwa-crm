  # -------------------------------------------------------------------------
  # Activities (T-0061; D-P18, D-L77, D-L79, D-L81). A note, a task or a
  # logged call against a contact, an account or both, in the target's
  # programme. Read on the contact's timeline (listContactTimeline) and the
  # account's (listAccountTimeline, T-0080); each activity item carries the
  # `version` updateActivity needs (D-L85). There is no activity list or get
  # yet. The five rules at the top of this file apply unchanged.
  # -------------------------------------------------------------------------

  /api/v1/activities:
    post:
      tags: [activities]
      summary: Log an activity — a note, a task, a call or a meeting
      operationId: createActivity
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P05/01', 'P07/07']
      description: |
        **Target and programme.** At least one of `contactId` and `accountId`.
        There is no `programmeId`: the activity's programme is its target's
        (the contact's when both are given). An unreachable target (no such
        record, another tenant's, a programme the caller does not reach) is
        `404 not_found`, one body. A second target outside the first one's
        programme is `400 validation_failed` with `details[].code:
        unknown_reference` at its path, one body whether it names a record
        elsewhere or nothing, even for a caller who can read both programmes.

        **Ids (D-L79).** The server mints the activity's id; a client `id` is
        `400`, one body whether or not it names a real activity. The activity
        is logged by the session's user, never by a value in the body.

        **Owner (D-L67, D-L79).** `ownerUserId`, if set, must be a member of
        the activity's programme, else `400 unknown_reference` at
        `ownerUserId`, one body for a member of another programme, a user of
        another tenant, a user in no programme and an invented id. Omitted, the
        activity has no owner.

        **Permission (D-P18).** `activity.write` in the activity's programme,
        held by the `agent`, `team_lead`, `programme_manager` and `admin` sets
        and by the tenant-admin flag, never beyond the session's programmes.
        `qa_analyst` and `client_portal` get `403 not_permitted`. Setting
        `ownerUserId` to anyone but the caller also needs `activity.reassign`
        (`team_lead`, `programme_manager`, `admin`, the tenant-admin flag;
        D-L81). Writing a field withheld from, or read-only for, the caller is
        `403 not_permitted` with `details[].code: field_not_editable`. Order:
        `404`, `403`, `400` (D-L53).

        **Validation.** `dueAt` on a note, a call or a meeting is `400`
        (`task_only`). A NUL character in `subject` or `body` is `400`
        (`invalid_character`).

        **Meetings (T-0081, D-L87; served since T-0082).** A
        `meeting` requires `startsAt` and `endsAt`, both UTC with a `Z`
        (`400 required` at the missing one). `endsAt` must be after
        `startsAt` (`400 invalid_range` at `endsAt`; equal is not after) and
        at most 24 hours after it (`400 too_long` at `endsAt`). `startsAt`
        or `endsAt` on a note, a task or a call is `400 meeting_only`. A
        meeting has no `dueAt` and is never completed. Meetings follow
        D-P18's activity rights unchanged: whoever may log a task may log a
        meeting (D-L87); there is no new permission. The P07
        composer sets `ownerUserId` to the caller, so the meeting is on the
        caller's calendar (listCalendar lists what the caller OWNS).

        **Not in this contract (D-P22, D-P29):** attendees or invitations,
        a location, reminders by SMS, WhatsApp, email or push, and anything
        pushed to an external calendar. A create never sends a message.

        **Response.** The created activity through field security, as a
        read: a field the caller may write but not read is omitted and listed
        in `withheldFields`.

        Every create writes one audit event, `objectType: activity`, labelled
        with the activity id, the session user as actor; its changes name the
        fields set and never their values, so no subject or body text is ever
        in the log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
            examples:
              task:
                summary: A task on a contact
                value:
                  type: task
                  subject: Call back about the payment plan
                  dueAt: '2026-10-02T15:00:00.000Z'
                  contactId: 3f0c9a52-6d1e-4b8a-9f2e-1a2b3c4d5e01
              meeting:
                summary: A meeting on an account, owned by the caller (P07/07)
                value:
                  type: meeting
                  subject: QBR with Ọja Foods
                  startsAt: '2026-09-30T14:30:00.000Z'
                  endsAt: '2026-09-30T15:30:00.000Z'
                  ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                  accountId: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c01
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    patch:
      tags: [activities]
      summary: Complete, reassign, snooze or reschedule an activity
      operationId: updateActivity
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P05/01', 'P07/01', 'P07/03', 'P07/04', 'P07/05']
      description: |
        `version` (required) plus ONLY the fields the person changed (D-L102):
        `completed: true` and/or `ownerUserId` (D-L81), and from T-0081
        `dueAt` (a task: snooze or move it; `null` clears it) and `startsAt`
        and/or `endsAt` (a meeting: drag to reschedule, or resize). A field
        the person did not change is never sent, after any number of `409`s:
        resending an untouched field's old value with a fresh `version`
        silently undoes someone else's save.

        Completing sets `completedAt` to the server's time and keeps
        it if the task was already complete; only a task can be completed
        (`400 task_only` for a note, a call or a meeting). The `version` to
        send is the one on the activity's timeline item (listContactTimeline
        or listAccountTimeline, T-0080), on its listMyActivities or
        listCalendar item, or on the Activity this caller last wrote. The
        activity cannot be retargeted or moved between programmes:
        `contactId`, `accountId`, `programmeId` and every server-owned field
        are `400` (the body is closed). A stale `version` is
        `409 stale_write`.

        **No reopening (D-L81, D-L87).** `completed` admits only `true`, the
        body has no `completedAt`, and no operation in this contract clears
        `completedAt`: a completed task stays completed. Moving a completed
        task's `dueAt` changes its time and nothing else. P07/01's "Undo"
        after completing is not offered.

        **Snooze and reschedule (T-0081; served since T-0082).**
        `dueAt` on a note, a call or a meeting is `400 task_only`. `startsAt`
        or `endsAt` on anything but a meeting is `400 meeting_only`; neither
        is nullable, because a meeting always has both. The meeting rules of
        createActivity are judged on the RESULT, the stored times with the
        sent ones applied: `endsAt` after `startsAt` (`400 invalid_range`)
        and at most 24 hours after it (`400 too_long`), both at the field
        sent. All times are UTC with a `Z`. Rescheduling sends nothing to anyone: no
        reminder, no invitation and no external calendar (D-P22, D-P29).

        **Permission.** `activity.write` in the activity's programme, as for
        createActivity. Snoozing and rescheduling need no other right:
        whoever may update the activity may move it (D-L87, D-P18).
        Reassigning follows D-P14 (D-L81): the `agent` set may
        set the owner to itself only; `team_lead`, `programme_manager`,
        `admin` and the tenant-admin flag may assign any member of the
        activity's programme, or clear the owner. The owner must be a member
        of the activity's programme, as on create. Field security applies to
        `completedAt`, `ownerUserId`, `dueAt`, `startsAt` and `endsAt`:
        sending one that is withheld from, or read-only for, the caller is
        `403 not_permitted` with `details[].code: field_not_editable`. So is
        sending `startsAt` or `endsAt` when the caller cannot read the
        meeting's OTHER time in its programme (D-L110): the result rules
        would otherwise disclose it.

        Out of scope (another programme, another tenant, no such activity) is
        `404 not_found`, one body. Order: `404`, `403`, `400`, `409`. Every
        update writes one audit event naming the fields that changed, never
        their values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityRequest' }
            examples:
              complete:
                summary: Complete a task
                value:
                  version: 1
                  completed: true
              snooze:
                summary: Snooze a task to tomorrow morning, 09:00 WAT (P07/01)
                value:
                  version: 2
                  dueAt: '2026-10-01T08:00:00.000Z'
              reschedule:
                summary: Drag a meeting to a new slot (P07/03)
                value:
                  version: 3
                  startsAt: '2026-10-02T09:00:00.000Z'
                  endsAt: '2026-10-02T10:00:00.000Z'
      responses:
        '200':
          description: The updated activity, field security applied. `version` has advanced.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleWrite' }

  # -------------------------------------------------------------------------
  # The caller's own tasks and calendar (P07; specified by T-0081, served
  # since T-0082; D-L87, D-P18, D-P22). Both lists read the caller's OWN activities
  # (`ownerUserId` is the session's user) in the programmes the session
  # resolves; neither takes an owner, a user or a programme. The five rules at
  # the top of this file apply unchanged, and both cursors carry an id only
  # (D-L80). Writes are updateActivity's (complete, snooze, reschedule,
  # reassign), one activity and one `version` at a time.
  #
  # Deliberately absent: reopening a task (D-L81; P07/01's "Undo" is hidden,
  # D-L87); Google, Microsoft or any other external calendar, sync and booking
  # pages (D-P22: a new adapter, OAuth token storage, and a public write that
  # needs a third SECURITY DEFINER function and an ADR); public holidays
  # (D-P22: nobody owns the calendar yet); reminders by SMS, WhatsApp, email
  # or push (D-P29: in-app only, later); offline queues (D-P21); field
  # check-in (P07/09); the AI meeting brief (M17); task priority; attendees;
  # bulk operations; and every count (D-P13). The screen hides each.
  # -------------------------------------------------------------------------

  /api/v1/me/activities:
    get:
      tags: [activities, me]
      summary: The caller's own open tasks in one bucket — overdue, today or upcoming
      operationId: listMyActivities
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P07/01', 'P07/02']
      description: |
        P07/01's My tasks: the caller's own open tasks, one bucket per call.
        The screen asks for `overdue`, `today` and `upcoming` and draws one
        group for each.

        **Whose.** Tasks whose `ownerUserId` is the session's user, in the
        programmes the session resolves, and nothing else. Nothing in the
        request chooses whose tasks are listed: there is no owner, user or
        programme parameter (rule 1). A task the caller still owns in a
        programme they no longer reach is not listed. An activity with no
        owner is on nobody's list. Notes, calls and meetings are never listed
        here (meetings are on listCalendar). A completed task is not listed:
        completing one removes it from every bucket, and no operation reopens
        it (D-L81).

        **Buckets, computed by the server in the caller's zone.** `timeZone`
        (required) is the caller's IANA time zone, for example `Africa/Lagos`.
        At the moment of the request the server computes:
        - `overdue`: `dueAt` before now;
        - `today`: `dueAt` from now until the next midnight in `timeZone`;
        - `upcoming`: `dueAt` at or after that midnight, and then every open
          task with no `dueAt`, last.

        The three buckets are disjoint: every listed task is in exactly one.
        Midnight follows the zone's own rules, so "today" is not always 24
        hours long. `timeZone` decides only where today ends; every time on
        the wire is still UTC with a `Z`.

        **Validation: 400, never a fallback.** A `timeZone` that is not a zone
        name in the server's IANA time-zone database is `400
        validation_failed` with `details[].code: invalid_time_zone` at
        `timeZone`. That covers an abbreviation (`WAT`), an offset (`+01:00`,
        `UTC+1`), a path (`../`), an unknown name and an empty value alike. The
        server never substitutes UTC, the tenant's zone or any default. A
        missing `timeZone` or `bucket` is `400`.

        **Order and paging.** `dueAt` ascending, ties broken by `id`
        ascending. In `upcoming` the undated tasks come after every dated one,
        by `id`. Keyset only: `{ data, nextCursor }`, with no total, count or
        offset (D-P13) and no count per bucket, so the group headers carry no
        number. The cursor carries an id only (D-L80; see ActivityCursor).
        `limit` out of 1..100 is `400`, never clamped.

        **Field security, before paging.** Each item follows the activity
        object's field security in the activity's own programme, as on the
        timeline. A withheld `subject`, `completedAt`, `startsAt` or `endsAt`
        is omitted and named in `withheldFields`, and the `contact` or
        `account` summary is withheld with the activity's contact or account
        link. A task whose `dueAt` is withheld from the caller is not listed at
        all, because its bucket and its position would disclose the value.
        Omission happens before the page is cut, so a page with a non-null
        `nextCursor` holds `limit` items.

        **Every reader may call it.** No permission set is refused: the list
        is the caller's own, and reads never answer `403`. It takes no record
        id, so there is no `404`. `Cache-Control: no-store` on every answer.
      parameters:
        - $ref: '#/components/parameters/TimeZone'
        - $ref: '#/components/parameters/ActivityBucket'
        - $ref: '#/components/parameters/ActivityCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the bucket, oldest due first, field security applied.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyActivityPage' }
              example:
                data:
                  - id: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c04
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    type: task
                    subject: WhatsApp Emeka about holding the price
                    dueAt: '2026-09-30T11:00:00.000Z'
                    completedAt: null
                    startsAt: null
                    endsAt: null
                    contact:
                      id: 3f0c9a52-6d1e-4b8a-9f2e-1a2b3c4d5e01
                      displayName: Emeka Obi
                    account: null
                    version: 1
                    withheldFields: []
                  - id: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c06
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a02
                    type: task
                    dueAt: '2026-09-30T15:00:00.000Z'
                    completedAt: null
                    startsAt: null
                    endsAt: null
                    contact: null
                    account:
                      id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c02
                      name: Kwara Microfinance Bank
                    version: 3
                    withheldFields: [subject]
                nextCursor: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /api/v1/me/calendar:
    get:
      tags: [activities, me]
      summary: The caller's own Kasuwa events in a window of at most 42 days
      operationId: listCalendar
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P07/03', 'P07/04', 'P07/05', 'P07/06']
      description: |
        The P07 calendar (week, day, month and the mobile agenda): the
        caller's own Kasuwa events between `from` and `to`.

        **Kasuwa events only (D-P22).** No Google, Microsoft or other external
        calendar is read, synced or written, and there is no booking page and
        no public-holiday calendar. Every caller sees what P07/06 draws for an
        unconnected calendar: Kasuwa's own events. Connecting a calendar needs
        a new integration adapter and storage for OAuth tokens, and is a later
        decision.

        **Whose.** As listMyActivities: activities whose `ownerUserId` is the
        session's user, in the programmes the session resolves. There is no
        owner, user or programme parameter. An activity with no owner is on
        nobody's calendar.

        **What is listed.**
        - A task with a `dueAt` in the window (`from` <= `dueAt` < `to`),
          open or completed (`completedAt` says which: completion neither
          removes nor moves it).
        - A meeting that overlaps the window: `startsAt` before `to` and
          `endsAt` after `from`. A meeting that began before `from` is listed.
        - Nothing else. Notes, calls and tasks with no `dueAt` have no time
          and are never listed.

        **The window, in UTC.** `from` and `to` are required UTC date-times
        with a `Z`; the screen converts the days it shows into UTC in the
        browser's zone, and the server assumes no zone. `to` must be after
        `from` (`400 validation_failed`, `details[].code: invalid_window` at
        `to`; equal is not after). The window is at most 42 days (six weeks, a
        month grid): `to` more than 42 days after `from` is `400` with
        `details[].code: window_too_long` at `to`, never clamped. A value with
        an offset instead of a `Z`, a date without a time, year 0 or an
        impossible date is `400` at its path, never `500`.

        **Order and paging.** By the event's start, ascending (`dueAt` for a
        task, `startsAt` for a meeting), ties broken by `id` ascending. Keyset
        only: `{ data, nextCursor }`, with no total, count or offset (D-P13),
        and no per-day count. The cursor carries an id only (D-L80; see
        ActivityCursor). `limit` out of 1..100 is `400`, never clamped.

        **Field security, before paging.** As listMyActivities: each item
        follows the activity's field security in its own programme. A task
        whose `dueAt` is withheld, and a meeting whose `startsAt` or `endsAt`
        is withheld, is not listed at all, because its place on the calendar
        would disclose the value. Omission happens before the page is cut.

        Every reader may call it; reads never answer `403`, and it takes no
        record id, so there is no `404`. `Cache-Control: no-store` on every
        answer.
      parameters:
        - $ref: '#/components/parameters/WindowFrom'
        - $ref: '#/components/parameters/WindowTo'
        - $ref: '#/components/parameters/ActivityCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the caller's events in the window, earliest start first.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyActivityPage' }
              example:
                data:
                  - id: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c05
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    type: task
                    subject: Prep the QBR deck
                    dueAt: '2026-09-30T14:00:00.000Z'
                    completedAt: null
                    startsAt: null
                    endsAt: null
                    contact: null
                    account:
                      id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c01
                      name: Ọja Foods Ltd
                    version: 3
                    withheldFields: []
                  - id: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c08
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    type: meeting
                    subject: QBR with Ọja Foods
                    dueAt: null
                    completedAt: null
                    startsAt: '2026-09-30T14:30:00.000Z'
                    endsAt: '2026-09-30T15:30:00.000Z'
                    contact: null
                    account:
                      id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c01
                      name: Ọja Foods Ltd
                    version: 1
                    withheldFields: []
                nextCursor: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  # -------------------------------------------------------------------------
  # Leads (T-0056, D-P17, D-L75). Served since T-0076 (D-L82). A lead is a
  # contact at a lead stage, not its own record: there is no Lead schema and
  # nothing addresses a lead by id. The five rules at the top of this file
  # apply unchanged.
  #
  # Deliberately absent (D-L69, D-P12): merge (dedupe is D-P12), lead score
  # (M17) and a Leads Map view (M03 P2). The task allowed a 501 stub or
  # absence; absence was chosen so this file does not invent paths those
  # modules own. The screen hides each.
  # -------------------------------------------------------------------------

  /api/v1/contacts/{contactId}/convert:
    parameters:
      - $ref: '#/components/parameters/ContactId'
    post:
      tags: [leads]
      summary: Convert a lead — qualify it and link an account, once
      operationId: convertContact
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/01', 'P05/01']
      description: |
        Converts a lead (D-P17): qualifies the contact and links it to an
        account, either an existing one (`accountId`) or one it creates
        (`newAccount`). The P04/01 Leads table's row action and, once drawn,
        the P05/01 record header's.

        **One transaction.** The status change, the account it creates (if
        any), the link and the audit events are written in one database
        transaction: all of it or none of it. It writes one audit event on
        the contact and, when it creates an account, one more on the account
        (names only). The contact event (`objectType: contact`, `updated`)
        names only the fields whose values changed (`status`, `accountId`; a
        `customer` keeps its status, so only `accountId`), never their
        values, and carries neither the account's id nor its name (D-L82).
        The account event (T-0104) is the one createAccount writes:
        `created`, `objectType: account`, labelled with the account's id, in
        the contact's programme, field names only and never a value (D-L78),
        so the account's name appears in neither event. Linking an existing
        account writes no account event. A repeat or a refusal writes no
        event of either kind.

        **What it does to the contact.** A contact whose `status` is `new`,
        `contacted`, `unqualified` or `null` becomes `qualified`. A
        `qualified` contact stays `qualified`. A `customer` is never demoted:
        its status stays `customer`, and the account link follows the same
        rules as for a lead. A converted contact stays on the Leads list
        (listLeads), because `qualified` is a lead status (D-P17, D-L75).
        `companyName` is neither copied nor cleared.

        **Idempotent.** A repeat or retry of a convert whose result is
        already in place answers the same `200` with the current contact and
        account, whatever `version` it carries, and writes nothing: no second
        account, no further audit event, and `version` does not advance. The
        result is in place when the contact is `qualified` or `customer` and
        its `accountId` is the requested `accountId`, or, for `newAccount`,
        when its account's `name` equals the requested `name` exactly. This
        is how a retry after a lost response meets the version check: it
        carries the version the first call made stale, and it is answered
        `200`, not `409`. Any other request on a stale `version` is
        `409 stale_write`: re-read, do not retry blind. A `version` above
        2147483647 (the column is a 32-bit integer) is
        `400 validation_failed`, never `409`.

        **A contact already linked to a different account.** When the
        contact already has an account and the request names another (a
        different `accountId`, or a `newAccount` whose name differs from its
        account's), the answer is `400 validation_failed` with
        `details[].code: already_linked` at `accountId` or `newAccount`, and
        nothing is written. Convert never moves a contact between accounts;
        that is an `accountId` edit on updateContact.

        **Scope: the contact's programme.** The contact must be readable by
        the caller, else `404 not_found`, never `403`. An existing account
        must be in the contact's programme, and a new one is created in it.
        An account in another programme is answered `404 not_found`, the
        same body as an account that does not exist or one in another
        tenant, even when the caller reaches that other programme too: a
        caller in A1 and A2 cannot link an A1 lead to an A2 account. This
        differs in form from createContact and updateContact, which answer an
        unreachable `accountId` with `400 unknown_reference`; both forms hide
        existence (D-L75).

        **Permission.** Convert needs `contact.write` in the contact's
        programme (the `admin` set or the tenant-admin flag, D-L63). The
        narrow contact edit the `agent` set holds (D-P14, D-P18) does not
        include it, because convert sets `accountId`. Creating an account
        (`newAccount`) also needs `account.write` in that programme, which is
        admin-only (D-P18). Field security applies to both contact fields
        convert writes: the caller must be able to read and edit `status`
        and `accountId`, otherwise `403 not_permitted` with
        `details[].code: field_not_editable` naming the field. A caller who
        may not read `accountId` would otherwise learn the existing link from
        the `account` in a repeat's answer. The tenant-admin flag never lifts
        field security. A caller without `contact.write` is `403` before the
        body is read, so no account check ever tells it what exists.

        **Order:** `404` for the contact, `403` (including
        `field_not_editable`), `400` for the body, `404` for the account, the
        repeat rule, `409 stale_write`, then `400 already_linked`.

        **Response.** `{ contact, account }`: the contact as getContact
        returns it and the account as getAccount returns it, each through its
        own field security. The contact's `owner` follows `Contact.owner`:
        an owner who has left the contact's programme is
        `{ id, displayName: null }` (D-P23).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertContactRequest' }
            examples:
              existingAccount:
                summary: Link an existing account
                value:
                  version: 4
                  accountId: 5a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c01
              newAccount:
                summary: Create an account and link it
                value:
                  version: 4
                  newAccount:
                    name: Kano Grains Co.
      responses:
        '200':
          description: |
            Converted, or an exact repeat of a convert already in place. The
            contact and its account, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConvertContactResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StaleWrite' }

  /api/v1/leads:
    get:
      tags: [leads]
      summary: List leads — contacts at a lead stage
      operationId: listLeads
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/01', 'P04/04', 'P04/05', 'P04/06']
      description: |
        The P04/01 Leads table and the P04/04 Kanban's columns. A lead is a
        contact at a lead stage (D-P17), not its own record, so this is a
        VIEW of contacts: the same `ContactPage` as listContacts, the same
        Contact rows under the same field security, the same keyset paging,
        and no total (D-P13). There is no lead id: a row's `id` is a contact
        id, read with getContact and changed with updateContact or
        convertContact. A row's `owner` follows `Contact.owner`, so an
        owner who has left the contact's programme is
        `{ id, displayName: null }` here too (D-P23).

        **What a lead is.** A contact whose `status` is `new`, `contacted`,
        `qualified` or `unqualified`. A `customer` is not a lead, and neither
        is a contact whose `status` is `null` (never set). A converted
        contact is `qualified` (or stays `customer`), so a converted lead
        stays on this list until its status moves to `customer` (D-L75).

        Rows come only from the programmes the session reaches, exactly as
        for listContacts. No parameter widens or narrows that set. Unknown
        query parameters are ignored, never honoured.

        **Why a separate operation, not a filter on listContacts (D-L75).**
        The live listContacts ignores unknown query parameters, so a lead
        filter added there would be silently dropped by an older server and
        the screen would list customers as leads. A server without this
        operation answers `404` here: never wrong rows.

        **No account filter.** Neither listLeads nor listContacts filters on
        the linked account. `account` and `accountId` are unknown parameters
        and ignored like any other, so the answer never depends on which
        account they name (a filter on a withheld `accountId` would otherwise
        be an oracle on the link).

        **Field security and the query.** `q` matches only fields the caller
        may read. A filter on a field withheld from the caller in ANY
        programme they reach is `400 validation_failed` with
        `details[].code: field_withheld`, as on listContacts. Sorting is
        limited to the `sort` enum, whose keys are fields field security
        never withholds.

        **When `status` is withheld.** This view IS a filter on `status`: a
        row's presence says the contact is a lead and not a customer. So if
        field security withholds `status` from the caller in any programme
        they reach, the answer is `400 validation_failed` with
        `details[].code: field_withheld` at `details[].path: status`, with
        or without a `status` parameter. Rows are never returned then.

        A malformed cursor, or one issued for a different `sort`, is
        `validation_failed` with `details[].code: invalid_cursor`.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Search, as listContacts' `q`: names (case- and
            diacritic-insensitive) and numbers (normalised to E.164), and also
            `companyName` (case- and diacritic-insensitive). Each field is
            matched only in the programmes where the caller may read it, row
            by row: a hit on a withheld company or number would disclose its
            value one query at a time. A NUL character is
            `400 validation_failed`.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Name, number or company. A phone is matched in E.164.
        - name: owner
          in: query
          required: false
          description: |
            Owner filter, any of, as on listContacts: a user id, `me` or
            `unassigned`. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              pattern: '^(me|unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: status
          in: query
          required: false
          description: |
            Narrows the view to some lead statuses, any of (one Kanban column
            is one value). Only lead statuses: `customer` is
            `400 validation_failed`, because this list never widens beyond
            leads. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 4
            items:
              type: string
              enum: [new, contacted, qualified, unqualified]
        - name: source
          in: query
          required: false
          description: Any of, as on listContacts. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { $ref: '#/components/schemas/ContactSource' }
        - name: sort
          in: query
          required: false
          description: |
            As listContacts' `sort`: a fixed set of never-withheld keys, a
            leading `-` descending, ties broken on `id`. Never `companyName`,
            which field security can withhold.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'displayName', '-displayName']
            default: '-createdAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of leads, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  /api/v1/me/programmes:
    get:
      tags: [me]
      summary: The caller's programmes, with their display names
      operationId: listMyProgrammes
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/02']
      description: |
        The programmes the caller belongs to, so a records screen can print
        "Bank X Collections" where the contract otherwise gives a
        `programmeId` (D-L64).

        **Scope is the session's.** Exactly the caller's own `user_programme`
        rows, read inside the tenant transaction on every request. There is no
        parameter, header or body that chooses whose programmes are listed;
        unknown query parameters are ignored, never honoured, and a scope
        header is `400 validation_failed`. The tenant-admin flag does not widen
        it (D-L53): an admin sees the programmes they belong to, not every
        programme in the tenant. A user with no membership gets `{ data: [] }`.

        **Closed items: `{ id, name }` and nothing else.** No `clientName`
        (the BPO's customer is a separate, confidential fact), no status, no
        member count.

        **Never cached by a shared cache.** The URL is the same for every user
        of every tenant, so the response carries `Cache-Control: no-store`.

        Order is by name, then id. Not paged: the list is the caller's own
        memberships.
      responses:
        '200':
          description: The caller's programmes.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, enum: ['no-store'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProgrammeList' }
              example:
                data:
                  - id: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    name: Bank X Collections
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

  # Deliberately absent: the P04/04 Map view (M03 P2), saved views, bulk
  # actions, export, merge and per-chip counts. No PRD module in this slice owns
  # them; see the T-0039 report. A map operation, when one is added, starts as
  # `x-kasuwa-implemented: false` with a 501.

  # -------------------------------------------------------------------------
  # Accounts (T-0052, D-L69). Served since T-0055, except getAccountMap,
  # which answers 501 by design. The five rules at the top
  # of this file apply unchanged. Account writes are admin-only until D-P18
  # answers (D-L69), exactly as contact writes were in T-0041 (D-L63).
  #
  # Deliberately absent (D-L69): account Health and any score (M17), a rollup
  # of deals or pipeline value (no owning module), counts of related records
  # or children (D-P13), "Show US$" (FX, M05), and DND on account phones (no
  # decision yet says where that flag lives for an account). Leads are not
  # here (D-P17).
  # -------------------------------------------------------------------------

  /api/v1/accounts:
    get:
      tags: [accounts]
      summary: List accounts — search, filter, sort, keyset page
      operationId: listAccounts
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/03', 'P04/05', 'P04/06']
      description: |
        The P04 Accounts list (frame 03: table, card list, split view). Rows
        come only from the programmes the session reaches. There is no
        parameter that narrows or widens that set; in particular there is no
        `programme` filter, because a client-supplied programme list is what
        CLAUDE.md 2.2 calls a bug. A screen that wants one programme's
        accounts filters client-side on `programmeId`.

        Unknown query parameters are ignored, never honoured. A scope header
        is `400 validation_failed` (D-L63).

        **Field security and the query.** `q` matches `name` only, which is
        never withheld. A filter on a field withheld from the caller in ANY
        programme they reach is `400 validation_failed` with
        `details[].code: field_withheld`, naming the parameter in
        `details[].path`. Field names are part of the schema, not data, so
        this discloses nothing; ignoring the filter instead would return rows
        that look filtered and are not. Sorting is limited to the `sort` enum,
        whose keys are fields field security never withholds.

        **No totals** (D-P13). P04's "1–25 of 1,234" and live chip counts are
        not served.

        A malformed cursor, or one issued for a different `sort`, is
        `validation_failed` with `details[].code: invalid_cursor`.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Search by account name: a case- and diacritic-insensitive
            substring match on `name` (`Oja` finds `Ọjà Foods Ltd`). Accounts
            are not searched by phone in this slice.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Part of the account name.
        - name: owner
          in: query
          required: false
          description: |
            Owner filter, any of. Each value is a user id, `me` (the caller),
            or `unassigned` (no owner). Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              pattern: '^(me|unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: tier
          in: query
          required: false
          description: Any of. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { $ref: '#/components/schemas/AccountTier' }
        - name: industry
          in: query
          required: false
          description: |
            Any of. Matched against the stored value exactly,
            case-insensitively. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: tag
          in: query
          required: false
          description: Accounts carrying any of these tags. Exact match, case-insensitive.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: state
          in: query
          required: false
          description: |
            State (first-level subdivision), any of. Matched as on
            listContacts: the stored value exactly, case-insensitively.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: lga
          in: query
          required: false
          description: Local government area, any of. Same matching as `state`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 40
            items: { type: string, minLength: 1, maxLength: 64 }
        - name: sort
          in: query
          required: false
          description: |
            One of a fixed set; a leading `-` is descending. **Deliberately not
            a free column name**, and every key is a field field security
            never withholds: ordering by `tier`, `industry` or the owner would
            leak a withheld value one comparison at a time. Ties break on `id`,
            so the keyset is total.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'name', '-name']
            default: 'name'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
              example:
                data:
                  - id: 5a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c01
                    programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                    version: 2
                    name: Ọjà Foods Ltd
                    ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                    owner:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    industry: FMCG
                    tier: mid_market
                    tags: [Distributor]
                    phones: [{ type: work, e164: '+2348030000101' }]
                    state: Lagos
                    lga: Ikeja
                    parentAccountId: null
                    createdAt: '2026-10-01T09:12:00.000Z'
                    updatedAt: '2026-10-03T14:40:00.000Z'
                    withheldFields: []
                nextCursor: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }

    post:
      tags: [accounts]
      summary: Create an account
      operationId: createAccount
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/03', 'P04/05']
      description: |
        **Target programme.** As createContact. If the caller reaches exactly
        one programme, `programmeId` may be omitted and the server uses that
        one. If they reach several, it is required (`400 validation_failed`
        at `programmeId` when missing). A `programmeId` they do not reach is
        `404 not_found`, the same body as a programme that does not exist;
        never `403`, which would confirm the programme is real.

        **Permission.** Creating needs `account.write` in the target programme,
        held by the `admin` set or the tenant-admin flag, as `contact.write`
        is (D-L63, D-L69; D-P18 may widen it). Without it: `403 not_permitted`,
        decided before the body is read, so the `programmeId` rules above never
        tell a caller without the permission how many programmes it reaches.
        Setting a field the caller may not edit is `403 not_permitted` with
        `details[].code: field_not_editable`. The tenant-admin flag never lifts
        field security.

        **References.** `ownerUserId` must be a member of the target programme
        (D-L67, as for contacts). `parentAccountId` must name an account in the
        target programme: an account hierarchy never crosses the BPO boundary,
        so a caller who can read an account can always reach its parent.
        Anything else, whether it names another programme's or another
        tenant's row or nothing at all, is `400 validation_failed` with
        `details[].code: unknown_reference`.

        **Hierarchy (D-L74, D-L78).** A hierarchy is at most five levels deep
        (a top-level account is level 1). A `parentAccountId` that would put
        the new account below level 5 is `400 validation_failed` with
        `details[].code: parent_depth` at `parentAccountId`.

        **Response.** The created record, through the same field-security rule
        as a read. Every create writes an audit event (`objectType: account`,
        labelled with the record id; changes are field names, never values).
        Duplicate detection and merge are not part of this slice (D-P12).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
            example:
              name: Kano Grains Co.
              industry: Agriculture
              tier: sme
              phones: [{ type: work, e164: '+2348060000102' }]
              state: Kano
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/AccountNotPermitted' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  # A concrete path, so it is matched before /api/v1/accounts/{accountId}
  # (and `map` is not a uuid, so it could never name an account).
  /api/v1/accounts/map:
    get:
      tags: [accounts]
      summary: Accounts map view (not built)
      operationId: getAccountMap
      x-kasuwa-implemented: false
      x-kasuwa-screens: ['P04/04']
      description: |
        **Not built; answers `501 not_implemented`** after authentication
        (an unauthenticated call is still `401`). The P04/04 Map groups
        accounts by State with a pin per State, which is a count per group:
        a total by another name (D-P13), and on a withheld `state` a
        disclosure. The Map view is M03 P2 and no slice owns it (D-L69). The
        screen hides the Map view switch until this operation is built.
      responses:
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      summary: Get one account
      operationId: getAccount
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/03']
      description: |
        The split-view preview (P04/03). Out of scope is `404`, never `403`:
        no such account, an account in another tenant and an account in a
        programme of this tenant the caller does not reach get one body.

        Recent activity, calls and messages in the preview are not account
        properties; they come from the activities slice (P07), not here.
      responses:
        '200':
          description: The account, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

    patch:
      tags: [accounts]
      summary: Update an account (inline edit of owner, tier and the rest)
      operationId: updateAccount
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-screens: ['P04/03']
      description: |
        Partial update: absent properties are unchanged; `null` clears a
        nullable field. `version` is required and must equal the record's
        current `version`, otherwise `409 stale_write`. Re-read; do not retry
        blind.

        **No `programmeId`.** Moving an account across the BPO isolation
        boundary is not a field edit; sending it is `400` (the body is closed).

        **Permission.** The record must be readable (else `404`). Editing it
        needs `account.write` in the record's programme (else
        `403 not_permitted`), and each field sent needs edit under field
        security (else `403 not_permitted` with
        `details[].code: field_not_editable`). A caller cannot clear a field
        they cannot read.

        **References.** As createAccount, judged in the record's programme:
        `ownerUserId` must be a member of it (D-L67) and `parentAccountId` an
        account in it, else `400 unknown_reference`. An account may not be its
        own ancestor: a `parentAccountId` that would close a cycle (itself
        included) is `400 validation_failed` with `details[].code:
        parent_cycle` at `parentAccountId`. A hierarchy is at most five levels
        deep, counting the subtree that moves with the account (D-L74): a
        `parentAccountId` that would put the account or any of its descendants
        below level 5 is `400 validation_failed` with `details[].code:
        parent_depth` at `parentAccountId` (D-L78). Both hold under concurrent
        writes: whichever of two writes the database serialises second is
        refused with the same code, never a `500`.

        Order: `404`, `403` (including `field_not_editable`), `400`, then
        `409 stale_write`. Every update writes an audit event recording which
        fields changed, never their values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
            example:
              version: 2
              tier: enterprise
              ownerUserId: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
      responses:
        '200':
          description: The updated account, field security applied. `version` has advanced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '403': { $ref: '#/components/responses/AccountNotPermitted' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/StaleWrite' }

  /api/v1/accounts/{accountId}/contacts:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      summary: The account's contacts the caller can reach
      operationId: listAccountContacts
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P04/03', 'P04/05', 'P04/06']
      description: |
        Contacts whose `accountId` is this account, as `Contact` rows under
        Contact field security: exactly what listContacts would return for
        the filter `accountId = {accountId}`. A contact's account is always in
        the contact's programme (the composite foreign key), so every row is
        in the account's programme. Same keyset paging and page shape as
        listContacts, and no total (D-P13).

        **Out of scope is `404`, never `403`.** An account the caller cannot
        reach gets the same body as one that does not exist; that check comes
        first.

        **When `accountId` is withheld.** Listing an account's contacts IS a
        filter on the contact's `accountId`, and it discloses exactly the link
        field security withholds (P04/02 locks a contact's Account column for
        the agent role). So if field security withholds the contact field
        `accountId` from the caller in the account's programme, the answer is
        `400 validation_failed` with `details[].code: field_withheld` at
        `details[].path: accountId`, the same rule as a filter on a withheld
        field on listContacts. Rows are never returned in that case.
      parameters:
        - name: sort
          in: query
          required: false
          description: |
            As listContacts' `sort`: a fixed set of never-withheld keys, a
            leading `-` descending, ties broken on `id`.
          schema:
            type: string
            enum: ['-createdAt', 'createdAt', '-updatedAt', 'updatedAt', 'displayName', '-displayName']
            default: 'displayName'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the account's contacts, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/v1/accounts/{accountId}/timeline:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: |
          An account identifier. An id the caller cannot reach, whether in
          another tenant, another programme or nowhere, is `404 not_found`.
          **Unlike the other account operations, a value that is not a uuid
          is the same `404`, byte for byte** (T-0080), never a `400`.
    get:
      tags: [accounts]
      summary: The account's timeline — field changes and activities, newest first
      operationId: listAccountTimeline
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P05/04']
      description: |
        The centre column of the P05 account record (T-0063): what changed on
        this account, who changed it, and the notes, tasks and calls logged
        against it. The same page shape, paging, ordering and item rules as
        listContactTimeline, which this operation shares rather than forks
        (T-0080); where this description is silent, that one applies.

        **Scope.** The account must be readable by the caller, exactly as for
        getAccount. Anything else (no such account, another tenant's, one in
        a programme the caller does not reach, and an id that is not a uuid)
        is one `404 not_found` body, the same bytes in every case. That check
        comes first, and nothing about the account's history is read before
        it passes. **Order: `404`, then `400`.** A bad `cursor` or `limit` on
        an account the caller cannot reach is `404`. This is a read, so there
        is no `403`: every permission set that can read the account can read
        its timeline, and out of scope is still `404`. A scope header is
        refused `400` before any of this, by authentication, whatever the id.

        **Field changes: by name only.** One `field_changed` item per field
        named by an audit event of this account (`objectType: account`, this
        account's id, in this account's programme), created and updated
        alike; a creation renders like an update (D-L81), one item per field
        the create set. The field is named by its Account wire name. Account
        audit records field names, never values (D-L78), so **every account
        item is `redacted: true` and never carries `before` or `after`**,
        whatever an audit row holds: the account has no value fields
        (T-0078). An audited name that is not an Account field yields no item
        (field security cannot judge it, so it fails closed). Accounts have
        no consent, so there are no `consent_changed` items. A contact's
        event that names its `accountId`, an activity's own events, and a
        child account's events are theirs, not this account's.

        **Activities.** One `activity` item per note, task or logged call
        whose `account_id` is this account, with or without a contact, read
        on `activity_account_keyset_idx`. The item is the same schema as on
        the contact's timeline: its current state, `occurredAt` when it was
        logged (D-L77), and its `version` for updateActivity (D-L85).
        **Not on it:** the activities of the account's contacts that carry no
        `account_id`, and those of child accounts. Rollups across contacts or
        a hierarchy are the pipeline slice's.

        **Field security omits, before paging.** Judged in the account's
        programme, against the set the caller holds there today, not at the
        time of the change; the tenant-admin flag does not lift it (D-L63).
        The ACCOUNT's matrix judges field-change items: an item for a field
        withheld from the caller is omitted, value and name, and nothing
        marks the gap. The ACTIVITY's matrix judges each activity item,
        exactly as on the contact timeline: a withheld `subject`, `body`,
        `dueAt` or `completedAt` is omitted from the item, and when the
        activity's account link (`account_id`) is withheld no activity item
        is shown at all (the counterpart of `contact_id` on the contact
        timeline). `version` is never withheld. Omission happens before the
        page is cut: a page with a non-null `nextCursor` holds `limit` items,
        and a cursor never leads to an empty page.

        **Order and paging.** `occurredAt` descending across both sources,
        ties broken by item `id` descending in code-unit order. Keyset only:
        `{ data, nextCursor }`, no total, count or offset (D-P13). The cursor
        carries a position only: never a name (D-L80), and never an id of
        anything the pages did not show. A malformed cursor, or one issued
        for another account, another timeline (a contact's included) or
        another list, is `400 validation_failed` with
        `details[].code: invalid_cursor`. `limit` out of 1..100 is `400`,
        never clamped. `Cache-Control: no-store` on every answer, `200`,
        `404` and `400` alike.

        **Actors and item ids** follow listContactTimeline (D-L81): the person
        who acted, named as they are named now; `null` is the system. Ids are
        opaque, never an audit event or activity id, and depend only on the
        item's own change or activity.

        **The client portal (D-P26, open).** No new rule here: the
        `client_portal` set reads this timeline exactly as it reads a
        contact's, and an activity is shown to it the same way on both.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the account's timeline, field security applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTimelinePage' }
              example:
                data:
                  - id: ti_4f7a0c2e9b1d4e6f8a3c5b7d9e1f2a40
                    type: field_changed
                    occurredAt: '2026-10-03T14:40:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: tier
                    redacted: true
                  - id: ti_1b2c3d4e5f60718293a4b5c6d7e8f901
                    type: field_changed
                    occurredAt: '2026-10-03T14:40:00.000Z'
                    actor:
                      id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e01
                      displayName: Kemi Balogun
                    field: phones
                    redacted: true
                  - id: ti_0a9b8c7d6e5f40312a1b2c3d4e5f6071
                    type: activity
                    occurredAt: '2026-09-30T16:05:00.000Z'
                    actor: null
                    activityId: 5e2a7b1c-3d4f-4a6b-8c9d-0e1f2a3b4c02
                    activityType: task
                    subject: Confirm the delivery schedule
                    body: Wants deliveries before 10am.
                    dueAt: '2026-10-02T15:00:00.000Z'
                    completedAt: null
                    startsAt: null
                    endsAt: null
                    version: 3
                nextCursor: dGltZWxpbmUtY3Vyc29yLWV4YW1wbGU
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/NotAuthenticated' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        `Authorization: Bearer ksw_s1_…` (auth.openapi.yaml). The token carries
        no claims and no scope; every request re-resolves both from the
        database.

  parameters:
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        A record identifier. An id the caller cannot reach, whether in another
        tenant, another programme or nowhere, is `404 not_found`. A value that
        is not a uuid is `400`.
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        An account identifier. An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`. A
        value that is not a uuid is `400`.
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        An activity identifier. An id the caller cannot reach, whether in
        another tenant, another programme or nowhere, is `404 not_found`. A
        value that is not a uuid is `400`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 2048 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged; do not parse it or build
        one. It is valid only with the same `q`, filters and `sort` that
        produced it. A malformed cursor is `400`. A well-formed cursor pointing
        outside the caller's scope yields rows from their scope only, never
        anyone else's (cursor-tampering.acceptance.test.ts).
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Rows per page. P04 offers 25, 50 and 100. Out of range is `400`, never clamped.
    TimeZone:
      name: timeZone
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z_][A-Za-z0-9_]*(/[A-Za-z0-9_+-]+){0,2}$'
      description: |
        The caller's IANA time zone (listMyActivities, T-0081), for example
        `Africa/Lagos`, `Africa/Nairobi` or `Africa/Johannesburg`. Required,
        with no default: the server never substitutes UTC, the tenant's zone
        or any other. It must match the pattern AND name a zone in the
        server's IANA time-zone database; anything else is `400
        validation_failed` with `details[].code: invalid_time_zone` at
        `timeZone`. An abbreviation (`WAT`), an offset (`+01:00`, `UTC+1`), a
        path (`../`), a value with spaces or a NUL, and a parameter sent twice
        are all `400`. The value is looked up as a name, never used as a file
        path. It decides where "today" ends and nothing else; every time on the
        wire stays UTC.
    ActivityBucket:
      name: bucket
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ActivityBucket' }
      description: Which group of P07/01 to list. Required; anything else is `400`.
    ActivityCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: |
        **Opaque.** Echo `nextCursor` back unchanged, with the same other
        parameters; do not parse it or build one. It carries the id of the
        last row and nothing else (D-L80): never a subject, a name or a time.
        The server resolves the position from that activity's CURRENT sort
        key, inside the caller's scope. The id must name an activity the
        caller owns, in a programme the session resolves, of a kind the list
        shows (a task on listMyActivities; a task or a meeting on
        listCalendar), whose sort field (`dueAt`, or a meeting's `startsAt`)
        is not withheld from the caller. Anything else is `400
        validation_failed` with `details[].code: invalid_cursor`, one body
        whatever the reason, exactly as for a malformed cursor: no such
        activity, another tenant's or programme's, someone else's, a note or a
        call, or a withheld sort field. So a cursor cannot test whether an id
        exists. A task completed, snoozed or rescheduled since the page was
        cut still resolves, at its current position: the next page starts
        after it, and a moved row can make a later page skip or repeat a row.
        Re-read from the top after a write.
    WindowFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: |
        The window's start, inclusive (listCalendar). A UTC date-time with a
        `Z`; an offset, a date alone, year 0 or an impossible date is `400`.
    WindowTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: |
        The window's end, exclusive (listCalendar). A UTC date-time with a
        `Z`, after `from` (`400 invalid_window`) and at most 42 days after it
        (`400 window_too_long`, never clamped).

  headers:
    NoStore:
      description: |
        Always `no-store`. Every answer of every records route carries it,
        errors included (T-0080's middleware runs before the guards, so a
        `401` or a `400` from the guard has it too).
      schema: { type: string, enum: ['no-store'] }

  schemas:
    ContactStatus:
      type: string
      enum: [new, contacted, qualified, unqualified, customer]
      description: |
        Snake_case codes, as stored (T-0040); P04's labels ("Qualified") are
        i18n strings, never values. The tenant-wide default set. Programme-specific stages (P04/02 shows a
        collections programme's "Promise to pay", "In arrears") are not modelled
        in this slice.

    ContactSource:
      type: string
      enum: [whatsapp, ussd, web_form, missed_call, import, api, manual, referral, walk_in]

    PreferredChannel:
      type: string
      enum: [whatsapp, sms, voice, email]

    ConsentState:
      type: string
      enum: [unknown, opted_in, pending, withdrawn]
      default: unknown
      description: |
        Marketing consent under NDPA. Never null; a new contact is `unknown`.
        Changes are audited.

    Phone:
      type: object
      additionalProperties: false
      required: [type, e164]
      properties:
        type: { type: string, enum: [mobile, work, home, other] }
        e164:
          type: string
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164 only. A write in any other format is `400`.

    Contact:
      type: object
      required: [id, programmeId, version, displayName, createdAt, updatedAt, withheldFields]
      description: |
        One contact as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional and why `emails`,
        which P04/02 locks for the agent role, is not nullable: an empty list
        means none.

        `id`, `programmeId`, `version`, `displayName`, `createdAt`, `updatedAt`
        and `withheldFields` are never withheld.

        **Specified, not yet served.** The `allOf` part below adds properties
        this contract specifies and the live API does not send yet (each is
        marked `x-kasuwa-implemented: false`): none today. `properties` here
        is exactly what the live wire carries; the task that serves a pending
        property moves it into `properties` in the same change, as T-0061 did
        for `account` and T-0076 for `companyName`. The part stays, empty, so
        the next pending property has a place to go.
      allOf:
        - $ref: '#/components/schemas/ContactPendingProperties'
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the record belongs to. Read-only; set once at create.
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateContact.
        displayName: { type: string, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          maxLength: 200
          description: |
            The organisation the person says they are with, as free text
            (D-P17: `contact` gains a `company_name`, T-0076). The P04/01 Leads
            table's Company column. It is not a link: an `accountId` is the
            link, and a lead often has a company long before anyone creates
            an account for it. `null` means no company was recorded.

            **Field-secured like every other contact field** (field
            `company_name`). Withheld is omitted and listed in
            `withheldFields`, never sent as `null`. Writable on createContact
            and updateContact under the same field security, by `contact.write`
            only: the narrow edit the `agent`, `team_lead` and
            `programme_manager` sets hold (D-P14, D-P18) does not include it.
            convertContact neither copies it into the new account nor clears
            it; a screen may prefill the new account's name from it.

            Classified `pii` (D-L82): a sole trader's company is a person's
            name. The audit trail and the timeline name a change to it, never
            its value.
        phones:
          type: array
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          items: { type: string, format: email }
        accountId: { type: [string, 'null'], format: uuid }
        account:
          description: |
            The contact's account, with a name to print (P05/01's related
            records; T-0059, D-L72; served since T-0061). `null` exactly when
            `accountId` is `null`; otherwise `account.id` equals `accountId`.
            Read in the same scoped query as the contact. Accounts are
            programme-scoped and a contact's account is always in the
            contact's programme, so this never names an account the caller's
            programme cannot see.

            **Withheld with `accountId`.** When field security withholds
            `accountId`, `account` is omitted too and both are listed in
            `withheldFields`. Read-only: neither write body takes `account`;
            a write sets `accountId`.
          oneOf:
            - { $ref: '#/components/schemas/ContactAccountSummary' }
            - { type: 'null' }
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: '`null` is unassigned.'
        owner:
          description: |
            The owner, with a display name to print (T-0043, D-L64). `null`
            exactly when `ownerUserId` is `null`; otherwise `owner.id` equals
            `ownerUserId`. Read in the same scoped query as the contact, so a
            name is only ever sent for the owner of a record the caller can
            already see: this is not a user directory.

            Withheld with `ownerUserId`: when field security withholds
            `ownerUserId`, `owner` is omitted too and both are listed in
            `withheldFields`. Read-only; a write sets `ownerUserId`.

            **A former owner (T-0103, D-P23).** When the owner is no longer a
            member of THIS contact's programme (removed from it, or never in
            it), `owner` is `{ id, displayName: null }`: the id, so the
            client can tell an owner from none, and no name. Membership of any
            other programme, the reader's included, does not restore the
            name. A member whose account is disabled is still a member and
            keeps their name. The screens print a translated neutral label
            ("Former owner"), never the id. Removing a user from a programme
            also unassigns their contacts there (`ownerUserId` becomes
            `null`), so this form is for owners that removal has not reached.
            Never `500`, and never the name, current or past.
          oneOf:
            - { $ref: '#/components/schemas/ContactOwner' }
            - { type: 'null' }
        status:
          description: '`null` when never set (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactStatus' }
            - { type: 'null' }
        source:
          description: '`null` when not recorded (the column is nullable).'
          oneOf:
            - { $ref: '#/components/schemas/ContactSource' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none; a stored NULL is sent as `[]`.
          items: { type: string, maxLength: 64 }
        preferredLanguage:
          type: [string, 'null']
          maxLength: 35
          description: BCP 47 tag, e.g. `en`, `yo`, `ha`, `ig`, `pcm`. Format-checked, no enum.
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        dnd:
          type: boolean
          default: false
          description: |
            On the NCC Do-Not-Disturb register. Read-only here: set by register
            lookup or import, never by an inline edit. Clearing it by hand would
            license promotional traffic to that number.
        whatsappOptIn: { type: boolean, default: false }
        consentState: { $ref: '#/components/schemas/ConsentState' }
        phoneNetwork:
          type: [string, 'null']
          maxLength: 32
          description: Read-only, server-derived (network detection is PRD Q5; null until then).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    ContactOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale or status. `displayName` is `null` exactly when the owner
        is a former owner: no longer a member of the contact's programme
        (T-0103, D-P23). It is always present.
      properties:
        id: { type: string, format: uuid }
        displayName:
          type: [string, 'null']
          description: |
            The owner's current display name. `null` means a former owner;
            print the translated neutral label, never the id.

    ContactPendingProperties:
      type: object
      description: |
        Contact properties this contract specifies and the live API does not
        serve yet. Composed into `Contact` (so every Contact-shaped response,
        list rows included, carries them once served) and kept out of
        `Contact.properties` until then, because `Contact.properties` is the
        live wire's key set: the T-0041 suite checks every one of them is
        present or listed in `withheldFields`. Optional, like every
        withholdable property; a client must cope with their absence.
        Empty today: `account` (T-0061) and `companyName` (T-0076) are served.
      properties: {}

    ContactAccountSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      description: |
        Closed: an account id and its name, nothing else. No owner, tier,
        industry or phones; the account record has those, under its own
        field security (getAccount).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        Keyset page of timeline items, newest first. No total, count or
        offset (D-P13), and nothing that says items were left out for field
        security. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
        nextCursor: { type: [string, 'null'] }

    TimelineItem:
      description: |
        One thing that happened to the contact. A closed union on `type`
        (D-L72): `field_changed`, `consent_changed` and `activity` (T-0061);
        no other type is added without a lead decision.

        An item for a field withheld from the caller is omitted from the
        timeline, value and name; see listContactTimeline.
      oneOf:
        - $ref: '#/components/schemas/FieldChangedItem'
        - $ref: '#/components/schemas/ConsentChangedItem'
        - $ref: '#/components/schemas/ActivityItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/FieldChangedItem'
          consent_changed: '#/components/schemas/ConsentChangedItem'
          activity: '#/components/schemas/ActivityItem'

    TimelineActor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Who made a change: an id and a name to print, nothing else (the
        T-0043 owner shape). No email, phone, role or programme. Read in the
        same scoped query as the item, so a name is only ever sent for the
        author of a change to a record the caller can already see.
        `displayName` is never `null`: unlike `Contact.owner` (D-P23), a
        former member, a tenant admin outside the programme and a disabled
        user are still named, because an actor acted inside the programme
        (D-L81).
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    FieldChangedItem:
      description: |
        A change to one Contact field, named by its contract wire name. One
        audit event that changed several fields is several items (one per
        field) sharing an `occurredAt`.

        Two shapes, by field (D-L72):
        - `FieldChangeWithValues`: the non-PII enumerated fields. `before`
          and `after` are present for changes recorded from T-0061 onward and
          absent on older ones, which were audited by name only (D-L63).
        - `FieldChangeRedacted`: phones, emails, the name parts, the
          company (T-0076, D-L82), the owner and the account. Never a value,
          only the field name and `redacted: true`.

        `consentState` is not a `field_changed` field: its changes are
        `consent_changed` items.
      oneOf:
        - $ref: '#/components/schemas/FieldChangeWithValues'
        - $ref: '#/components/schemas/FieldChangeRedacted'

    FieldChangeWithValues:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field]
      properties:
        id:
          type: string
          description: |
            Opaque and unique per item; never the audit event id (one event
            yields several items). The tie-break for items sharing an
            `occurredAt`.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [status, source, preferredChannel, preferredLanguage, whatsappOptIn, state, lga, tags]
          description: The Contact property that changed.
        before:
          description: |
            The value before the change, in the Contact property's own wire
            type (a code, a string, a boolean or a list of tags); `null` when
            it had none. Absent on changes recorded before T-0061.
          type: [string, boolean, array, 'null']
          items: { type: string }
        after:
          description: The value after the change. Same rules as `before`.
          type: [string, boolean, array, 'null']
          items: { type: string }

    FieldChangeRedacted:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change shown by field name only. Phones and emails (D-L54) and a
        person's name (D-L63) are PII and never leave the audit trail as
        values. Owner and account changes carry no ids either (D-L64, D-L72).
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [displayName, givenNames, familyName, companyName, phones, emails, ownerUserId, accountId]
          description: |
            The Contact property that changed. `companyName` (T-0076) is free
            text that is often a person's name, so it is shown by name only.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    ConsentChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor]
      description: |
        A change to the contact's marketing consent (`consentState`, NDPA).
        It follows `consentState`'s field security: omitted whenever
        `consentState` is withheld from the caller.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: consent_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a register lookup, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        before:
          description: |
            The consent state before the change (never null: a contact's
            consent starts at `unknown`). Absent on changes recorded before
            T-0061, which were audited by name only (D-L63).
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }
        after:
          description: The consent state after the change. Absent on changes recorded before T-0061.
          allOf:
            - { $ref: '#/components/schemas/ConsentState' }

    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, activityId, activityType, version]
      description: |
        A note, a task or a logged call on this contact (T-0061) or this
        account (T-0080), in its current state: completing a task changes
        this item and never adds one. `occurredAt` is when the activity was
        logged (D-L77), and `actor` who logged it (`null`: the system, such
        as an import). One schema for both timelines.

        Follows the activity object's field security in the record's
        programme: a `subject`, `body`, `dueAt`, `completedAt`, `startsAt` or
        `endsAt` the caller may not read is omitted from the item (never sent
        as `null`). A present `null` means no value. `version` is never
        withheld.

        `startsAt` and `endsAt` (a meeting's times, T-0081, served since
        T-0082) are on every activity item, `null` on a note, a task or a
        call.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the activity id or an audit event id.
        type: { type: string, const: activity }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        activityId:
          type: string
          format: uuid
          description: The activity, for updateActivity.
        activityType: { $ref: '#/components/schemas/ActivityType' }
        subject: { type: [string, 'null'], maxLength: 200 }
        body: { type: [string, 'null'], maxLength: 10000 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only; `null` on a note or a call.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Set by the server when a task is completed; `null` until then.
        startsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: A meeting's start (T-0081); `null` on any other type.
        endsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: A meeting's end, after `startsAt` and at most 24 hours after it; `null` on any other type.
        version:
          type: integer
          minimum: 1
          description: |
            The activity row's current `version` (D-L85), unchanged by field
            security: send it back on updateActivity to complete or reassign
            the activity. Stale is `409 stale_write`; re-read the timeline.

    AccountTimelinePage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        listAccountTimeline's page (T-0080): the same shape as TimelinePage,
        `{ data, nextCursor }`, with no total, count or offset (D-P13) and
        nothing that says items were left out. Its own schema, not
        TimelinePage, because its field changes are named by Account fields
        and never carry values: an account `tags` or `state` change is
        name-only, where the contact's carries values (D-L72, D-L78).
        `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AccountTimelineItem' }
        nextCursor: { type: [string, 'null'] }

    AccountTimelineItem:
      description: |
        One thing that happened to the account. A closed union on `type`:
        `field_changed` (by name only) and `activity` (the very ActivityItem
        of the contact timeline). An account has no consent, so there is no
        `consent_changed`. No other type is added without a lead decision
        (D-L72).
      oneOf:
        - $ref: '#/components/schemas/AccountFieldChangedItem'
        - $ref: '#/components/schemas/ActivityItem'
      discriminator:
        propertyName: type
        mapping:
          field_changed: '#/components/schemas/AccountFieldChangedItem'
          activity: '#/components/schemas/ActivityItem'

    AccountFieldChangedItem:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, actor, field, redacted]
      description: |
        A change to one Account field, shown by name only (D-L78: account
        audit records field names, never values; T-0078: an account has no
        value fields). Never `before` or `after`. One audit event that
        changed several fields is several items sharing an `occurredAt`.
      properties:
        id:
          type: string
          description: Opaque and unique per item; never the audit event id.
        type: { type: string, const: field_changed }
        occurredAt: { type: string, format: date-time }
        actor:
          description: '`null` is the system (an import, a migration).'
          oneOf:
            - { $ref: '#/components/schemas/TimelineActor' }
            - { type: 'null' }
        field:
          type: string
          enum: [name, ownerUserId, industry, tier, tags, phones, state, lga, parentAccountId]
          description: The Account property that changed.
        redacted:
          type: boolean
          const: true
          description: Always `true`. The change happened; its values are not shown.

    ActivityType:
      type: string
      enum: [note, task, call, meeting]
      description: |
        Snake_case codes, as stored (0027); labels are i18n strings. Only a
        task has a due time (`dueAt`) and can be completed. Only a meeting
        has a start and an end (`startsAt`, `endsAt`). Closed: P07's demo,
        field visit and internal event are not types.

        **`meeting`** (T-0081, D-L87; served since T-0082). A client that
        renders activities must expect it on every activity-shaped read, the
        timelines included.

    ActivityBucket:
      type: string
      enum: [overdue, today, upcoming]
      description: |
        listMyActivities' groups (P07/01), computed by the server in the
        caller's `timeZone`: `overdue` is due before now; `today` is due from
        now until the next midnight in that zone; `upcoming` is due at or
        after it, then every task with no due time. Disjoint.

    Activity:
      type: object
      additionalProperties: false
      required: [id, programmeId, type, createdByUserId, version, createdAt, updatedAt, withheldFields]
      description: |
        One activity as the caller may see it (T-0061). The Contact rules
        apply: a property the caller's permission set may not read in the
        activity's programme is omitted and named in `withheldFields`, never
        sent as `null`. `id`, `programmeId`, `type`, `createdByUserId`,
        `version`, `createdAt`, `updatedAt` and `withheldFields` are never
        withheld. No tenant id.

        `startsAt` and `endsAt` (T-0081, served since T-0082) are present
        (or withheld) on every activity, `null` on a note, a task or a
        call.
      properties:
        id:
          type: string
          format: uuid
          description: Minted by the server (D-L79).
        programmeId:
          type: string
          format: uuid
          description: The programme of the activity's target. Read-only; set once at create.
        type: { $ref: '#/components/schemas/ActivityType' }
        subject: { type: [string, 'null'], maxLength: 200 }
        body: { type: [string, 'null'], maxLength: 10000 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Set by the server when a task is completed. Never cleared (D-L81).
        startsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: Meetings only (T-0081); `null` on any other type.
        endsAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only (T-0081): after `startsAt` and at most 24 hours after
            it. `null` on any other type.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: '`null` is unassigned. Always a member of the activity''s programme.'
        contactId: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
        createdByUserId:
          type: [string, 'null']
          format: uuid
          description: Who logged it, from the session (D-L79). `null` is the system.
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateActivity.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Always present; empty when nothing was withheld.
          items:
            type: string
            enum: [subject, body, dueAt, completedAt, startsAt, endsAt, ownerUserId, contactId, accountId]

    CreateActivityRequest:
      type: object
      additionalProperties: false
      required: [type]
      description: |
        Closed. At least one of `contactId` and `accountId`. No `id` (D-L79),
        no `programmeId` (the target's), no creator (the session's), no
        `completedAt` (the server's), no `version`: each is `400`. A meeting
        requires `startsAt` and `endsAt`; see createActivity.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        subject:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: Free text; never logged. A NUL character is `400`.
        body:
          type: [string, 'null']
          minLength: 1
          maxLength: 10000
          description: Free text; never logged. A NUL character is `400`.
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Tasks only (`400 task_only` on a note, a call or a meeting). UTC, with a `Z`.
        startsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only, and required on one (`400 meeting_only` on any other
            type). UTC, with a `Z`. Not nullable.
        endsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Meetings only, and required on one. After `startsAt`
            (`400 invalid_range`) and at most 24 hours after it
            (`400 too_long`). UTC, with a `Z`. Not nullable.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            A member of the activity's programme (D-L67). Anyone but the
            caller needs `activity.reassign` (D-L81).
        contactId:
          type: [string, 'null']
          format: uuid
          description: Decides the programme when given.
        accountId:
          type: [string, 'null']
          format: uuid
          description: Decides the programme when it is the only target; else must be in the contact's.

    UpdateActivityRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Closed: `version` plus only the fields the person changed (D-L102):
        `completed: true` and/or `ownerUserId` (D-L81), and from T-0081
        `dueAt` (a task), `startsAt` and `endsAt` (a meeting). Retargeting,
        moving programme and every server-owned field are `400`. There is no
        way to reopen a task: `completed` admits only `true` and there is no
        `completedAt` (D-L81, D-L87).
      properties:
        version:
          type: integer
          minimum: 1
          description: The activity's current `version`; a stale one is `409 stale_write`.
        completed:
          type: boolean
          enum: [true]
          description: Complete a task; the server sets `completedAt`. A note, a call or a meeting is `400 task_only`.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            Reassign to a member of the activity's programme, or `null` to
            clear. The `agent` set may set only itself (D-L81).
        dueAt:
          type: [string, 'null']
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Snooze or move a task (T-0081); `null` clears its due time. A
            note, a call or a meeting is `400 task_only`. UTC, with a `Z`.
            Never changes `completedAt`.
        startsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Move a meeting's start (T-0081). Anything but a meeting is
            `400 meeting_only`. Not nullable. The result must keep `endsAt`
            after `startsAt` and at most 24 hours after it.
        endsAt:
          type: string
          format: date-time
          x-kasuwa-implemented: true
          description: |
            Move a meeting's end (T-0081). Anything but a meeting is
            `400 meeting_only`. Not nullable. Judged on the result, as
            `startsAt`.

    ActivityContactSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: the activity's contact, an id and a name to print, nothing
        else (no phone, email, owner or status). The contact is always in the
        activity's programme, so this names nobody the caller's programme
        cannot see.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 200 }

    MyActivity:
      type: object
      additionalProperties: false
      required: [id, programmeId, type, version, withheldFields]
      description: |
        One of the caller's own activities on listMyActivities or
        listCalendar (T-0081): a task or a meeting, with what P07 draws on a
        row or an event and nothing more. No `body` (a list carries no free
        text beyond the subject; the timeline has it) and no owner (it is
        always the caller). No tenant id.

        **Field security** in the activity's own programme, as on Activity:
        a property the caller may not read is omitted and named in
        `withheldFields`, never sent as `null`. `contact` is withheld with the
        activity's contact link (`contactId`) and `account` with its account
        link (`accountId`). `id`, `programmeId`, `type`, `version` and
        `withheldFields` are never withheld. A task whose `dueAt`, or a
        meeting whose `startsAt` or `endsAt`, is withheld is not listed at
        all (see the operations).

        `version` is the activity's current one: send it back on
        updateActivity to complete, snooze or reschedule this item.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The activity's programme.
        type:
          type: string
          enum: [task, meeting]
          description: Only tasks and meetings have a time. Notes and calls are never listed.
        subject: { type: [string, 'null'], maxLength: 200 }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: A task's due time; `null` on a meeting and on an undated task.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Always `null` on listMyActivities (it lists open tasks); a
            completed task on listCalendar carries its completion time.
        startsAt:
          type: [string, 'null']
          format: date-time
          description: A meeting's start; `null` on a task.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: A meeting's end; `null` on a task.
        contact:
          description: The activity's contact, or `null` when it has none. Withheld with `contactId`.
          oneOf:
            - { $ref: '#/components/schemas/ActivityContactSummary' }
            - { type: 'null' }
        account:
          description: The activity's account, or `null` when it has none. Withheld with `accountId`.
          oneOf:
            - { $ref: '#/components/schemas/ContactAccountSummary' }
            - { type: 'null' }
        version:
          type: integer
          minimum: 1
          description: The activity's current `version`, for updateActivity. Never withheld.
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Always present; empty when nothing was withheld.
          items:
            type: string
            enum: [subject, dueAt, completedAt, startsAt, endsAt, contact, account]

    MyActivityPage:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      description: |
        Keyset page of the caller's own activities (listMyActivities,
        listCalendar). No total, count, offset or count per bucket or day
        (D-P13), and nothing that says items were left out for field
        security. `nextCursor` is `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MyActivity' }
        nextCursor: { type: [string, 'null'] }

    MyProgramme:
      type: object
      additionalProperties: false
      required: [id, name]
      description: One programme the caller belongs to. Closed.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    MyProgrammeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MyProgramme' }

    ContactPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        nextCursor: { type: [string, 'null'] }

    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `dnd`, `phoneNetwork`, timestamps, `withheldFields`), is `400`.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Free-text company (Contact.companyName). Declared here, not only
            on Contact, because this body is closed. 1 to 200 characters;
            `""`, a NUL character or more than 200 is `400 validation_failed`
            (D-L82). `null` or absent records none.
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        source: { $ref: '#/components/schemas/ContactSource' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    UpdateContactRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        and no `source` (how a contact arrived does not change). Server-owned
        properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        displayName: { type: string, minLength: 1, maxLength: 200 }
        givenNames: { type: [string, 'null'], maxLength: 200 }
        familyName: { type: [string, 'null'], maxLength: 200 }
        companyName:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          description: |
            Free-text company (Contact.companyName); `null` clears it. 1 to
            200 characters; `""`, a NUL character or more than 200 is
            `400 validation_failed` (D-L82). Needs `contact.write`: the D-P14
            narrow edit does not cover it, so a body carrying it from the
            `agent`, `team_lead` or `programme_manager` set is `403`.
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        emails:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { type: string, format: email, maxLength: 254 }
        accountId: { type: [string, 'null'], format: uuid }
        ownerUserId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/ContactStatus' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        preferredLanguage: { type: [string, 'null'], maxLength: 35 }
        preferredChannel:
          oneOf:
            - { $ref: '#/components/schemas/PreferredChannel' }
            - { type: 'null' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        whatsappOptIn: { type: boolean }
        consentState: { $ref: '#/components/schemas/ConsentState' }

    ConvertContactRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: |
        Closed. `version` plus EXACTLY ONE of `accountId` (link an existing
        account) or `newAccount` (create one and link it). Both, or neither,
        is `400 validation_failed`. There is no `status` (convert always
        qualifies, and never demotes a customer), no `programmeId` (the
        account is the contact's programme's, full stop) and no contact id
        (the path names the contact).
      properties:
        version:
          type: integer
          minimum: 1
          description: |
            The contact's `version` from your last read. Not current is
            `409 stale_write`, except for an exact repeat whose result is
            already in place (see convertContact).
        accountId:
          type: string
          format: uuid
          description: |
            An existing account in the contact's programme. Never `null`: a
            convert always links an account. An account the caller cannot
            reach, or one in another programme, is `404 not_found`.
        newAccount: { $ref: '#/components/schemas/ConvertNewAccount' }
      oneOf:
        - required: [accountId]
        - required: [newAccount]

    ConvertNewAccount:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        The account convert creates, in the contact's programme. Closed, and
        deliberately small: a name. It has no `programmeId` (the contact's
        programme decides) and no owner (the new account is unassigned; set
        `ownerUserId` afterwards with updateAccount). Every other account
        field is set on the account afterwards.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    ConvertContactResponse:
      type: object
      additionalProperties: false
      required: [contact, account]
      description: |
        Closed: the converted contact and its account, each under its own
        field security, and nothing else. The first call and an exact repeat
        answer with the same shape; nothing here says whether this call
        created the account.
      properties:
        contact: { $ref: '#/components/schemas/Contact' }
        account: { $ref: '#/components/schemas/Account' }

    AccountTier:
      type: string
      enum: [enterprise, mid_market, sme]
      description: |
        Snake_case codes (D-L61); P04's labels ("Enterprise", "Mid-market",
        "SME") are i18n strings, never values. The column is T-0054's; this
        set is the contract it must store.

    AccountOwner:
      type: object
      additionalProperties: false
      required: [id, displayName]
      description: |
        Closed: an id and a name to print, nothing else. No email, phone,
        locale, status or programme. The same shape as the contact's owner
        (T-0043); the two may become one shared schema.
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }

    Account:
      type: object
      required: [id, programmeId, name, version, createdAt, updatedAt, withheldFields]
      description: |
        One account (an organisation) as the caller may see it.

        **Withheld fields are omitted, never nulled.** A property the caller's
        permission sets may not read is absent from the object and its name is
        in `withheldFields`. A present `null` means the record has no value.
        That is why every withholdable property is optional, and why `tags`
        and `phones` are never nullable: an empty list means none.

        `id`, `programmeId`, `name`, `version`, `createdAt`, `updatedAt` and
        `withheldFields` are never withheld; `sort` uses only these.

        **Not here, deliberately (D-L69):** Health or any score (M17), deal or
        pipeline rollups, counts of contacts or other related records (D-P13),
        and a list of child accounts. The hierarchy is the one
        `parentAccountId` link.
      properties:
        id: { type: string, format: uuid }
        programmeId:
          type: string
          format: uuid
          description: The programme the account belongs to. Read-only; set once at create.
        name: { type: string, minLength: 1, maxLength: 200 }
        version:
          type: integer
          minimum: 1
          description: Optimistic-concurrency token. Send it back on updateAccount.
        ownerUserId:
          type: [string, 'null']
          format: uuid
          description: |
            `null` is unassigned. Withheld together with `owner`: when field
            security withholds the owner, both are omitted and listed.
        owner:
          description: |
            The owner with a display name to print, embedded as T-0043 does
            for contacts. `null` exactly when `ownerUserId` is `null`;
            otherwise `owner.id` equals `ownerUserId`. Read in the same scoped
            query as the account, so a name is only ever sent for the owner of
            a record the caller can already see: this is not a user directory.
            Read-only; a write sets `ownerUserId`.
          oneOf:
            - { $ref: '#/components/schemas/AccountOwner' }
            - { type: 'null' }
        industry:
          type: [string, 'null']
          maxLength: 64
          description: Free text as the tenant records it (`FMCG`, `Agriculture`). No enum in this slice.
        tier:
          description: '`null` when not set.'
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          description: Empty when none.
          items: { type: string, maxLength: 64 }
        phones:
          type: array
          description: |
            E.164. No DND flag here yet: no decision says where it lives for an
            account's numbers, so a screen must not infer one.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId:
          type: [string, 'null']
          format: uuid
          description: |
            The parent organisation, always in the same programme. `null` for a
            top-level account.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withheldFields:
          type: array
          description: |
            Names of the properties above that field security withheld from
            this caller. Those properties are omitted from the object, never
            sent as `null`. Always present; empty when nothing was withheld.
          items: { type: string }

    AccountPage:
      type: object
      required: [data, nextCursor]
      description: |
        Keyset page. No total, offset or page number (D-P13). `nextCursor` is
        `null` on the last page.
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        nextCursor: { type: [string, 'null'] }

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Closed: an unknown property, or a server-owned one (`id`, `version`,
        `owner`, timestamps, `withheldFields`), is `400`. The owner is set by
        `ownerUserId`; its display name is the server's.
      properties:
        programmeId:
          type: string
          format: uuid
          description: Target programme; see the operation. Unreachable is `404`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: |
        Closed. `version` plus at least one field. There is no `programmeId`
        (an account does not move between programmes) and no `owner` (set
        `ownerUserId`). Server-owned properties are `400`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` from your last read. Not current is `409 stale_write`.
        name: { type: string, minLength: 1, maxLength: 200 }
        ownerUserId: { type: [string, 'null'], format: uuid }
        industry: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        tier:
          oneOf:
            - { $ref: '#/components/schemas/AccountTier' }
            - { type: 'null' }
        tags:
          type: array
          maxItems: 50
          description: Replaces the whole list.
          items: { type: string, minLength: 1, maxLength: 64 }
        phones:
          type: array
          maxItems: 10
          description: Replaces the whole list.
          items: { $ref: '#/components/schemas/Phone' }
        state: { type: [string, 'null'], maxLength: 64 }
        lga: { type: [string, 'null'], maxLength: 64 }
        parentAccountId: { type: [string, 'null'], format: uuid }

  responses:
    ValidationFailed:
      description: |
        The request did not parse: a bad query value, a malformed cursor, a
        non-uuid id, an unknown or server-owned body property, a filter on a
        withheld field, or a scope header (the auth guard rejects those
        outright). `details` names paths and reason codes, never the submitted
        value.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            badField:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: phones.0.e164
                    code: invalid_string
            badCursor:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: cursor
                    code: invalid_cursor
            withheldFilter:
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: lga
                    code: field_withheld
            badTimeZone:
              summary: listMyActivities, a timeZone that is not an IANA zone
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: timeZone
                    code: invalid_time_zone
            windowTooLong:
              summary: listCalendar, a window longer than 42 days
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: to
                    code: window_too_long
            meetingTooLong:
              summary: createActivity or updateActivity, a meeting longer than 24 hours
              value:
                statusCode: 400
                error: Bad Request
                code: validation_failed
                message: Validation failed
                details:
                  - path: endsAt
                    code: too_long

    NotAuthenticated:
      description: |
        No usable session. It does not say whether the token was missing,
        expired, revoked or from another tenant.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 401
            error: Unauthorized
            code: not_authenticated
            message: Not authenticated

    NotFound:
      description: |
        **One body for all of:** no such contact, a contact in another tenant,
        a contact in a programme of this tenant the caller does not reach, and
        (on create) a target programme they do not reach. A `403` here would
        confirm the id names something real: an enumeration oracle against a
        BPO running two competitors' programmes on one workspace.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    NotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the record (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on contacts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: emails
                    code: field_not_editable

    StaleWrite:
      description: |
        `version` is not current: somebody saved since your last read. Nothing
        was applied. Re-read and re-apply; do not retry blind.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 409
            error: Conflict
            code: stale_write
            message: Someone else saved changes while you were editing. Reload and try again.

    AccountNotFound:
      description: |
        **One body for all of:** no such account, an account in another
        tenant, an account in a programme of this tenant the caller does not
        reach, and (on create) a target programme they do not reach. A `403`
        here would confirm the id names something real.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 404
            error: Not Found
            code: not_found
            message: Not found

    AccountNotPermitted:
      description: |
        **Writes only, and never a substitute for `404`.** The caller can read
        the account (or reaches the target programme) and may not perform this
        write, or may not edit a field they sent. If they cannot read it, the
        answer is `404`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          examples:
            action:
              summary: No create or edit permission on accounts
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
            field:
              summary: A field the caller may not edit
              value:
                statusCode: 403
                error: Forbidden
                code: not_permitted
                message: You do not have permission to do that.
                details:
                  - path: tier
                    code: field_not_editable

    NotImplemented:
      description: |
        Specified, not built. One fixed body; the screen hides the feature
        rather than drawing an error.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: './admin.openapi.yaml#/components/schemas/Error' }
          example:
            statusCode: 501
            error: Not Implemented
            code: not_implemented
            message: Not implemented

security:
  - sessionToken: []
