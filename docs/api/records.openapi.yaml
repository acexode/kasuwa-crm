    post:
      tags: [deals]
      summary: Create a deal in the pipeline's first open stage
      operationId: createDeal
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-permission: deal.write
      x-kasuwa-screens: ['P06/01', 'P06/07']
      x-kasuwa-error-order: ['404 not_found', '403 not_permitted', '400 validation_failed']
      x-kasuwa-rights:
        admin: any
        programme_manager: any
        team_lead: any
        agent: own
        qa_analyst: none
        client_portal: none
      description: |
        **Where.** The deal lives in the pipeline's programme (D-L88); the
        pipeline comes from the path, so the body takes no `programmeId`,
        `pipelineId` or `stageId`. **Every deal starts in the pipeline's
        first open stage**, which never has requirements, so no create can
        skip a gate. A pipeline the caller cannot reach is the one
        `404 not_found` body.

        **Rights (D-L88).** Creating needs `deal.write` in the pipeline's
        programme, held by the `agent`, `team_lead`, `programme_manager` and
        `admin` sets and the tenant-admin flag; `qa_analyst` and
        `client_portal` get `403 not_permitted`, decided before the body is
        read. **An agent's deal is theirs:** without `ownerUserId` the owner
        is the caller. Any other owner, `null` included, needs
        `deal.reassign` (`team_lead`, `programme_manager`, `admin`); without
        it the answer is `403 not_permitted` with
        `details[].code: owner_not_self` at `ownerUserId`. Setting a field
        the caller may not edit is `403 not_permitted` with
        `details[].code: field_not_editable`. The tenant-admin flag never
        lifts field security.

        **References.** `primaryContactId` must name a contact and
        `accountId` an account in the pipeline's programme, and
        `ownerUserId` a member of it. Anything else, another programme's or
        tenant's row or nothing at all, is `400 validation_failed` with
        `details[].code: unknown_reference`. **Money:** `amount` is
        `{ amountMinor, currency }`, one currency per deal, never
        converted; a currency the server does not know is `400` with
        `details[].code: unknown_currency` at `amount.currency`.

        **Order:** `404`, `403` (the action, `owner_not_self` and
        `field_not_editable`, judged on the raw body), then `400`. The
        answer is the created deal through Deal field security. Every create
        writes one audit event (`objectType: deal`), field names only, never
        values.
