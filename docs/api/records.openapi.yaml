                value:
                  version: 8
                  toStageId: 5d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f06
      responses:
        '200':
          description: Moved. The deal in its new stage, field security applied.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
