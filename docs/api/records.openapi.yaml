    patch:
      tags: [deals]
      summary: Update a deal's fields (never its stage)
      operationId: updateDeal
      x-kasuwa-implemented: true
      x-kasuwa-audited: true
      x-kasuwa-permission: deal.write
      x-kasuwa-screens: ['P06/05', 'P06/06']
      x-kasuwa-error-order: ['404 not_found', '403 not_permitted', '400 validation_failed', '409 stale_write']
      x-kasuwa-rights:
        admin: any
        programme_manager: any
        team_lead: any
        agent: own
        qa_analyst: none
        client_portal: none
      description: |
        Partial update. **The body is `version` plus ONLY the fields the
        person changed (D-L102)**, judged against the deal the form was
        opened on; absent properties are unchanged and `null` clears a
        nullable field. `version` must equal the deal's current `version`,
        otherwise `409 stale_write`: re-read, re-apply the person's own
        edits, and never resend a field they did not touch.

        **Never the stage.** `stageId` changes only through moveDeal
        (D-L88); sending `stageId`, `pipelineId` or `programmeId` here is
        `400` (the body is closed). A deal never changes programme.

        **Rights (D-L88).** `deal.write` in the deal's programme. **Agents
        edit their own deals** (owner is the caller); `team_lead`,
        `programme_manager` and `admin` edit any deal in the programme
        (`deal.write_any`). A won or lost deal is edited only with
        `deal.write_any`. Anything else is `403 not_permitted`, decided
        before the body is read. **When field security withholds
        `ownerUserId` from the caller, `own` acts as `none`** (D-L115): a
        caller without `deal.write_any` gets the same `403 not_permitted`
        for every deal, theirs or not, so the answer never tells who owns
        a deal. Changing the owner to anyone but the
        caller, or clearing it, needs `deal.reassign` (`team_lead`,
        `programme_manager`, `admin`), otherwise `403` with
        `details[].code: owner_not_self`. Each field sent needs edit under
        field security, otherwise `403` with
        `details[].code: field_not_editable`. A caller cannot clear a field
        they cannot read.

        **References and money** as createDeal, judged in the deal's
        programme (`400 unknown_reference`, `400 unknown_currency`).

        **Order:** `404`, `403` (the action, `owner_not_self`,
        `field_not_editable`), `400`, then `409 stale_write`. Every update
        writes one audit event naming the fields that changed, never their
        values, with one exception: **a reassignment records the before and
        after owners' user ids** (`ownerUserId`, in canonical lower case,
        `null` for no owner; never a name, D-L71, as for contacts). Every
        other field is recorded by name only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDealRequest' }
            examples:
              nextStep:
                summary: The person changed the next step only
                value:
                  version: 5
                  nextStep: Call the buyer on Friday
              closeAndAmount:
                summary: The person changed the close date and the amount
                value:
                  version: 5
                  expectedCloseDate: '2026-11-14'
                  amount: { amountMinor: '1650000000', currency: NGN }
              reassign:
                summary: A team lead gives the deal to someone else
                value:
                  version: 5
                  ownerUserId: 8d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f02
      responses:
        '200':
          description: The updated deal, field security applied. `version` has advanced.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
              example:
                id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d07
                programmeId: 0b6a1f3e-2c4d-4e5f-8a9b-0c1d2e3f4a01
                pipelineId: 3a4b5c6d-7e8f-4a0b-8c1d-2e3f4a5b6c01
                stageId: 5d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f04
