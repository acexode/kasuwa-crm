  /api/v1/pipelines/{pipelineId}/deals:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [deals]
      summary: List a pipeline's deals — the P06/01b list view
      operationId: listDeals
      x-kasuwa-implemented: true
      x-kasuwa-screens: ['P06/01b']
      x-kasuwa-error-order: ['404 not_found', '400 validation_failed']
      x-kasuwa-rights:
        admin: read
        programme_manager: read
        team_lead: read
        agent: read
        qa_analyst: read
        client_portal: none
      description: |
        The P06/01b list view: the pipeline's deals as Deal rows under Deal
        field security, with the board's filters. Every stage, lost
        included; `stageId` narrows to some stages. Won and lost deals that
        closed before `closedSince` (default 90 days before the request) are
        left out; open deals ignore it.

        **Scope.** The pipeline must be readable by the caller; anything
        else is the one `404 not_found` body, decided first. A read, so no
        `403`; a `client_portal` caller gets the same `404` (D-L115).

        **Filters** follow getPipelineBoard: `q` on `name`, and a filter on a
        withheld field is `400 validation_failed` with
        `details[].code: field_withheld` at the parameter. A `stageId` that
        is not a stage of this pipeline is `400 validation_failed` with
        `details[].code: unknown_reference`. Unknown query parameters are
        ignored, never honoured.

        **No totals** (D-P13 stands for record lists). The list view's footer
        totals are the board's per-currency totals, read from
        getPipelineBoard with the same filters; this list never counts.

        **Sort** is one of a fixed set of keys field security never
        withholds, a leading `-` descending, ties broken by `id` in the same
        direction. Never `amount`, `expectedCloseDate` or the owner: ordering
        by a withheld value leaks it one comparison at a time. Keyset only:
        `{ data, nextCursor }`, no total, count or offset.

        `Cache-Control: no-store` on every answer.
      parameters:
        - $ref: '#/components/parameters/DealSearch'
        - $ref: '#/components/parameters/DealOwnerFilter'
        - $ref: '#/components/parameters/CloseFrom'
        - $ref: '#/components/parameters/CloseTo'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/ClosedSince'
        - name: stageId
          in: query
          required: false
          description: Any of these stages of this pipeline. Repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, format: uuid }
        - name: sort
          in: query
          required: false
          description: |
            One of a fixed set of never-withheld keys; a leading `-` is
            descending. Ties break on `id`, so the keyset is total.
          schema:
            type: string
            enum: ['-updatedAt', 'updatedAt', '-createdAt', 'createdAt', 'name', '-name', 'stageEnteredAt', '-stageEnteredAt']
            default: '-updatedAt'
        - $ref: '#/components/parameters/DealCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
