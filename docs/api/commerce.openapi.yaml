openapi: 3.1.0

info:
  title: Kasuwa Commerce API
  version: 0.1.0-T-0177
  description: |
    Programme-scoped product catalogue (T-0164), quotes (T-0165 / D-L211),
    discount approvals (T-0166), and quote PDF / email send (T-0167). Currencies
    NGN/GHS/KES/ZAR only (B6). Money is never a float — `amountMinor` is a string
    of digits plus an ISO currency code.


    Scope is resolved from the session. A programme the caller cannot reach, a
    product in another programme, and a missing id all answer `404 not_found`
    with one body. Every response is `Cache-Control: no-store`. Send fails closed
    until a real email provider exists (503 `service_unavailable`); WhatsApp
    quote delivery is after S3.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Error:
      $ref: './admin.openapi.yaml#/components/schemas/Error'
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
          description: Amount in minor units, never a float.
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, name, sku]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
          nullable: true
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - name
        - description
        - sku
        - status
        - taxProfileId
        - version
        - variants
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        taxProfileId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaxProfile:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, rateBps]
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        rateBps:
          type: integer
          minimum: 0
          maximum: 10000
    PriceBookEntry:
      type: object
      additionalProperties: false
      required: [id, priceBookId, productId, variantId, amountMinor, currency]
      properties:
        id:
          type: string
          format: uuid
        priceBookId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
    PriceBook:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, currency, entries]
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PriceBookEntry'
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        taxProfileId:
          type: string
          format: uuid
        variants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
              sku:
                type: string
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        taxProfileId:
          type: string
          format: uuid
          nullable: true
    UpsertPriceBookEntryRequest:
      type: object
      additionalProperties: false
      required: [productId, amountMinor, currency]
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]

    QuoteLine:
      type: object
      additionalProperties: false
      required: [id, productId, variantId, quantity, unitAmountMinor, discountBps]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1, maximum: 999999 }
        unitAmountMinor:
          type: string
          pattern: '^\\d{1,18}$'
          description: Snapshot of the price book entry when the line was written.
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - priceBookId
        - dealId
        - contactId
        - currency
        - status
        - discountBps
        - validUntil
        - version
        - lines
        - subtotalMinor
        - discountMinor
        - totalMinor
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        priceBookId: { type: string, format: uuid }
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
          description: The price book's currency; fixed at create and never changes.
        status:
          type: string
          enum: [draft, sent, accepted, rejected, expired, cancelled]
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
        subtotalMinor: { type: string, pattern: '^\\d{1,18}$' }
        discountMinor: { type: string, pattern: '^\\d{1,18}$' }
        totalMinor: { type: string, pattern: '^\\d{1,18}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [priceBookId, lines]
      properties:
        priceBookId:
          type: string
          format: uuid
          description: A price book of the same programme. Sets the quote's currency; a posted currency is refused.
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            description: A line carries no price; the server reads it from the quote's price book (D-L211).
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999999 }
              discountBps: { type: integer, minimum: 0, maximum: 10000 }
    UpdateQuoteRequest:
      type: object
      additionalProperties: false
      properties:
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999999 }
              discountBps: { type: integer, minimum: 0, maximum: 10000 }
    SetQuoteStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, sent, accepted, rejected, expired, cancelled]
    SendQuoteRequest:
      type: object
      additionalProperties: false
      required: [channel, to]
      properties:
        channel:
          type: string
          enum: [email]
          description: Email only until WhatsApp quote delivery after S3.
        to:
          type: string
          format: email
          maxLength: 320
          description: Recipient address. Never returned; responses carry toMasked only.
    QuoteSend:
      type: object
      additionalProperties: false
      required:
        - id
        - quoteId
        - programmeId
        - channel
        - status
        - toMasked
        - providerMessageId
        - quoteVersion
        - createdAt
      properties:
        id: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        channel: { type: string, enum: [email] }
        status: { type: string, enum: [sent] }
        toMasked:
          type: string
          description: Masked recipient (portal maskEmail shape). Never the full address.
        providerMessageId: { type: string, nullable: true }
        quoteVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    QuoteApproval:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - quoteId
        - requestedByUserId
        - discountBps
        - status
        - decidedByUserId
        - decidedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        requestedByUserId: { type: string, format: uuid }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedByUserId: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
    TaxLine:
      type: object
      additionalProperties: false
      required: [id, code, rateBps, amountMinor]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        rateBps: { type: integer, minimum: 0, maximum: 10000 }
        amountMinor: { type: string, pattern: '^\\d{1,18}$' }
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [id, description, quantity, unitAmountMinor]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitAmountMinor: { type: string, pattern: '^\\d{1,18}$' }
    Invoice:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - quoteId
        - number
        - status
        - currency
        - totalMinor
        - taxMinor
        - lines
        - taxLines
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid, nullable: true }
        number: { type: string }
        status: { type: string, enum: [draft, issued, paid, void, overdue] }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        totalMinor: { type: string, pattern: '^\\d{1,18}$' }
        taxMinor: { type: string, pattern: '^\\d{1,18}$' }
        lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
        taxLines: { type: array, items: { $ref: '#/components/schemas/TaxLine' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SetInvoiceStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [draft, issued, paid, void, overdue] }
    Einvoice:
      type: object
      additionalProperties: false
      required: [id, programmeId, invoiceId, irn, status, qrPayload, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        irn: { type: string, nullable: true }
        status: { type: string, enum: [draft, submitted, cleared, failed] }
        qrPayload: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FxRate:
      type: object
      additionalProperties: false
      required: [id, programmeId, baseCurrency, quoteCurrency, rateMicros, effectiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        baseCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        quoteCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        rateMicros: { type: string, pattern: '^\\d{1,18}$' }
        effectiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreateFxRateRequest:
      type: object
      additionalProperties: false
      required: [baseCurrency, quoteCurrency, rateMicros]
      properties:
        baseCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        quoteCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        rateMicros: { type: string, pattern: '^\\d{1,18}$' }
        effectiveAt: { type: string, format: date-time }
    FxLock:
      type: object
      additionalProperties: false
      required: [id, programmeId, dealId, rateMicros, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        rateMicros: { type: string, pattern: '^\\d{1,18}$' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreateFxLockRequest:
      type: object
      additionalProperties: false
      required: [baseCurrency, quoteCurrency]
      properties:
        baseCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        quoteCurrency: { type: string, enum: [NGN, GHS, KES, ZAR] }
    BillingSchedule:
      type: object
      additionalProperties: false
      required: [id, programmeId, invoiceId, cadence, nextRunAt, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid, nullable: true }
        cadence: { type: string, enum: [monthly, quarterly, yearly] }
        nextRunAt: { type: string, format: date-time }
        status: { type: string, enum: [active, paused, ended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBillingScheduleRequest:
      type: object
      additionalProperties: false
      required: [cadence]
      properties:
        cadence: { type: string, enum: [monthly, quarterly, yearly] }
        nextRunAt: { type: string, format: date-time }
    SetBillingScheduleStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, ended] }
    BillingGenerateResult:
      type: object
      additionalProperties: false
      required: [schedule, invoiceGeneration]
      properties:
        schedule: { $ref: '#/components/schemas/BillingSchedule' }
        invoiceGeneration: { type: string, enum: [deferred] }
    MobilePayment:
      type: object
      additionalProperties: false
      required: [id, programmeId, providerKind, status, amountMinor, currency, providerCollectionId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        providerKind: { type: string, enum: [mpesa, momo, fake] }
        status: { type: string, enum: [pending, paid, failed, expired] }
        amountMinor: { type: string, pattern: '^\\d{1,18}$' }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR] }
        providerCollectionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateMobilePaymentRequest:
      type: object
      additionalProperties: false
      required: [kind, idempotencyKey]
      properties:
        kind: { type: string, enum: [mpesa, momo] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    SetMobilePaymentStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [paid, expired] }


security:
  - bearerAuth: []

paths:
  /api/v1/programmes/{programmeId}/products:
    get:
      operationId: listProducts
      x-kasuwa-implemented: true
      summary: List products in a programme
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Products in the programme
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProduct
      x-kasuwa-implemented: true
      summary: Create a product
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/products/{productId}:
    patch:
      operationId: updateProduct
      x-kasuwa-implemented: true
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found or not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/price-books:
    get:
      operationId: listPriceBooks
      x-kasuwa-implemented: true
      summary: List price books with entries
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Price books
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceBook'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/price-books/{priceBookId}/entries:
    put:
      operationId: upsertPriceBookEntry
      x-kasuwa-implemented: true
      summary: Upsert a price-book entry
      parameters:
        - name: priceBookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPriceBookEntryRequest'
      responses:
        '200':
          description: Entry upserted
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceBookEntry'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Price book, product or variant not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/tax-profiles:
    get:
      operationId: listTaxProfiles
      x-kasuwa-implemented: true
      summary: List tax profiles
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tax profiles
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/quotes:
    get:
      operationId: listQuotes
      x-kasuwa-implemented: true
      summary: List quotes in a programme
      security: [{ bearerAuth: [] }]
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quotes
          headers:
