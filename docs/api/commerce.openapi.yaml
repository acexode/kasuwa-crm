  /api/v1/programmes/{programmeId}/quotes/{quoteId}/payment-links:
    post:
      operationId: createPaymentLink
      x-kasuwa-implemented: true
      summary: Create a payment link for a sent or accepted quote
      description: |
        Amount comes from the quote total. The caller supplies an idempotency
        key and no amount. Requires `quotes.write`. A repeated key returns the
        original link.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: quoteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentLinkRequest' }
      responses:
        '201':
          description: Payment link
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLink' }
        '400':
          description: Validation failed, or the quote is not sent or accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not permitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Quote not found or not reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Payment provider unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/payment-links/{linkId}:
    get:
      operationId: getPaymentLink
      x-kasuwa-implemented: true
      summary: Read a payment link the caller can reach
      security: [{ bearerAuth: [] }]
      parameters:
        - name: linkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment link
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLink' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Link not found or not reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/{provider}/{tenantSlug}:
    post:
      operationId: receivePaymentWebhook
      x-kasuwa-implemented: true
      summary: Apply a signed payment event
      description: |
        No bearer token. Unknown workspace, bad signature, unreadable body and
        unknown link all answer 401 with one body. A repeated event id is 200
        with `replay: true` and does not apply twice. `paid` updates the quote.
        The deal moves to the pipeline's won stage only when the current stage
        has a transition there and that stage has no requirements.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z]{1,32}$' }
        - name: tenantSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event applied, or already applied
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentWebhookResult' }
        '401':
          description: Not authenticated. Same body for an unknown slug, a bad signature and an unknown link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

