openapi: 3.1.0

info:
  title: Kasuwa Commerce API
  version: 0.1.0-T-0169
  description: |
    Programme-scoped product catalogue (T-0164), quotes (T-0165 / D-L211),
    discount approvals (T-0166), quote PDF / email send (T-0167), and payment
    links (T-0169, D-A3). Currencies NGN/GHS/KES/ZAR only (B6). Money is never a
    float — `amountMinor` is a string of digits plus an ISO currency code.
    `paid` is set only by the payment webhook. The response never carries a
    card number: a provider reference is an opaque link id.


    Scope is resolved from the session. A programme the caller cannot reach, a
    product in another programme, and a missing id all answer `404 not_found`
    with one body. Every response is `Cache-Control: no-store`. Send fails closed
    until a real email provider exists (503 `service_unavailable`); WhatsApp
    quote delivery is after S3.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Error:
      $ref: './admin.openapi.yaml#/components/schemas/Error'
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
          description: Amount in minor units, never a float.
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, name, sku]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
          nullable: true
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - name
        - description
        - sku
        - status
        - taxProfileId
        - version
        - variants
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        taxProfileId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaxProfile:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, rateBps]
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        rateBps:
          type: integer
          minimum: 0
          maximum: 10000
    PriceBookEntry:
      type: object
      additionalProperties: false
      required: [id, priceBookId, productId, variantId, amountMinor, currency]
      properties:
        id:
          type: string
          format: uuid
        priceBookId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
    PriceBook:
      type: object
      additionalProperties: false
      required: [id, programmeId, name, currency, entries]
      properties:
        id:
          type: string
          format: uuid
        programmeId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PriceBookEntry'
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        sku:
          type: string
        taxProfileId:
          type: string
          format: uuid
        variants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
              sku:
                type: string
    UpdateProductRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, archived]
        taxProfileId:
          type: string
          format: uuid
          nullable: true
    UpsertPriceBookEntryRequest:
      type: object
      additionalProperties: false
      required: [productId, amountMinor, currency]
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        amountMinor:
          type: string
          pattern: '^\\d{1,18}$'
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]

    QuoteLine:
      type: object
      additionalProperties: false
      required: [id, productId, variantId, quantity, unitAmountMinor, discountBps]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        variantId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1, maximum: 999999 }
        unitAmountMinor:
          type: string
          pattern: '^\\d{1,18}$'
          description: Snapshot of the price book entry when the line was written.
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
    Quote:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - priceBookId
        - dealId
        - contactId
        - currency
        - status
        - discountBps
        - validUntil
        - version
        - lines
        - subtotalMinor
        - discountMinor
        - totalMinor
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        priceBookId: { type: string, format: uuid }
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
          description: The price book's currency; fixed at create and never changes.
        status:
          type: string
          enum: [draft, sent, accepted, rejected, expired, cancelled, paid]
          description: paid is webhook-only and is not accepted by setQuoteStatus.
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
        subtotalMinor: { type: string, pattern: '^\\d{1,18}$' }
        discountMinor: { type: string, pattern: '^\\d{1,18}$' }
        totalMinor: { type: string, pattern: '^\\d{1,18}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [priceBookId, lines]
      properties:
        priceBookId:
          type: string
          format: uuid
          description: A price book of the same programme. Sets the quote's currency; a posted currency is refused.
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            description: A line carries no price; the server reads it from the quote's price book (D-L211).
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999999 }
              discountBps: { type: integer, minimum: 0, maximum: 10000 }
    UpdateQuoteRequest:
      type: object
      additionalProperties: false
      properties:
        dealId: { type: string, format: uuid, nullable: true }
        contactId: { type: string, format: uuid, nullable: true }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        validUntil: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 999999 }
              discountBps: { type: integer, minimum: 0, maximum: 10000 }
    SetQuoteStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, sent, accepted, rejected, expired, cancelled]
    CreatePaymentLinkRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    PaymentLink:
      type: object
      additionalProperties: false
      required: [id, programmeId, quoteId, providerLinkId, status, amountMinor, currency, url, expiresAt, paidAt]
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        providerLinkId: { type: string }
        status:
          type: string
          enum: [pending, paid, expired]
        amountMinor: { type: string, pattern: '^\\d{1,18}$' }
        currency:
          type: string
          enum: [NGN, GHS, KES, ZAR]
        url: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
    PaymentWebhookResult:
      type: object
      additionalProperties: false
      required: [status, replay, dealMoved]
      properties:
        status:
          type: string
          enum: [pending, paid, expired]
        replay: { type: boolean }
        dealMoved: { type: boolean }
    SendQuoteRequest:
      type: object
      additionalProperties: false
      required: [channel, to]
      properties:
        channel:
          type: string
          enum: [email]
          description: Email only until WhatsApp quote delivery after S3.
        to:
          type: string
          format: email
          maxLength: 320
          description: Recipient address. Never returned; responses carry toMasked only.
    QuoteSend:
      type: object
      additionalProperties: false
      required:
        - id
        - quoteId
        - programmeId
        - channel
        - status
        - toMasked
        - providerMessageId
        - quoteVersion
        - createdAt
      properties:
        id: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        channel: { type: string, enum: [email] }
        status: { type: string, enum: [sent] }
        toMasked:
          type: string
          description: Masked recipient (portal maskEmail shape). Never the full address.
        providerMessageId: { type: string, nullable: true }
        quoteVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    QuoteApproval:
      type: object
      additionalProperties: false
      required:
        - id
        - programmeId
        - quoteId
        - requestedByUserId
        - discountBps
        - status
        - decidedByUserId
        - decidedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        requestedByUserId: { type: string, format: uuid }
        discountBps: { type: integer, minimum: 0, maximum: 10000 }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedByUserId: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DecideApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }


security:
  - bearerAuth: []

paths:
  /api/v1/programmes/{programmeId}/products:
    get:
      operationId: listProducts
      x-kasuwa-implemented: true
      summary: List products in a programme
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Products in the programme
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProduct
      x-kasuwa-implemented: true
      summary: Create a product
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/products/{productId}:
    patch:
      operationId: updateProduct
      x-kasuwa-implemented: true
      summary: Update a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found or not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/price-books:
    get:
      operationId: listPriceBooks
      x-kasuwa-implemented: true
      summary: List price books with entries
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Price books
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PriceBook'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/price-books/{priceBookId}/entries:
    put:
      operationId: upsertPriceBookEntry
      x-kasuwa-implemented: true
      summary: Upsert a price-book entry
      parameters:
        - name: priceBookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPriceBookEntryRequest'
      responses:
        '200':
          description: Entry upserted
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceBookEntry'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing the catalogue.write action (not_permitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Price book, product or variant not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/tax-profiles:
    get:
      operationId: listTaxProfiles
      x-kasuwa-implemented: true
      summary: List tax profiles
      parameters:
        - name: programmeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tax profiles
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/programmes/{programmeId}/quotes:
    get:
      operationId: listQuotes
      x-kasuwa-implemented: true
      summary: List quotes in a programme
      security: [{ bearerAuth: [] }]
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quotes
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Quote' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Programme not reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createQuote
      x-kasuwa-implemented: true
      summary: Create a draft quote
      security: [{ bearerAuth: [] }]
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteRequest' }
      responses:
        '201':
          description: Created
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400':
          description: Validation failed (validation_failed), or a product or variant has no price in the quote's book (no_price)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the quotes.write action (not_permitted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Programme, price book, deal, contact or product not reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/quotes/{quoteId}:
    get:
      operationId: getQuote
      x-kasuwa-implemented: true
      summary: Get a quote
      security: [{ bearerAuth: [] }]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Quote
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateQuote
      x-kasuwa-implemented: true
      summary: Update a draft quote
      security: [{ bearerAuth: [] }]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuoteRequest' }
      responses:
        '200':
          description: Updated
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400':
          description: Validation failed (validation_failed), or a product or variant has no price in the quote's book (no_price)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing the quotes.write action (not_permitted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Not editable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/quotes/{quoteId}/pdf:
    get:
      operationId: renderQuotePdf
      x-kasuwa-implemented: true
      x-kasuwa-screens: [P21]
      summary: Render a deterministic PDF for a quote
      security: [{ bearerAuth: [] }]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF bytes
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
            Content-Type: { schema: { type: string }, example: application/pdf }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/quotes/{quoteId}/send:
    post:
      operationId: sendQuote
      x-kasuwa-implemented: true
      x-kasuwa-screens: [P21]
      summary: Send a quote by email (fails closed until a real provider exists)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: quoteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendQuoteRequest' }
      responses:
        '202':
          description: Accepted and handed to the channel provider
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteSend' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not permitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Quote is not sendable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Channel provider unavailable (fail closed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/quotes/{quoteId}/status:
